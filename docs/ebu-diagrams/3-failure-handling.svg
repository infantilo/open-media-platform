<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14213d"/></marker><marker id="as_ink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#14213d"/></marker><marker id="a_blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="as_blue" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2563eb"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="as_teal" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0d9488"/></marker><marker id="a_amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="as_amber" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d97706"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as_red" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker><marker id="a_violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="as_violet" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c3aed"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c677d"/></marker><marker id="as_mute" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5c677d"/></marker><marker id="a_pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="as_pink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#db2777"/></marker></defs><rect width="1920" height="1080" fill="#ffffff"/><text x="70" y="85" font-size="44" font-weight="700" fill="#14213d">3 · Failure handling: make-before-break wherever possible</text><text x="70" y="128" font-size="24" fill="#5c677d">A problem with a node, a host or an orchestrator is solved by moving work, not by stopping the programme.</text><rect x="70" y="146" width="120" height="5" rx="2" fill="#2563eb"/><rect x="70" y="180" width="290" height="180" rx="14" fill="#fdecc8" stroke="#d97706" stroke-width="2.5"/><text x="215.0" y="279.1" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">Node crash</text><rect x="400" y="180" width="420" height="180" rx="14" fill="#eef1f6" stroke="#d97706" stroke-width="2.5"/><text x="610.0" y="263.7" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Detect</text><text x="610.0" y="294.55199999999996" text-anchor="middle" font-size="18" fill="#5c677d">Host agent / launcher sees the exit</text><rect x="850" y="180" width="620" height="180" rx="14" fill="#eef1f6" stroke="#d97706" stroke-width="2.5"/><text x="1160.0" y="252.00000000000003" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Act</text><text x="1160.0" y="282.852" text-anchor="middle" font-size="18" fill="#5c677d">Restart with back-off; state re-applied; connections</text><text x="1160.0" y="306.25199999999995" text-anchor="middle" font-size="18" fill="#5c677d">re-wired</text><rect x="1500" y="180" width="350" height="180" rx="14" fill="#eef1f6" stroke="#d97706" stroke-width="2.5"/><text x="1675.0" y="252.00000000000003" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Result</text><text x="1675.0" y="282.852" text-anchor="middle" font-size="18" fill="#5c677d">short gap (seconds) unless a</text><text x="1675.0" y="306.25199999999995" text-anchor="middle" font-size="18" fill="#5c677d">standby exists</text><line x1="360" y1="270" x2="400" y2="270" stroke="#d97706" stroke-width="3" marker-end="url(#a_amber)"/><line x1="820" y1="270" x2="850" y2="270" stroke="#d97706" stroke-width="3" marker-end="url(#a_amber)"/><line x1="1470" y1="270" x2="1500" y2="270" stroke="#d97706" stroke-width="3" marker-end="url(#a_amber)"/><rect x="70" y="385" width="290" height="180" rx="14" fill="#d5f5f0" stroke="#0d9488" stroke-width="2.5"/><text x="215.0" y="484.1" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">Hot standby</text><rect x="400" y="385" width="420" height="180" rx="14" fill="#eef1f6" stroke="#0d9488" stroke-width="2.5"/><text x="610.0" y="468.7" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Detect</text><text x="610.0" y="499.55199999999996" text-anchor="middle" font-size="18" fill="#5c677d">Standby runs in parallel, same inputs</text><rect x="850" y="385" width="620" height="180" rx="14" fill="#eef1f6" stroke="#0d9488" stroke-width="2.5"/><text x="1160.0" y="468.7" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Act</text><text x="1160.0" y="499.55199999999996" text-anchor="middle" font-size="18" fill="#5c677d">Switch on loss or on demand; standby rebuilt afterwards</text><rect x="1500" y="385" width="350" height="180" rx="14" fill="#eef1f6" stroke="#0d9488" stroke-width="2.5"/><text x="1675.0" y="468.7" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Result</text><text x="1675.0" y="499.55199999999996" text-anchor="middle" font-size="18" fill="#5c677d">near-zero gap</text><line x1="360" y1="475" x2="400" y2="475" stroke="#0d9488" stroke-width="3" marker-end="url(#a_teal)"/><line x1="820" y1="475" x2="850" y2="475" stroke="#0d9488" stroke-width="3" marker-end="url(#a_teal)"/><line x1="1470" y1="475" x2="1500" y2="475" stroke="#0d9488" stroke-width="3" marker-end="url(#a_teal)"/><rect x="70" y="590" width="290" height="180" rx="14" fill="#e0eaff" stroke="#2563eb" stroke-width="2.5"/><text x="215.0" y="672.85" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">Planned move /</text><text x="215.0" y="705.35" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">maintenance</text><rect x="400" y="590" width="420" height="180" rx="14" fill="#eef1f6" stroke="#2563eb" stroke-width="2.5"/><text x="610.0" y="673.6999999999999" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Detect</text><text x="610.0" y="704.5519999999999" text-anchor="middle" font-size="18" fill="#5c677d">Operator drains a host or moves a node</text><rect x="850" y="590" width="620" height="180" rx="14" fill="#eef1f6" stroke="#2563eb" stroke-width="2.5"/><text x="1160.0" y="662.0" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Act</text><text x="1160.0" y="692.852" text-anchor="middle" font-size="18" fill="#5c677d">New instance started first; state copied; outputs</text><text x="1160.0" y="716.252" text-anchor="middle" font-size="18" fill="#5c677d">switched; old one stopped last</text><rect x="1500" y="590" width="350" height="180" rx="14" fill="#eef1f6" stroke="#2563eb" stroke-width="2.5"/><text x="1675.0" y="662.0" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Result</text><text x="1675.0" y="692.852" text-anchor="middle" font-size="18" fill="#5c677d">no gap (make-before-break),</text><text x="1675.0" y="716.252" text-anchor="middle" font-size="18" fill="#5c677d">roll back on failure</text><line x1="360" y1="680" x2="400" y2="680" stroke="#2563eb" stroke-width="3" marker-end="url(#a_blue)"/><line x1="820" y1="680" x2="850" y2="680" stroke="#2563eb" stroke-width="3" marker-end="url(#a_blue)"/><line x1="1470" y1="680" x2="1500" y2="680" stroke="#2563eb" stroke-width="3" marker-end="url(#a_blue)"/><rect x="70" y="795" width="290" height="180" rx="14" fill="#fde2e2" stroke="#dc2626" stroke-width="2.5"/><text x="215.0" y="894.1" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">Host failure</text><rect x="400" y="795" width="420" height="180" rx="14" fill="#eef1f6" stroke="#dc2626" stroke-width="2.5"/><text x="610.0" y="867.0" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Detect</text><text x="610.0" y="897.852" text-anchor="middle" font-size="18" fill="#5c677d">No telemetry for 45 s (not for a</text><text x="610.0" y="921.252" text-anchor="middle" font-size="18" fill="#5c677d">planned goodbye)</text><rect x="850" y="795" width="620" height="180" rx="14" fill="#eef1f6" stroke="#dc2626" stroke-width="2.5"/><text x="1160.0" y="867.0" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Act</text><text x="1160.0" y="897.852" text-anchor="middle" font-size="18" fill="#5c677d">Roles relocate to another host by placement rules; old</text><text x="1160.0" y="921.252" text-anchor="middle" font-size="18" fill="#5c677d">instance fenced off, stopped when host returns</text><rect x="1500" y="795" width="350" height="180" rx="14" fill="#eef1f6" stroke="#dc2626" stroke-width="2.5"/><text x="1675.0" y="878.6999999999999" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Result</text><text x="1675.0" y="909.5519999999999" text-anchor="middle" font-size="18" fill="#5c677d">gap = detection time + start</text><line x1="360" y1="885" x2="400" y2="885" stroke="#dc2626" stroke-width="3" marker-end="url(#a_red)"/><line x1="820" y1="885" x2="850" y2="885" stroke="#dc2626" stroke-width="3" marker-end="url(#a_red)"/><line x1="1470" y1="885" x2="1500" y2="885" stroke="#dc2626" stroke-width="3" marker-end="url(#a_red)"/><text x="70" y="1030" text-anchor="start" font-size="19" font-weight="400" fill="#5c677d">Orchestrator failure: another orchestrator takes over (consensus); running nodes keep running and are re-adopted. Media never depends on the control plane.</text><text x="1850" y="1064" text-anchor="end" font-size="17" fill="#5c677d">OpenMediaPlatform · open architecture based on EBU DMF, MXL, NMOS, SMPTE ST 2110</text></svg>