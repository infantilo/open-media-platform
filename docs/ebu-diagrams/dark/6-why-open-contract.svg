<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eaf0fa"/></marker><marker id="as_ink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#eaf0fa"/></marker><marker id="a_blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d9bff"/></marker><marker id="as_blue" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4d9bff"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#19c3b0"/></marker><marker id="as_teal" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#19c3b0"/></marker><marker id="a_amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker><marker id="as_amber" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#fb8c00"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef5350"/></marker><marker id="as_red" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#ef5350"/></marker><marker id="a_violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a45cff"/></marker><marker id="as_violet" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#a45cff"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a1ba"/></marker><marker id="as_mute" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#93a1ba"/></marker><marker id="a_pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f06292"/></marker><marker id="as_pink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#f06292"/></marker></defs><rect width="1920" height="1080" fill="#080c16"/><text x="70" y="85" font-size="44" font-weight="700" fill="#eaf0fa">6 · Why this design: from appliances to orchestrated functions</text><text x="70" y="128" font-size="24" fill="#93a1ba">What a broadcaster and a vendor each gain from the common contract.</text><rect x="70" y="146" width="120" height="5" rx="2" fill="#4d9bff"/><rect x="70" y="190" width="540" height="230" rx="14" fill="#3b1719" stroke="#ef5350" stroke-width="2.5"/><text x="340.0" y="252.7" text-anchor="middle" font-size="30" font-weight="700" fill="#eaf0fa">Today: appliance chain</text><text x="340.0" y="290.272" text-anchor="middle" font-size="23" fill="#93a1ba">fixed function per box, SDI cabling,</text><text x="340.0" y="320.17199999999997" text-anchor="middle" font-size="23" fill="#93a1ba">fixed capacity, vendor-specific</text><text x="340.0" y="350.07199999999995" text-anchor="middle" font-size="23" fill="#93a1ba">control, 1+1 hardware for every</text><text x="340.0" y="379.9719999999999" text-anchor="middle" font-size="23" fill="#93a1ba">redundancy</text><line x1="620" y1="305" x2="780" y2="305" stroke="#eaf0fa" stroke-width="6" marker-end="url(#a_ink)"/><rect x="790" y="190" width="1060" height="230" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1320.0" y="282.6" text-anchor="middle" font-size="30" font-weight="700" fill="#eaf0fa">Dynamic media facility</text><text x="1320.0" y="320.172" text-anchor="middle" font-size="23" fill="#93a1ba">functions start where capacity exists; media is shared on the same host or over</text><text x="1320.0" y="350.072" text-anchor="middle" font-size="23" fill="#93a1ba">IP; one control model for all; redundancy by software where it matters</text><rect x="70" y="470" width="425" height="200" rx="14" fill="#271a47" stroke="#a45cff" stroke-width="2.5"/><text x="282" y="515" text-anchor="middle" font-size="27" font-weight="700" fill="#eaf0fa">Open exchange</text><text x="282" y="575.0" text-anchor="middle" font-size="21" fill="#eaf0fa">MXL, ST 2110 and RDMA fabrics:</text><text x="282" y="603.35" text-anchor="middle" font-size="21" fill="#eaf0fa">any function that implements them</text><text x="282" y="631.7" text-anchor="middle" font-size="21" fill="#eaf0fa">can connect to any other</text><rect x="520" y="470" width="425" height="200" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="732" y="515" text-anchor="middle" font-size="27" font-weight="700" fill="#eaf0fa">Self-describing nodes</text><text x="732" y="575.0" text-anchor="middle" font-size="21" fill="#eaf0fa">IS-04 / IS-12/14: no per-vendor</text><text x="732" y="603.35" text-anchor="middle" font-size="21" fill="#eaf0fa">control code, no orchestrator</text><text x="732" y="631.7" text-anchor="middle" font-size="21" fill="#eaf0fa">release</text><rect x="970" y="470" width="425" height="200" rx="14" fill="#10244a" stroke="#4d9bff" stroke-width="2.5"/><text x="1182" y="515" text-anchor="middle" font-size="27" font-weight="700" fill="#eaf0fa">Replaceable parts</text><text x="1182" y="575.0" text-anchor="middle" font-size="21" fill="#eaf0fa">swap or add a function without</text><text x="1182" y="603.35" text-anchor="middle" font-size="21" fill="#eaf0fa">touching the rest; no lock-in</text><rect x="1420" y="470" width="425" height="200" rx="14" fill="#3a2a0e" stroke="#fb8c00" stroke-width="2.5"/><text x="1632" y="515" text-anchor="middle" font-size="27" font-weight="700" fill="#eaf0fa">Elastic resources</text><text x="1632" y="575.0" text-anchor="middle" font-size="21" fill="#eaf0fa">place, move and scale across</text><text x="1632" y="603.35" text-anchor="middle" font-size="21" fill="#eaf0fa">on-prem and cloud hosts</text><rect x="70" y="710" width="880" height="290" rx="14" fill="#172033" stroke="#3b4d6e" stroke-width="2.5"/><text x="100" y="760" text-anchor="start" font-size="29" font-weight="700" fill="#eaf0fa">For broadcasters</text><text x="100" y="815" text-anchor="start" font-size="23" font-weight="400" fill="#eaf0fa">• Pick best-of-breed per function, mix vendors</text><text x="100" y="861" text-anchor="start" font-size="23" font-weight="400" fill="#eaf0fa">• Run 24/7 and maintain without taking programme off air</text><text x="100" y="907" text-anchor="start" font-size="23" font-weight="400" fill="#eaf0fa">• Reuse hardware across studios, events and cloud</text><text x="100" y="953" text-anchor="start" font-size="23" font-weight="400" fill="#eaf0fa">• Plan capacity over time, not for the peak of every box</text><rect x="970" y="710" width="880" height="290" rx="14" fill="#172033" stroke="#3b4d6e" stroke-width="2.5"/><text x="1000" y="760" text-anchor="start" font-size="29" font-weight="700" fill="#eaf0fa">For vendors</text><text x="1000" y="815" text-anchor="start" font-size="23" font-weight="400" fill="#eaf0fa">• One integration surface instead of one per customer</text><text x="1000" y="861" text-anchor="start" font-size="23" font-weight="400" fill="#eaf0fa">• Sell the function (software), not only the box</text><text x="1000" y="907" text-anchor="start" font-size="23" font-weight="400" fill="#eaf0fa">• Start at Level A, move up to Level C when ready</text><text x="1000" y="953" text-anchor="start" font-size="23" font-weight="400" fill="#eaf0fa">• Compete on quality of the function, not on lock-in</text><text x="1850" y="1064" text-anchor="end" font-size="17" fill="#93a1ba">OpenMediaPlatform · open architecture based on EBU DMF, MXL, NMOS, SMPTE ST 2110</text></svg>