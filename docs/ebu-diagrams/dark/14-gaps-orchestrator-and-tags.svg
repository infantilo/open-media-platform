<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eaf0fa"/></marker><marker id="as_ink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#eaf0fa"/></marker><marker id="a_blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d9bff"/></marker><marker id="as_blue" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4d9bff"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#19c3b0"/></marker><marker id="as_teal" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#19c3b0"/></marker><marker id="a_amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker><marker id="as_amber" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#fb8c00"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef5350"/></marker><marker id="as_red" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#ef5350"/></marker><marker id="a_violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a45cff"/></marker><marker id="as_violet" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#a45cff"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a1ba"/></marker><marker id="as_mute" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#93a1ba"/></marker><marker id="a_pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f06292"/></marker><marker id="as_pink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#f06292"/></marker></defs><rect width="1920" height="1080" fill="#080c16"/><text x="70" y="85" font-size="44" font-weight="700" fill="#eaf0fa">14 · What the standards do not cover</text><text x="70" y="128" font-size="24" fill="#93a1ba">Standards define parts and single connections. Our own bricks, led by the orchestrator, turn them into one working facility.</text><rect x="70" y="146" width="120" height="5" rx="2" fill="#4d9bff"/><rect x="70" y="175" width="1780" height="360" rx="18" fill="#3a2a0e" fill-opacity="0.45" stroke="#fb8c00" stroke-width="2" stroke-dasharray="3 0"/><text x="92" y="209" font-size="23" font-weight="700" fill="#fb8c00" letter-spacing="1">OUR OWN BRICKS: THE GAPS</text><rect x="91" y="222" width="330" height="120" rx="14" fill="#3a2a0e" stroke="#fb8c00" stroke-width="2.5"/><text x="256.0" y="263.05" text-anchor="middle" font-size="25" font-weight="700" fill="#eaf0fa">Placement</text><text x="256.0" y="295.191" text-anchor="middle" font-size="19" fill="#93a1ba">which host runs which node,</text><text x="256.0" y="319.89099999999996" text-anchor="middle" font-size="19" fill="#93a1ba">by load and network</text><text x="256.0" y="372" text-anchor="middle" font-size="17" font-weight="700" fill="#fb8c00">GAP</text><text x="256.0" y="400.0" text-anchor="middle" font-size="20" fill="#93a1ba">No standard decides where a</text><text x="256.0" y="427.0" text-anchor="middle" font-size="20" fill="#93a1ba">function runs.</text><rect x="443" y="222" width="330" height="120" rx="14" fill="#3a2a0e" stroke="#fb8c00" stroke-width="2.5"/><text x="608.0" y="263.05" text-anchor="middle" font-size="25" font-weight="700" fill="#eaf0fa">Workflows</text><text x="608.0" y="295.191" text-anchor="middle" font-size="19" fill="#93a1ba">start, stop and save whole</text><text x="608.0" y="319.89099999999996" text-anchor="middle" font-size="19" fill="#93a1ba">chains as one unit</text><text x="608.0" y="372" text-anchor="middle" font-size="17" font-weight="700" fill="#fb8c00">GAP</text><text x="608.0" y="400.0" text-anchor="middle" font-size="20" fill="#93a1ba">NMOS knows connections, not</text><text x="608.0" y="427.0" text-anchor="middle" font-size="20" fill="#93a1ba">productions.</text><rect x="795" y="222" width="330" height="120" rx="14" fill="#3a2a0e" stroke="#fb8c00" stroke-width="2.5"/><text x="960.0" y="263.05" text-anchor="middle" font-size="25" font-weight="700" fill="#eaf0fa">Make-before-break</text><text x="960.0" y="295.191" text-anchor="middle" font-size="19" fill="#93a1ba">start the replacement, hand</text><text x="960.0" y="319.89099999999996" text-anchor="middle" font-size="19" fill="#93a1ba">state over, then switch</text><text x="960.0" y="372" text-anchor="middle" font-size="17" font-weight="700" fill="#fb8c00">GAP</text><text x="960.0" y="400.0" text-anchor="middle" font-size="20" fill="#93a1ba">No standard moves a running</text><text x="960.0" y="427.0" text-anchor="middle" font-size="20" fill="#93a1ba">function without a gap.</text><rect x="1147" y="222" width="330" height="120" rx="14" fill="#3a2a0e" stroke="#fb8c00" stroke-width="2.5"/><text x="1312.0" y="263.05" text-anchor="middle" font-size="25" font-weight="700" fill="#eaf0fa">Roles and operating</text><text x="1312.0" y="295.191" text-anchor="middle" font-size="19" fill="#93a1ba">web shell, role-scoped</text><text x="1312.0" y="319.89099999999996" text-anchor="middle" font-size="19" fill="#93a1ba">consoles, rights, audit</text><text x="1312.0" y="372" text-anchor="middle" font-size="17" font-weight="700" fill="#fb8c00">GAP</text><text x="1312.0" y="400.0" text-anchor="middle" font-size="20" fill="#93a1ba">NMOS has no operator or</text><text x="1312.0" y="427.0" text-anchor="middle" font-size="20" fill="#93a1ba">rights model.</text><rect x="1499" y="222" width="330" height="120" rx="14" fill="#3a2a0e" stroke="#fb8c00" stroke-width="2.5"/><text x="1664.0" y="247.425" text-anchor="middle" font-size="25" font-weight="700" fill="#eaf0fa">Gateways, host</text><text x="1664.0" y="278.675" text-anchor="middle" font-size="25" font-weight="700" fill="#eaf0fa">agent</text><text x="1664.0" y="310.816" text-anchor="middle" font-size="19" fill="#93a1ba">bridge SRT, SDI, ST 2110;</text><text x="1664.0" y="335.51599999999996" text-anchor="middle" font-size="19" fill="#93a1ba">start nodes</text><text x="1664.0" y="372" text-anchor="middle" font-size="17" font-weight="700" fill="#fb8c00">GAP</text><text x="1664.0" y="400.0" text-anchor="middle" font-size="20" fill="#93a1ba">Standards describe the</text><text x="1664.0" y="427.0" text-anchor="middle" font-size="20" fill="#93a1ba">wire, not the bridge.</text><rect x="110" y="468" width="1700" height="52" rx="14" fill="#172033" stroke="#3b4d6e" stroke-width="2.5"/><text x="960.0" y="501.35" text-anchor="middle" font-size="21" font-weight="400" fill="#eaf0fa">Underneath, only published standards: IS-04 · IS-05 · IS-12/14 · IS-10 · BCP-008 · MXL. No private contract between orchestrator and node.</text><rect x="70" y="555" width="1780" height="470" rx="18" fill="#0b3436" fill-opacity="0.45" stroke="#19c3b0" stroke-width="2" stroke-dasharray="3 0"/><text x="92" y="589" font-size="23" font-weight="700" fill="#19c3b0" letter-spacing="1">TAG-BASED SWITCHING</text><text x="325" y="618" text-anchor="middle" font-size="18" font-weight="700" fill="#93a1ba">SOURCES carry tags</text><text x="1595" y="618" text-anchor="middle" font-size="18" font-weight="700" fill="#93a1ba">SINKS carry tags</text><line x1="540" y1="666" x2="1380" y2="758" stroke="#19c3b0" stroke-width="4" marker-end="url(#a_teal)"/><line x1="540" y1="758" x2="1380" y2="850" stroke="#19c3b0" stroke-width="4" marker-end="url(#a_teal)"/><line x1="540" y1="850" x2="1380" y2="666" stroke="#19c3b0" stroke-width="4" marker-end="url(#a_teal)"/><rect x="110" y="630" width="430" height="72" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="325.0" y="659.95" text-anchor="middle" font-size="21" font-weight="700" fill="#eaf0fa">Studio camera · video</text><text x="325.0" y="687.949" text-anchor="middle" font-size="16" fill="#93a1ba">role.program video.camera</text><rect x="110" y="722" width="430" height="72" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="325.0" y="751.95" text-anchor="middle" font-size="21" font-weight="700" fill="#eaf0fa">Studio camera · audio</text><text x="325.0" y="779.949" text-anchor="middle" font-size="16" fill="#93a1ba">role.program audio.stereo</text><rect x="110" y="814" width="430" height="72" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="325.0" y="843.95" text-anchor="middle" font-size="21" font-weight="700" fill="#eaf0fa">Commentary mic · audio</text><text x="325.0" y="871.949" text-anchor="middle" font-size="16" fill="#93a1ba">role.commentator audio.stereo</text><rect x="1380" y="630" width="430" height="72" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1595.0" y="659.95" text-anchor="middle" font-size="21" font-weight="700" fill="#eaf0fa">Monitor · audio in 1</text><text x="1595.0" y="687.949" text-anchor="middle" font-size="16" fill="#93a1ba">role.commentator</text><rect x="1380" y="722" width="430" height="72" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1595.0" y="751.95" text-anchor="middle" font-size="21" font-weight="700" fill="#eaf0fa">Monitor · video in</text><text x="1595.0" y="779.949" text-anchor="middle" font-size="16" fill="#93a1ba">role.program</text><rect x="1380" y="814" width="430" height="72" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1595.0" y="843.95" text-anchor="middle" font-size="21" font-weight="700" fill="#eaf0fa">Monitor · audio in 2</text><text x="1595.0" y="871.949" text-anchor="middle" font-size="16" fill="#93a1ba">role.program</text><rect x="700" y="640" width="520" height="250" rx="14" fill="#3a2a0e" stroke="#fb8c00" stroke-width="2.5"/><text x="960" y="676" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">Orchestrator matches</text><text x="730" y="722" text-anchor="start" font-size="20" font-weight="400" fill="#eaf0fa">1  same media type (video, audio, data)</text><text x="730" y="756" text-anchor="start" font-size="20" font-weight="400" fill="#eaf0fa">2  a shared tag, e.g. role.commentator</text><text x="730" y="790" text-anchor="start" font-size="20" font-weight="400" fill="#eaf0fa">3  media.* tags do not count</text><text x="730" y="824" text-anchor="start" font-size="20" font-weight="400" fill="#eaf0fa">4  optional: leftovers one to one, in order</text><text x="960" y="876" text-anchor="middle" font-size="19" font-weight="700" fill="#19c3b0">then it makes the IS-05 connection</text><text x="960" y="906" text-anchor="start" font-size="1" font-weight="400" fill="#eaf0fa"></text><text x="110" y="950" text-anchor="start" font-size="20" font-weight="700" fill="#eaf0fa">The same rule is used in:</text><rect x="110" y="962" width="410" height="46" rx="14" fill="#172033" stroke="#3b4d6e" stroke-width="2.5"/><text x="315.0" y="991.65" text-anchor="middle" font-size="19" font-weight="400" fill="#eaf0fa">X/Y panel: all ports of a node</text><rect x="540" y="962" width="410" height="46" rx="14" fill="#172033" stroke="#3b4d6e" stroke-width="2.5"/><text x="745.0" y="991.65" text-anchor="middle" font-size="19" font-weight="400" fill="#eaf0fa">Bouquets: saved tag rule</text><rect x="970" y="962" width="410" height="46" rx="14" fill="#172033" stroke="#3b4d6e" stroke-width="2.5"/><text x="1175.0" y="991.65" text-anchor="middle" font-size="19" font-weight="400" fill="#eaf0fa">Playout: live source by tag</text><rect x="1400" y="962" width="410" height="46" rx="14" fill="#172033" stroke="#3b4d6e" stroke-width="2.5"/><text x="1605.0" y="991.65" text-anchor="middle" font-size="19" font-weight="400" fill="#eaf0fa">Mixer: strip follows the tag</text><text x="1830" y="1048" text-anchor="start" font-size="1" font-weight="400" fill="#eaf0fa"></text><text x="1850" y="1064" text-anchor="end" font-size="17" fill="#93a1ba">OpenMediaPlatform · open architecture based on EBU DMF, MXL, NMOS, SMPTE ST 2110</text></svg>