<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eaf0fa"/></marker><marker id="as_ink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#eaf0fa"/></marker><marker id="a_blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d9bff"/></marker><marker id="as_blue" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4d9bff"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#19c3b0"/></marker><marker id="as_teal" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#19c3b0"/></marker><marker id="a_amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker><marker id="as_amber" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#fb8c00"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef5350"/></marker><marker id="as_red" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#ef5350"/></marker><marker id="a_violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a45cff"/></marker><marker id="as_violet" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#a45cff"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a1ba"/></marker><marker id="as_mute" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#93a1ba"/></marker><marker id="a_pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f06292"/></marker><marker id="as_pink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#f06292"/></marker></defs><rect width="1920" height="1080" fill="#080c16"/><text x="70" y="85" font-size="44" font-weight="700" fill="#eaf0fa">12 · How it is built: instructions, decisions, verification</text><text x="70" y="128" font-size="24" fill="#93a1ba">AI-assisted development under written rules: the owner decides, the assistant implements, every step must be checkable.</text><rect x="70" y="146" width="120" height="5" rx="2" fill="#4d9bff"/><rect x="70" y="175" width="890" height="525" rx="18" fill="#10244a" fill-opacity="0.45" stroke="#4d9bff" stroke-width="2" stroke-dasharray="3 0"/><text x="92" y="209" font-size="23" font-weight="700" fill="#4d9bff" letter-spacing="1">WHERE THINGS ARE WRITTEN</text><rect x="95" y="222" width="840" height="71" rx="14" fill="#10244a" stroke="#4d9bff" stroke-width="2.5"/><text x="515.0" y="251.14999999999998" text-anchor="middle" font-size="22" font-weight="700" fill="#eaf0fa">CLAUDE.md</text><text x="515.0" y="280.438" text-anchor="middle" font-size="17" fill="#93a1ba">project rules, loaded every session, points to the other documents</text><rect x="95" y="301" width="840" height="71" rx="14" fill="#10244a" stroke="#4d9bff" stroke-width="2.5"/><text x="515.0" y="330.15" text-anchor="middle" font-size="22" font-weight="700" fill="#eaf0fa">ARCHITECTURE.md</text><text x="515.0" y="359.438" text-anchor="middle" font-size="17" fill="#93a1ba">what and why: standards, stack, node contract, phases · 4.6k lines</text><rect x="95" y="380" width="840" height="71" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="515.0" y="409.15" text-anchor="middle" font-size="22" font-weight="700" fill="#eaf0fa">UMSETZUNG.md</text><text x="515.0" y="438.438" text-anchor="middle" font-size="17" fill="#93a1ba">how: steps with their checks, working rules, status checklist · 6.6k lines</text><rect x="95" y="459" width="840" height="71" rx="14" fill="#3a2a0e" stroke="#fb8c00" stroke-width="2.5"/><text x="515.0" y="488.15" text-anchor="middle" font-size="22" font-weight="700" fill="#eaf0fa">docs/decisions.md</text><text x="515.0" y="517.438" text-anchor="middle" font-size="17" fill="#93a1ba">append-only log: each decision, options, reasons · 30.8k lines</text><rect x="95" y="538" width="840" height="71" rx="14" fill="#172033" stroke="#3b4d6e" stroke-width="2.5"/><text x="515.0" y="567.1500000000001" text-anchor="middle" font-size="22" font-weight="700" fill="#eaf0fa">docs/ (44 files)</text><text x="515.0" y="596.4380000000001" text-anchor="middle" font-size="17" fill="#93a1ba">feature designs, node contracts, manuals, norm assessments</text><rect x="95" y="617" width="840" height="71" rx="14" fill="#271a47" stroke="#a45cff" stroke-width="2.5"/><text x="515.0" y="646.1500000000001" text-anchor="middle" font-size="22" font-weight="700" fill="#eaf0fa">Session memory (outside the repo)</text><text x="515.0" y="675.4380000000001" text-anchor="middle" font-size="17" fill="#93a1ba">pitfalls and the owner's standing rules, carried between sessions</text><rect x="985" y="175" width="865" height="525" rx="18" fill="#0b3436" fill-opacity="0.45" stroke="#19c3b0" stroke-width="2" stroke-dasharray="3 0"/><text x="1007" y="209" font-size="23" font-weight="700" fill="#19c3b0" letter-spacing="1">ONE STEP PER SESSION</text><rect x="1010" y="222" width="815" height="58" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1417.5" y="244.95" text-anchor="middle" font-size="21" font-weight="700" fill="#eaf0fa">1 Read</text><text x="1417.5" y="272.949" text-anchor="middle" font-size="16" fill="#93a1ba">rules, the plan section for this step, the status checklist</text><rect x="1010" y="287" width="815" height="58" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1417.5" y="309.95000000000005" text-anchor="middle" font-size="21" font-weight="700" fill="#eaf0fa">2 Do exactly one step</text><text x="1417.5" y="337.949" text-anchor="middle" font-size="16" fill="#93a1ba">sized for one session; no features taken early</text><rect x="1010" y="352" width="815" height="58" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1417.5" y="374.95000000000005" text-anchor="middle" font-size="21" font-weight="700" fill="#eaf0fa">3 Build</text><text x="1417.5" y="402.949" text-anchor="middle" font-size="16" fill="#93a1ba">norm first (read the text, name the version), fewest dependencies</text><rect x="1010" y="417" width="815" height="58" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1417.5" y="439.95000000000005" text-anchor="middle" font-size="21" font-weight="700" fill="#eaf0fa">4 Verify</text><text x="1417.5" y="467.949" text-anchor="middle" font-size="16" fill="#93a1ba">the step's listed checks must pass; if not, fix, do not move on</text><rect x="1010" y="482" width="815" height="58" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1417.5" y="504.95000000000005" text-anchor="middle" font-size="21" font-weight="700" fill="#eaf0fa">5 Record</text><text x="1417.5" y="532.949" text-anchor="middle" font-size="16" fill="#93a1ba">tick the checklist, log decisions, update the manual</text><rect x="1010" y="547" width="815" height="58" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1417.5" y="569.95" text-anchor="middle" font-size="21" font-weight="700" fill="#eaf0fa">6 Commit</text><text x="1417.5" y="597.949" text-anchor="middle" font-size="16" fill="#93a1ba">message starts with the step ID; push only when the owner asks</text><rect x="1010" y="622" width="815" height="62" rx="14" fill="#3a2a0e" stroke="#fb8c00" stroke-width="2.5"/><text x="1417.5" y="646.95" text-anchor="middle" font-size="21" font-weight="700" fill="#eaf0fa">Blocked or unclear?</text><text x="1417.5" y="674.949" text-anchor="middle" font-size="16" fill="#93a1ba">write 2 to 3 options with a recommendation; the owner decides</text><rect x="70" y="725" width="580" height="295" rx="14" fill="#10244a" fill-opacity="0.5" stroke="#4d9bff" stroke-width="2"/><text x="90" y="762" text-anchor="start" font-size="24" font-weight="700" fill="#eaf0fa">Why several documents</text><text x="90" y="800" text-anchor="start" font-size="18" font-weight="400" fill="#eaf0fa">• A model reads a limited window: small fixed rules,</text><text x="90" y="823.4" text-anchor="start" font-size="18" font-weight="400" fill="#eaf0fa">   then only the section needed</text><text x="90" y="852.8" text-anchor="start" font-size="18" font-weight="400" fill="#eaf0fa">• What/why, status and history change at different</text><text x="90" y="876.1999999999999" text-anchor="start" font-size="18" font-weight="400" fill="#eaf0fa">   speeds</text><text x="90" y="905.5999999999999" text-anchor="start" font-size="18" font-weight="400" fill="#eaf0fa">• The plan defines 'done' before work starts</text><text x="90" y="934.9999999999999" text-anchor="start" font-size="18" font-weight="400" fill="#eaf0fa">• Append-only decisions keep provenance</text><text x="90" y="964.3999999999999" text-anchor="start" font-size="18" font-weight="400" fill="#eaf0fa">• Cost: the documents grow large and need discipline</text><rect x="670" y="725" width="580" height="295" rx="14" fill="#0b3436" fill-opacity="0.5" stroke="#19c3b0" stroke-width="2"/><text x="690" y="762" text-anchor="start" font-size="24" font-weight="700" fill="#eaf0fa">Every step must be verifiable</text><text x="690" y="800" text-anchor="start" font-size="18" font-weight="400" fill="#eaf0fa">• Each step lists its checks before it starts</text><text x="690" y="829.4" text-anchor="start" font-size="18" font-weight="400" fill="#eaf0fa">• About 3.9k automated tests (Go, Rust, Deno)</text><text x="690" y="858.8" text-anchor="start" font-size="18" font-weight="400" fill="#eaf0fa">• Official AMWA NMOS test tool in CI</text><text x="690" y="888.1999999999999" text-anchor="start" font-size="18" font-weight="400" fill="#eaf0fa">• Live run in the real stack; browser click-through for</text><text x="690" y="911.5999999999999" text-anchor="start" font-size="18" font-weight="400" fill="#eaf0fa">   UI</text><text x="690" y="940.9999999999999" text-anchor="start" font-size="18" font-weight="400" fill="#eaf0fa">• Untested paths are labelled 'not verified on</text><text x="690" y="964.3999999999999" text-anchor="start" font-size="18" font-weight="400" fill="#eaf0fa">   hardware'</text><rect x="1270" y="725" width="580" height="295" rx="14" fill="#3a2a0e" fill-opacity="0.5" stroke="#fb8c00" stroke-width="2"/><text x="1290" y="762" text-anchor="start" font-size="24" font-weight="700" fill="#eaf0fa">Scale (measured 16 Nov 2026)</text><text x="1290" y="800" text-anchor="start" font-size="18" font-weight="400" fill="#eaf0fa">• About 430k lines incl. tests: Go 171k, Rust 138k,</text><text x="1290" y="823.4" text-anchor="start" font-size="18" font-weight="400" fill="#eaf0fa">   TypeScript/JS 113k</text><text x="1290" y="852.8" text-anchor="start" font-size="18" font-weight="400" fill="#eaf0fa">• 1,385 commits since 3 July 2026</text><text x="1290" y="882.1999999999999" text-anchor="start" font-size="18" font-weight="400" fill="#eaf0fa">• Core documents: about 47k lines</text><text x="1290" y="911.5999999999999" text-anchor="start" font-size="18" font-weight="400" fill="#eaf0fa">• AI usage in the retained logs, 19 Oct to 16 Nov:</text><text x="1290" y="934.9999999999999" text-anchor="start" font-size="18" font-weight="400" fill="#eaf0fa">   13.7k requests, 13.3M output tokens (earlier sessions</text><text x="1290" y="958.3999999999999" text-anchor="start" font-size="18" font-weight="400" fill="#eaf0fa">   not kept)</text><text x="1850" y="1064" text-anchor="end" font-size="17" fill="#93a1ba">OpenMediaPlatform · open architecture based on EBU DMF, MXL, NMOS, SMPTE ST 2110</text></svg>