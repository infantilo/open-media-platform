<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eaf0fa"/></marker><marker id="as_ink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#eaf0fa"/></marker><marker id="a_blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d9bff"/></marker><marker id="as_blue" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4d9bff"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#19c3b0"/></marker><marker id="as_teal" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#19c3b0"/></marker><marker id="a_amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker><marker id="as_amber" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#fb8c00"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef5350"/></marker><marker id="as_red" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#ef5350"/></marker><marker id="a_violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a45cff"/></marker><marker id="as_violet" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#a45cff"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a1ba"/></marker><marker id="as_mute" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#93a1ba"/></marker><marker id="a_pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f06292"/></marker><marker id="as_pink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#f06292"/></marker></defs><rect width="1920" height="1080" fill="#080c16"/><text x="70" y="85" font-size="44" font-weight="700" fill="#eaf0fa">15 · TAMS implemented: record, replay and time-shift</text><text x="70" y="128" font-size="24" fill="#93a1ba">The platform speaks the Time-addressable Media Store API, version 8.2, as a client. Live MXL flows go into the store on a TAI timeline.</text><rect x="70" y="146" width="120" height="5" rx="2" fill="#4d9bff"/><rect x="70" y="175" width="1780" height="400" rx="18" fill="#10244a" fill-opacity="0.45" stroke="#4d9bff" stroke-width="2" stroke-dasharray="3 0"/><text x="92" y="209" font-size="23" font-weight="700" fill="#4d9bff" letter-spacing="1">DATA PATH</text><rect x="110" y="235" width="300" height="110" rx="14" fill="#172033" stroke="#3b4d6e" stroke-width="2.5"/><text x="260.0" y="271.05" text-anchor="middle" font-size="25" font-weight="700" fill="#eaf0fa">Live source</text><text x="260.0" y="303.191" text-anchor="middle" font-size="19" fill="#93a1ba">MXL video and audio</text><text x="260.0" y="327.89099999999996" text-anchor="middle" font-size="19" fill="#93a1ba">flows, TAI time</text><rect x="500" y="215" width="360" height="150" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="680.0" y="255.5" text-anchor="middle" font-size="27" font-weight="700" fill="#eaf0fa">TAMS recorder</text><text x="680.0" y="290.21900000000005" text-anchor="middle" font-size="21" fill="#93a1ba">H.264 / AAC, GOP-aligned</text><text x="680.0" y="317.519" text-anchor="middle" font-size="21" fill="#93a1ba">segments, one flow per</text><text x="680.0" y="344.8190000000001" text-anchor="middle" font-size="21" fill="#93a1ba">essence, disk queue</text><rect x="950" y="215" width="380" height="320" rx="14" fill="#10244a" stroke="#4d9bff" stroke-width="2.5"/><text x="1140.0" y="296.34999999999997" text-anchor="middle" font-size="29" font-weight="700" fill="#eaf0fa">TAMS store</text><text x="1140.0" y="332.63300000000004" text-anchor="middle" font-size="22" fill="#93a1ba">API 8.2. Source > Flow ></text><text x="1140.0" y="361.23300000000006" text-anchor="middle" font-size="22" fill="#93a1ba">Segment > Object. Time</text><text x="1140.0" y="389.8330000000001" text-anchor="middle" font-size="22" fill="#93a1ba">ranges instead of file</text><text x="1140.0" y="418.4330000000001" text-anchor="middle" font-size="22" fill="#93a1ba">names. Objects immutable,</text><text x="1140.0" y="447.03300000000013" text-anchor="middle" font-size="22" fill="#93a1ba">reference-counted. Init</text><text x="1140.0" y="475.63300000000015" text-anchor="middle" font-size="22" fill="#93a1ba">segments for fragmented MP4.</text><rect x="1420" y="215" width="390" height="90" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1615.0" y="242.0" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">Replay and time-shift</text><text x="1615.0" y="272.852" text-anchor="middle" font-size="18" fill="#93a1ba">range, 'N seconds ago', follow with</text><text x="1615.0" y="296.25199999999995" text-anchor="middle" font-size="18" fill="#93a1ba">delay</text><rect x="1420" y="330" width="390" height="90" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1615.0" y="357.0" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">Clip export</text><text x="1615.0" y="387.852" text-anchor="middle" font-size="18" fill="#93a1ba">MP4, MKV, TS, MOV; lossless or</text><text x="1615.0" y="411.25199999999995" text-anchor="middle" font-size="18" fill="#93a1ba">frame-exact</text><rect x="1420" y="445" width="390" height="90" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1615.0" y="472.0" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">Retention worker</text><text x="1615.0" y="502.852" text-anchor="middle" font-size="18" fill="#93a1ba">segments, flows, empty flows</text><text x="1615.0" y="526.252" text-anchor="middle" font-size="18" fill="#93a1ba">(AppNote 0019)</text><rect x="110" y="410" width="750" height="125" rx="14" fill="#3a2a0e" stroke="#fb8c00" stroke-width="2.5"/><text x="485.0" y="452.6" text-anchor="middle" font-size="26" font-weight="700" fill="#eaf0fa">Recording schedule</text><text x="485.0" y="486.03" text-anchor="middle" font-size="20" fill="#93a1ba">target 'tams': one metadata copy per show (same objects, no</text><text x="485.0" y="512.03" text-anchor="middle" font-size="20" fill="#93a1ba">media moved) plus a library reference asset</text><line x1="410" y1="290" x2="498" y2="290" stroke="#eaf0fa" stroke-width="3.5" marker-end="url(#a_ink)"/><line x1="860" y1="290" x2="948" y2="290" stroke="#19c3b0" stroke-width="4.5" marker-end="url(#a_teal)"/><text x="904.0" y="268" text-anchor="middle" font-size="20" fill="#19c3b0" font-weight="600">segments</text><line x1="485" y1="410" x2="600" y2="367" stroke="#fb8c00" stroke-width="3.5" stroke-dasharray="11 8" marker-end="url(#a_amber)"/><line x1="860" y1="480" x2="948" y2="480" stroke="#fb8c00" stroke-width="3.5" stroke-dasharray="11 8" marker-end="url(#a_amber)"/><text x="904.0" y="458" text-anchor="middle" font-size="20" fill="#fb8c00" font-weight="600">copy</text><line x1="1330" y1="260" x2="1418" y2="260" stroke="#4d9bff" stroke-width="3.5" marker-end="url(#a_blue)" marker-start="url(#as_blue)"/><line x1="1330" y1="375" x2="1418" y2="375" stroke="#4d9bff" stroke-width="3.5" marker-end="url(#a_blue)"/><line x1="1330" y1="490" x2="1418" y2="490" stroke="#4d9bff" stroke-width="3.5" marker-end="url(#a_blue)" marker-start="url(#as_blue)"/><text x="1810" y="562" text-anchor="end" font-size="19" font-weight="400" fill="#93a1ba">Replay returns as MXL flows to mixer and viewer</text><rect x="70" y="605" width="1780" height="430" rx="18" fill="#0b3436" fill-opacity="0.45" stroke="#19c3b0" stroke-width="2" stroke-dasharray="3 0"/><text x="92" y="639" font-size="23" font-weight="700" fill="#19c3b0" letter-spacing="1">SCOPE AND STATUS</text><rect x="110" y="660" width="270" height="160" rx="14" fill="#172033" stroke="#3b4d6e" stroke-width="2.5"/><text x="245.0" y="711.5500000000001" text-anchor="middle" font-size="22" font-weight="700" fill="#eaf0fa">Time on TAI</text><text x="245.0" y="740.8380000000001" text-anchor="middle" font-size="17" fill="#93a1ba">AppNote 0002, 0008. MXL</text><text x="245.0" y="762.9380000000001" text-anchor="middle" font-size="17" fill="#93a1ba">index and timestamp</text><text x="245.0" y="785.0380000000001" text-anchor="middle" font-size="17" fill="#93a1ba">convert bit-exact.</text><rect x="394" y="660" width="270" height="160" rx="14" fill="#172033" stroke="#3b4d6e" stroke-width="2.5"/><text x="529.0" y="697.8000000000001" text-anchor="middle" font-size="22" font-weight="700" fill="#eaf0fa">Independent</text><text x="529.0" y="725.3000000000001" text-anchor="middle" font-size="22" font-weight="700" fill="#eaf0fa">segments</text><text x="529.0" y="754.5880000000001" text-anchor="middle" font-size="17" fill="#93a1ba">AppNote 0005, 0010.</text><text x="529.0" y="776.6880000000001" text-anchor="middle" font-size="17" fill="#93a1ba">Keyframe first,</text><text x="529.0" y="798.7880000000001" text-anchor="middle" font-size="17" fill="#93a1ba">long-lived flows.</text><rect x="678" y="660" width="270" height="160" rx="14" fill="#172033" stroke="#3b4d6e" stroke-width="2.5"/><text x="813.0" y="711.5500000000001" text-anchor="middle" font-size="22" font-weight="700" fill="#eaf0fa">Init segments</text><text x="813.0" y="740.8380000000001" text-anchor="middle" font-size="17" fill="#93a1ba">AppNote 0024. Fragmented</text><text x="813.0" y="762.9380000000001" text-anchor="middle" font-size="17" fill="#93a1ba">MP4 with one reused init</text><text x="813.0" y="785.0380000000001" text-anchor="middle" font-size="17" fill="#93a1ba">object.</text><rect x="110" y="835" width="270" height="160" rx="14" fill="#172033" stroke="#3b4d6e" stroke-width="2.5"/><text x="245.0" y="886.5500000000001" text-anchor="middle" font-size="22" font-weight="700" fill="#eaf0fa">Retention</text><text x="245.0" y="915.8380000000001" text-anchor="middle" font-size="17" fill="#93a1ba">AppNote 0019. Tags, own</text><text x="245.0" y="937.9380000000001" text-anchor="middle" font-size="17" fill="#93a1ba">worker node, tagged flows</text><text x="245.0" y="960.0380000000001" text-anchor="middle" font-size="17" fill="#93a1ba">only.</text><rect x="394" y="835" width="270" height="160" rx="14" fill="#172033" stroke="#3b4d6e" stroke-width="2.5"/><text x="529.0" y="886.5500000000001" text-anchor="middle" font-size="22" font-weight="700" fill="#eaf0fa">Access</text><text x="529.0" y="915.8380000000001" text-anchor="middle" font-size="17" fill="#93a1ba">ADR-0028. Bearer, Basic,</text><text x="529.0" y="937.9380000000001" text-anchor="middle" font-size="17" fill="#93a1ba">URL token. TLS, secrets</text><text x="529.0" y="960.0380000000001" text-anchor="middle" font-size="17" fill="#93a1ba">from file only.</text><rect x="678" y="835" width="270" height="160" rx="14" fill="#172033" stroke="#3b4d6e" stroke-width="2.5"/><text x="813.0" y="886.5500000000001" text-anchor="middle" font-size="22" font-weight="700" fill="#eaf0fa">In the platform</text><text x="813.0" y="915.8380000000001" text-anchor="middle" font-size="17" fill="#93a1ba">Scheduled recording,</text><text x="813.0" y="937.9380000000001" text-anchor="middle" font-size="17" fill="#93a1ba">panels, file transfer</text><text x="813.0" y="960.0380000000001" text-anchor="middle" font-size="17" fill="#93a1ba">between hosts.</text><rect x="1010" y="655" width="380" height="340" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1200" y="697" text-anchor="middle" font-size="21" font-weight="700" fill="#19c3b0">VERIFIED</text><text x="1030" y="735" text-anchor="start" font-size="20" font-weight="400" fill="#eaf0fa">- Test server that enforces the</text><text x="1030" y="761" text-anchor="start" font-size="20" font-weight="400" fill="#eaf0fa">  spec rules</text><text x="1030" y="797" text-anchor="start" font-size="20" font-weight="400" fill="#eaf0fa">- The specification's own mock</text><text x="1030" y="823" text-anchor="start" font-size="20" font-weight="400" fill="#eaf0fa">  server, schemas checked</text><text x="1030" y="859" text-anchor="start" font-size="20" font-weight="400" fill="#eaf0fa">- End to end with real sources</text><text x="1030" y="885" text-anchor="start" font-size="20" font-weight="400" fill="#eaf0fa">  and ffprobe</text><text x="1030" y="921" text-anchor="start" font-size="20" font-weight="400" fill="#eaf0fa">- Playback into a real MXL</text><text x="1030" y="947" text-anchor="start" font-size="20" font-weight="400" fill="#eaf0fa">  domain</text><rect x="1420" y="655" width="390" height="340" rx="14" fill="#3a2a0e" stroke="#fb8c00" stroke-width="2.5"/><text x="1615" y="697" text-anchor="middle" font-size="21" font-weight="700" fill="#fb8c00">STILL OPEN</text><text x="1440" y="735" text-anchor="start" font-size="20" font-weight="400" fill="#eaf0fa">- Run on a production store</text><text x="1440" y="761" text-anchor="start" font-size="20" font-weight="400" fill="#eaf0fa">  (partner with access wanted)</text><text x="1440" y="797" text-anchor="start" font-size="20" font-weight="400" fill="#eaf0fa">- Strict CMAF brands (cmafmux)</text><text x="1440" y="859" text-anchor="start" font-size="20" font-weight="400" fill="#eaf0fa">- Load at 1080p50 and long-term</text><text x="1440" y="885" text-anchor="start" font-size="20" font-weight="400" fill="#eaf0fa">  operation</text><text x="1440" y="921" text-anchor="start" font-size="20" font-weight="400" fill="#eaf0fa">- Interoperability with other</text><text x="1440" y="947" text-anchor="start" font-size="20" font-weight="400" fill="#eaf0fa">  TAMS clients</text><text x="1850" y="1064" text-anchor="end" font-size="17" fill="#93a1ba">OpenMediaPlatform · open architecture based on EBU DMF, MXL, NMOS, SMPTE ST 2110</text></svg>