<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eaf0fa"/></marker><marker id="as_ink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#eaf0fa"/></marker><marker id="a_blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d9bff"/></marker><marker id="as_blue" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4d9bff"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#19c3b0"/></marker><marker id="as_teal" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#19c3b0"/></marker><marker id="a_amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker><marker id="as_amber" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#fb8c00"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef5350"/></marker><marker id="as_red" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#ef5350"/></marker><marker id="a_violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a45cff"/></marker><marker id="as_violet" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#a45cff"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a1ba"/></marker><marker id="as_mute" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#93a1ba"/></marker><marker id="a_pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f06292"/></marker><marker id="as_pink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#f06292"/></marker></defs><rect width="1920" height="1080" fill="#080c16"/><text x="70" y="85" font-size="44" font-weight="700" fill="#eaf0fa">9 · Kubernetes vs. our approach: an honest comparison</text><text x="70" y="128" font-size="24" fill="#93a1ba">Kubernetes wins where it is general and mature. We win where live media needs specific knowledge. We pay for it in maturity.</text><rect x="70" y="146" width="120" height="5" rx="2" fill="#4d9bff"/><rect x="70" y="180" width="300" height="46" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="2"/><text x="220.0" y="211" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">Topic</text><rect x="390" y="180" width="560" height="46" rx="10" fill="#10244a" stroke="#4d9bff" stroke-width="2"/><text x="670.0" y="211" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">Kubernetes</text><rect x="970" y="180" width="560" height="46" rx="10" fill="#0b3436" stroke="#19c3b0" stroke-width="2"/><text x="1250.0" y="211" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">OpenMediaPlatform</text><rect x="1550" y="180" width="300" height="46" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="2"/><text x="1700.0" y="211" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">Verdict</text><rect x="70" y="236" width="300" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="84" y="268.70000000000005" text-anchor="start" font-size="21" font-weight="700" fill="#eaf0fa">General scheduling,</text><text x="84" y="296.00000000000006" text-anchor="start" font-size="21" font-weight="700" fill="#eaf0fa">bin-packing</text><rect x="390" y="236" width="560" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="404" y="281.65" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">Mature, rich policies, proven on thousands of nodes</text><rect x="970" y="236" width="560" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="984" y="269.29999999999995" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">Own placement scorer: CPU, RAM, GPU plus media</text><text x="984" y="293.99999999999994" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">locality; sized for tens of hosts</text><rect x="1550" y="236" width="300" height="78" rx="10" fill="#10244a" stroke="#4d9bff" stroke-width="2.5"/><text x="1700.0" y="282" text-anchor="middle" font-size="20" font-weight="700" fill="#eaf0fa">Kubernetes ahead</text><rect x="70" y="322" width="300" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="84" y="368.35" text-anchor="start" font-size="21" font-weight="700" fill="#eaf0fa">Media awareness</text><rect x="390" y="322" width="560" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="404" y="355.29999999999995" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">Knows containers and resources. No flows, no on-air</text><text x="404" y="379.99999999999994" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">state, no MXL domain</text><rect x="970" y="322" width="560" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="984" y="355.29999999999995" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">Placement knows who exchanges media with whom and</text><text x="984" y="379.99999999999994" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">what is on air</text><rect x="1550" y="322" width="300" height="78" rx="10" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1700.0" y="368" text-anchor="middle" font-size="20" font-weight="700" fill="#eaf0fa">We are ahead</text><rect x="70" y="408" width="300" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="84" y="454.35" text-anchor="start" font-size="21" font-weight="700" fill="#eaf0fa">Self-healing</text><rect x="390" y="408" width="560" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="404" y="441.29999999999995" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">Restarts pods, reschedules on node loss; generic</text><text x="404" y="465.99999999999994" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">and very well tested</text><rect x="970" y="408" width="560" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="984" y="441.29999999999995" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">Restart, re-wire, re-apply state; lost host:</text><text x="984" y="465.99999999999994" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">standalone instances move automatically</text><rect x="1550" y="408" width="300" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="2.5"/><text x="1700.0" y="441" text-anchor="middle" font-size="20" font-weight="700" fill="#eaf0fa">Even: theirs better</text><text x="1700.0" y="467" text-anchor="middle" font-size="20" font-weight="700" fill="#eaf0fa">tested</text><rect x="70" y="494" width="300" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="84" y="526.7" text-anchor="start" font-size="21" font-weight="700" fill="#eaf0fa">Moving a running</text><text x="84" y="554.0" text-anchor="start" font-size="21" font-weight="700" fill="#eaf0fa">function</text><rect x="390" y="494" width="560" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="404" y="527.3" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">Rolling update: new pod up, old pod down. No state</text><text x="404" y="552.0" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">hand-over, no media-ready cue</text><rect x="970" y="494" width="560" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="984" y="527.3" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">Make-before-break: state export / import,</text><text x="984" y="552.0" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">media-ready signal, then switch</text><rect x="1550" y="494" width="300" height="78" rx="10" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1700.0" y="527" text-anchor="middle" font-size="20" font-weight="700" fill="#eaf0fa">We are ahead for live</text><text x="1700.0" y="553" text-anchor="middle" font-size="20" font-weight="700" fill="#eaf0fa">media</text><rect x="70" y="580" width="300" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="84" y="612.7" text-anchor="start" font-size="21" font-weight="700" fill="#eaf0fa">Same-host media</text><text x="84" y="640.0" text-anchor="start" font-size="21" font-weight="700" fill="#eaf0fa">exchange</text><rect x="390" y="580" width="560" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="404" y="613.3" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">Pods are isolated; sharing memory across pods needs</text><text x="404" y="638.0" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">workarounds and co-location rules</text><rect x="970" y="580" width="560" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="984" y="613.3" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">MXL shared memory between nodes on one host,</text><text x="984" y="638.0" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">zero-copy; placement keeps pairs together</text><rect x="1550" y="580" width="300" height="78" rx="10" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1700.0" y="626" text-anchor="middle" font-size="20" font-weight="700" fill="#eaf0fa">We are ahead</text><rect x="70" y="666" width="300" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="84" y="698.7" text-anchor="start" font-size="21" font-weight="700" fill="#eaf0fa">Multicast, PTP, RDMA</text><text x="84" y="726.0" text-anchor="start" font-size="21" font-weight="700" fill="#eaf0fa">networks</text><rect x="390" y="666" width="560" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="404" y="699.3" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">Possible with secondary CNI, SR-IOV, device</text><text x="404" y="724.0" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">plugins; real effort to set up and keep stable</text><rect x="970" y="666" width="560" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="984" y="699.3" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">Host NICs used directly; RDMA path reserved like an</text><text x="984" y="724.0" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">I/O card; fewer layers</text><rect x="1550" y="666" width="300" height="78" rx="10" fill="#3a2a0e" stroke="#fb8c00" stroke-width="2.5"/><text x="1700.0" y="699" text-anchor="middle" font-size="20" font-weight="700" fill="#eaf0fa">Depends: Kubernetes</text><text x="1700.0" y="725" text-anchor="middle" font-size="20" font-weight="700" fill="#eaf0fa">can, with effort</text><rect x="70" y="752" width="300" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="84" y="798.35" text-anchor="start" font-size="21" font-weight="700" fill="#eaf0fa">Ecosystem, maturity</text><rect x="390" y="752" width="560" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="404" y="785.3" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">Huge: tooling, operators, managed services, audits,</text><text x="404" y="810.0" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">documentation, hiring pool</text><rect x="970" y="752" width="560" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="984" y="785.3" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">Small and ours alone: we maintain scheduler,</text><text x="984" y="810.0" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">updates and hardening</text><rect x="1550" y="752" width="300" height="78" rx="10" fill="#10244a" stroke="#4d9bff" stroke-width="2.5"/><text x="1700.0" y="785" text-anchor="middle" font-size="20" font-weight="700" fill="#eaf0fa">Kubernetes clearly</text><text x="1700.0" y="811" text-anchor="middle" font-size="20" font-weight="700" fill="#eaf0fa">ahead</text><rect x="70" y="838" width="300" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="84" y="884.35" text-anchor="start" font-size="21" font-weight="700" fill="#eaf0fa">Scale and elasticity</text><rect x="390" y="838" width="560" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="404" y="871.3" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">Autoscaling, cluster tooling, cloud-native at any</text><text x="404" y="896.0" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">size</text><rect x="970" y="838" width="560" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="984" y="871.3" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">Hosts can be added incl. cloud; far less proven;</text><text x="984" y="896.0" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">not meant for thousands of nodes</text><rect x="1550" y="838" width="300" height="78" rx="10" fill="#10244a" stroke="#4d9bff" stroke-width="2.5"/><text x="1700.0" y="884" text-anchor="middle" font-size="20" font-weight="700" fill="#eaf0fa">Kubernetes ahead</text><rect x="70" y="924" width="300" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="84" y="956.7" text-anchor="start" font-size="21" font-weight="700" fill="#eaf0fa">Operating effort, 2 to</text><text x="84" y="984.0" text-anchor="start" font-size="21" font-weight="700" fill="#eaf0fa">5 hosts</text><rect x="390" y="924" width="560" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="404" y="957.3" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">etcd, CNI, ingress, certificates, upgrades: a skill</text><text x="404" y="982.0" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">set of its own</text><rect x="970" y="924" width="560" height="78" rx="10" fill="#172033" stroke="#3b4d6e" stroke-width="1.5"/><text x="984" y="957.3" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">Orchestrator + host agent + message bus + database</text><text x="984" y="982.0" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">under systemd: still several parts, fewer layers</text><rect x="1550" y="924" width="300" height="78" rx="10" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1700.0" y="970" text-anchor="middle" font-size="20" font-weight="700" fill="#eaf0fa">We are ahead, modestly</text><text x="1850" y="1064" text-anchor="end" font-size="17" fill="#93a1ba">OpenMediaPlatform · open architecture based on EBU DMF, MXL, NMOS, SMPTE ST 2110</text></svg>