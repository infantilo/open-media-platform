<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eaf0fa"/></marker><marker id="as_ink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#eaf0fa"/></marker><marker id="a_blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d9bff"/></marker><marker id="as_blue" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4d9bff"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#19c3b0"/></marker><marker id="as_teal" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#19c3b0"/></marker><marker id="a_amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker><marker id="as_amber" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#fb8c00"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef5350"/></marker><marker id="as_red" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#ef5350"/></marker><marker id="a_violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a45cff"/></marker><marker id="as_violet" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#a45cff"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a1ba"/></marker><marker id="as_mute" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#93a1ba"/></marker><marker id="a_pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f06292"/></marker><marker id="as_pink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#f06292"/></marker></defs><rect width="1920" height="1080" fill="#080c16"/><text x="70" y="85" font-size="44" font-weight="700" fill="#eaf0fa">8 · Kubernetes and a media facility ask different questions</text><text x="70" y="128" font-size="24" fill="#93a1ba">Kubernetes is excellent at the first column. A live facility lives in the second. The gap is why we do not simply adopt it.</text><rect x="70" y="146" width="120" height="5" rx="2" fill="#4d9bff"/><rect x="70" y="180" width="840" height="360" rx="18" fill="#10244a" fill-opacity="0.45" stroke="#4d9bff" stroke-width="2" stroke-dasharray="3 0"/><text x="92" y="214" font-size="23" font-weight="700" fill="#4d9bff" letter-spacing="1">WHAT KUBERNETES' SCHEDULER KNOWS</text><rect x="1010" y="180" width="840" height="360" rx="18" fill="#0b3436" fill-opacity="0.45" stroke="#19c3b0" stroke-width="2" stroke-dasharray="3 0"/><text x="1032" y="214" font-size="23" font-weight="700" fill="#19c3b0" letter-spacing="1">WHAT A LIVE MEDIA FACILITY MUST KNOW</text><rect x="100" y="230" width="380" height="125" rx="14" fill="#10244a" stroke="#4d9bff" stroke-width="2.5"/><text x="290.0" y="286.45" text-anchor="middle" font-size="22" font-weight="400" fill="#eaf0fa">Which node has 2 CPU and 4</text><text x="290.0" y="313.95" text-anchor="middle" font-size="22" font-weight="400" fill="#eaf0fa">GB free?</text><rect x="500" y="230" width="380" height="125" rx="14" fill="#10244a" stroke="#4d9bff" stroke-width="2.5"/><text x="690.0" y="286.45" text-anchor="middle" font-size="22" font-weight="400" fill="#eaf0fa">Is the pod ready (probe</text><text x="690.0" y="313.95" text-anchor="middle" font-size="22" font-weight="400" fill="#eaf0fa">passed)?</text><rect x="100" y="380" width="380" height="125" rx="14" fill="#10244a" stroke="#4d9bff" stroke-width="2.5"/><text x="290.0" y="450.2" text-anchor="middle" font-size="22" font-weight="400" fill="#eaf0fa">Are N replicas running?</text><rect x="500" y="380" width="380" height="125" rx="14" fill="#10244a" stroke="#4d9bff" stroke-width="2.5"/><text x="690.0" y="436.45" text-anchor="middle" font-size="22" font-weight="400" fill="#eaf0fa">Which pods belong to one</text><text x="690.0" y="463.95" text-anchor="middle" font-size="22" font-weight="400" fill="#eaf0fa">service?</text><rect x="1040" y="230" width="380" height="125" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1230.0" y="272.7" text-anchor="middle" font-size="22" font-weight="400" fill="#eaf0fa">Which functions exchange</text><text x="1230.0" y="300.2" text-anchor="middle" font-size="22" font-weight="400" fill="#eaf0fa">media: can they share one</text><text x="1230.0" y="327.7" text-anchor="middle" font-size="22" font-weight="400" fill="#eaf0fa">host?</text><rect x="1440" y="230" width="380" height="125" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1630.0" y="286.45" text-anchor="middle" font-size="22" font-weight="400" fill="#eaf0fa">What is on air right now,</text><text x="1630.0" y="313.95" text-anchor="middle" font-size="22" font-weight="400" fill="#eaf0fa">may it be touched?</text><rect x="1040" y="380" width="380" height="125" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1230.0" y="422.7" text-anchor="middle" font-size="22" font-weight="400" fill="#eaf0fa">Is there PTP + multicast, or</text><text x="1230.0" y="450.2" text-anchor="middle" font-size="22" font-weight="400" fill="#eaf0fa">an RDMA path, to the other</text><text x="1230.0" y="477.7" text-anchor="middle" font-size="22" font-weight="400" fill="#eaf0fa">host?</text><rect x="1440" y="380" width="380" height="125" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1630.0" y="422.7" text-anchor="middle" font-size="22" font-weight="400" fill="#eaf0fa">Can the replacement take</text><text x="1630.0" y="450.2" text-anchor="middle" font-size="22" font-weight="400" fill="#eaf0fa">over without a visible</text><text x="1630.0" y="477.7" text-anchor="middle" font-size="22" font-weight="400" fill="#eaf0fa">glitch?</text><line x1="915" y1="360" x2="1005" y2="360" stroke="#ef5350" stroke-width="6" stroke-dasharray="11 8" marker-end="url(#a_red)"/><text x="960" y="335" text-anchor="middle" font-size="22" font-weight="700" fill="#ef5350">gap</text><text x="960" y="580" text-anchor="middle" font-size="28" font-weight="700" fill="#eaf0fa">Three ways to close the gap</text><rect x="70" y="620" width="580" height="300" rx="14" fill="#10244a" stroke="#4d9bff" stroke-width="2.5"/><text x="360" y="670" text-anchor="middle" font-size="26" font-weight="700" fill="#eaf0fa">A · Kubernetes as is</text><text x="360" y="725.0" text-anchor="middle" font-size="22" fill="#eaf0fa">Generic placement and restarts. Media</text><text x="360" y="754.7" text-anchor="middle" font-size="22" fill="#eaf0fa">locality, on-air state and glitch-free</text><text x="360" y="784.4" text-anchor="middle" font-size="22" fill="#eaf0fa">hand-over are not part of its model. Fine</text><text x="360" y="814.1" text-anchor="middle" font-size="22" fill="#eaf0fa">for non-live services (databases, web UI,</text><text x="360" y="843.8" text-anchor="middle" font-size="22" fill="#eaf0fa">batch jobs).</text><rect x="670" y="620" width="580" height="300" rx="14" fill="#3a2a0e" stroke="#fb8c00" stroke-width="2.5"/><text x="960" y="670" text-anchor="middle" font-size="26" font-weight="700" fill="#eaf0fa">B · Kubernetes + our media layer</text><text x="960" y="725.0" text-anchor="middle" font-size="22" fill="#eaf0fa">We would still build the operator, NMOS</text><text x="960" y="754.7" text-anchor="middle" font-size="22" fill="#eaf0fa">glue, state hand-over and a scheduler</text><text x="960" y="784.4" text-anchor="middle" font-size="22" fill="#eaf0fa">extension. Result: two control planes to</text><text x="960" y="814.1" text-anchor="middle" font-size="22" fill="#eaf0fa">run and keep consistent.</text><rect x="1270" y="620" width="580" height="300" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1560" y="670" text-anchor="middle" font-size="26" font-weight="700" fill="#eaf0fa">C · Media-aware orchestrator (today)</text><text x="1560" y="725.0" text-anchor="middle" font-size="22" fill="#eaf0fa">One control plane that already speaks NMOS</text><text x="1560" y="754.7" text-anchor="middle" font-size="22" fill="#eaf0fa">and knows flows, roles and on-air state. A</text><text x="1560" y="784.4" text-anchor="middle" font-size="22" fill="#eaf0fa">thin host agent starts the processes.</text><text x="1560" y="814.1" text-anchor="middle" font-size="22" fill="#eaf0fa">Kubernetes stays possible as a runner</text><text x="1560" y="843.8" text-anchor="middle" font-size="22" fill="#eaf0fa">backend.</text><text x="1850" y="1064" text-anchor="end" font-size="17" fill="#93a1ba">OpenMediaPlatform · open architecture based on EBU DMF, MXL, NMOS, SMPTE ST 2110</text></svg>