a45cff"/></marker><marker id="as_violet" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#a45cff"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a1ba"/></marker><marker id="as_mute" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#93a1ba"/></marker><marker id="a_pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f06292"/></marker><marker id="as_pink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#f06292"/></marker></defs><rect width="1920" height="1080" fill="#080c16"/><text x="70" y="85" font-size="44" font-weight="700" fill="#eaf0fa">1 · Architecture at a glance</text><text x="70" y="128" font-size="24" fill="#93a1ba">Every function is a replaceable node. The orchestrator knows no vendor and no node type, only standards.</text><rect x="70" y="146" width="120" height="5" rx="2" fill="#4d9bff"/><rect x="70" y="180" width="1780" height="150" rx="18" fill="#10244a" fill-opacity="0.45" stroke="#4d9bff" stroke-width="2" stroke-dasharray="3 0"/><text x="92" y="214" font-size="23" font-weight="700" fill="#4d9bff" letter-spacing="1">OPERATOR LAYER</text><rect x="110" y="222" width="520" height="95" rx="14" fill="#10244a" stroke="#4d9bff" stroke-width="2.5"/><text x="370.0" y="263.2" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">Web UI shell</text><text x="370.0" y="294.05199999999996" text-anchor="middle" font-size="18" fill="#93a1ba">role-scoped operator consoles in the browser</text><rect x="670" y="222" width="520" height="95" rx="14" fill="#10244a" stroke="#4d9bff" stroke-width="2.5"/><text x="930.0" y="263.2" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">Node UI fragments</text><text x="930.0" y="294.05199999999996" text-anchor="middle" font-size="18" fill="#93a1ba">each node ships its own UI, loaded at runtime</text><rect x="1230" y="222" width="580" height="95" rx="14" fill="#10244a" stroke="#4d9bff" stroke-width="2.5"/><text x="1520.0" y="263.2" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">Panels &amp; hardware control</text><text x="1520.0" y="294.05199999999996" text-anchor="middle" font-size="18" fill="#93a1ba">touch consoles, control surfaces via gateways</text><rect x="70" y="350" width="1780" height="260" rx="18" fill="#0b3436" fill-opacity="0.45" stroke="#19c3b0" stroke-width="2" stroke-dasharray="3 0"/><text x="92" y="384" font-size="23" font-weight="700" fill="#19c3b0" letter-spacing="1">CONTROL PLANE (HA, NO MEDIA PASSES THROUGH HERE)</text><rect x="110" y="400" width="360" height="170" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="290.0" y="452.1" text-anchor="middle" font-size="26" font-weight="700" fill="#eaf0fa">Orchestrator core</text><text x="290.0" y="485.53" text-anchor="middle" font-size="20" fill="#93a1ba">registry · connections ·</text><text x="290.0" y="511.53" text-anchor="middle" font-size="20" fill="#93a1ba">lifecycle · placement ·</text><text x="290.0" y="537.53" text-anchor="middle" font-size="20" fill="#93a1ba">workflows</text><rect x="510" y="400" width="300" height="170" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="660.0" y="467.0" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">Control framework</text><text x="660.0" y="497.852" text-anchor="middle" font-size="18" fill="#93a1ba">NMOS IS-12/14: nodes</text><text x="660.0" y="521.252" text-anchor="middle" font-size="18" fill="#93a1ba">self-describe parameters</text><rect x="850" y="400" width="300" height="170" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1000.0" y="467.0" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">Event bus</text><text x="1000.0" y="497.852" text-anchor="middle" font-size="18" fill="#93a1ba">tally · alarms · state</text><text x="1000.0" y="521.252" text-anchor="middle" font-size="18" fill="#93a1ba">changes (durable streams)</text><rect x="1190" y="400" width="300" height="170" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1340.0" y="455.29999999999995" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">Clustering</text><text x="1340.0" y="486.15199999999993" text-anchor="middle" font-size="18" fill="#93a1ba">consensus between</text><text x="1340.0" y="509.5519999999999" text-anchor="middle" font-size="18" fill="#93a1ba">orchestrators, replicated</text><text x="1340.0" y="532.9519999999999" text-anchor="middle" font-size="18" fill="#93a1ba">database</text><rect x="1530" y="400" width="280" height="170" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1670.0" y="467.0" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">AuthN / AuthZ</text><text x="1670.0" y="497.852" text-anchor="middle" font-size="18" fill="#93a1ba">NMOS IS-10 · roles ·</text><text x="1670.0" y="521.252" text-anchor="middle" font-size="18" fill="#93a1ba">audit</text><rect x="70" y="630" width="1780" height="200" rx="18" fill="#3a2a0e" fill-opacity="0.45" stroke="#fb8c00" stroke-width="2" stroke-dasharray="3 0"/><text x="92" y="664" font-size="23" font-weight="700" fill="#fb8c00" letter-spacing="1">MEDIA FUNCTIONS (NODES)</text><rect x="110" y="680" width="265" height="115" rx="14" fill="#3a2a0e" stroke="#fb8c00" stroke-width="2.5"/><text x="242.5" y="731.5" text-anchor="middle" font-size="23" font-weight="700" fill="#eaf0fa">Players</text><text x="242.5" y="761.0630000000001" text-anchor="middle" font-size="17" fill="#93a1ba">playout, clips</text><rect x="392" y="680" width="265" height="115" rx="14" fill="#3a2a0e" stroke="#fb8c00" stroke-width="2.5"/><text x="524.5" y="731.5" text-anchor="middle" font-size="23" font-weight="700" fill="#eaf0fa">Audio mixer</text><text x="524.5" y="761.0630000000001" text-anchor="middle" font-size="17" fill="#93a1ba">dynamic channels</text><rect x="674" y="680" width="265" height="115" rx="14" fill="#3a2a0e" stroke="#fb8c00" stroke-width="2.5"/><text x="806.5" y="731.5" text-anchor="middle" font-size="23" font-weight="700" fill="#eaf0fa">Video mixer</text><text x="806.5" y="761.0630000000001" text-anchor="middle" font-size="17" fill="#93a1ba">M/E banks</text><rect x="956" y="680" width="265" height="115" rx="14" fill="#3a2a0e" stroke="#fb8c00" stroke-width="2.5"/><text x="1088.5" y="731.5" text-anchor="middle" font-size="23" font-weight="700" fill="#eaf0fa">Graphics</text><text x="1088.5" y="761.0630000000001" text-anchor="middle" font-size="17" fill="#93a1ba">OGraf engine</text><rect x="1238" y="680" width="265" height="115" rx="14" fill="#3a2a0e" stroke="#fb8c00" stroke-width="2.5"/><text x="1370.5" y="731.5" text-anchor="middle" font-size="23" font-weight="700" fill="#eaf0fa">Gateways</text><text x="1370.5" y="761.0630000000001" text-anchor="middle" font-size="17" fill="#93a1ba">SRT / RIST / ST 2110</text><rect x="1520" y="680" width="265" height="115" rx="14" fill="#271a47" stroke="#a45cff" stroke-width="2.5" stroke-dasharray="10 7"/><text x="1652.5" y="731.5" text-anchor="middle" font-size="23" font-weight="700" fill="#eaf0fa">3rd-party nodes</text><text x="1652.5" y="761.0630000000001" text-anchor="middle" font-size="17" fill="#93a1ba">same contract</text><rect x="70" y="850" width="1780" height="170" rx="18" fill="#271a47" fill-opacity="0.45" stroke="#a45cff" stroke-width="2" stroke-dasharray="3 0"/><text x="92" y="884" font-size="23" font-weight="700" fill="#a45cff" letter-spacing="1">MEDIA EXCHANGE</text><rect x="110" y="895" width="400" height="105" rx="14" fill="#271a47" stroke="#a45cff" stroke-width="2.5"/><text x="310.0" y="930.1" text-anchor="middle" font-size="22" font-weight="700" fill="#eaf0fa">MXL · same host</text><text x="310.0" y="959.388" text-anchor="middle" font-size="17" fill="#93a1ba">zero-copy shared memory, no NIC, no</text><text x="310.0" y="981.488" text-anchor="middle" font-size="17" fill="#93a1ba">encoding</text><rect x="545" y="895" width="400" height="105" rx="14" fill="#3b1730" stroke="#f06292" stroke-width="2.5"/><text x="745.0" y="930.1" text-anchor="middle" font-size="22" font-weight="700" fill="#eaf0fa">MXL Fabrics · RDMA</text><text x="745.0" y="959.388" text-anchor="middle" font-size="17" fill="#93a1ba">host-to-host one-sided RDMA write</text><text x="745.0" y="981.488" text-anchor="middle" font-size="17" fill="#93a1ba">(libfabric), lowest CPU load</text><rect x="980" y="895" width="400" height="105" rx="14" fill="#271a47" stroke="#a45cff" stroke-width="2.5"/><text x="1180.0" y="941.1500000000001" text-anchor="middle" font-size="22" font-weight="700" fill="#eaf0fa">SMPTE ST 2110 · LAN</text><text x="1180.0" y="970.4380000000001" text-anchor="middle" font-size="17" fill="#93a1ba">uncompressed over IP, PTP (ST 2059)</text><rect x="1415" y="895" width="400" height="105" rx="14" fill="#271a47" stroke="#a45cff" stroke-width="2.5"/><text x="1615.0" y="930.1" text-anchor="middle" font-size="22" font-weight="700" fill="#eaf0fa">SRT / RIST · WAN &amp; cloud</text><text x="1615.0" y="959.388" text-anchor="middle" font-size="17" fill="#93a1ba">gateway node bridges 2110 inside the</text><text x="1615.0" y="981.488" text-anchor="middle" font-size="17" fill="#93a1ba">facility</text><line x1="960" y1="310" x2="960" y2="400" stroke="#4d9bff" stroke-width="3.5" marker-end="url(#a_blue)" marker-start="url(#as_blue)"/><line x1="960" y1="570" x2="960" y2="680" stroke="#19c3b0" stroke-width="3.5" stroke-dasharray="11 8" marker-end="url(#a_teal)" marker-start="url(#as_teal)"/><text x="985" y="368" text-anchor="start" font-size="20" font-weight="700" fill="#4d9bff">REST / SSE</text><text x="985" y="640" text-anchor="start" font-size="20" font-weight="700" fill="#19c3b0">IS-04/05/12/14, commands</text><line x1="1000" y1="795" x2="1000" y2="895" stroke="#a45cff" stroke-width="3.5" marker-end="url(#a_violet)" marker-start="url(#as_violet)"/><text x="1850" y="1064" text-anchor="end" font-size="17" fill="#93a1ba">OpenMediaPlatform · open architecture based on EBU DMF, MXL, NMOS, SMPTE ST 2110</text></svg>