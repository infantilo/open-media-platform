<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eaf0fa"/></marker><marker id="as_ink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#eaf0fa"/></marker><marker id="a_blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d9bff"/></marker><marker id="as_blue" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4d9bff"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#19c3b0"/></marker><marker id="as_teal" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#19c3b0"/></marker><marker id="a_amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker><marker id="as_amber" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#fb8c00"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef5350"/></marker><marker id="as_red" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#ef5350"/></marker><marker id="a_violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a45cff"/></marker><marker id="as_violet" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#a45cff"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a1ba"/></marker><marker id="as_mute" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#93a1ba"/></marker><marker id="a_pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f06292"/></marker><marker id="as_pink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#f06292"/></marker></defs><rect width="1920" height="1080" fill="#080c16"/><text x="70" y="85" font-size="44" font-weight="700" fill="#eaf0fa">7 · Choosing the media path between two functions</text><text x="70" y="128" font-size="24" fill="#93a1ba">One rule set, applied automatically at placement time. The signal is never lost: acceleration is optional, a fallback always exists.</text><rect x="70" y="146" width="120" height="5" rx="2" fill="#4d9bff"/><rect x="70" y="190" width="420" height="120" rx="14" fill="#172033" stroke="#eaf0fa" stroke-width="2.5"/><text x="280.0" y="229.5" text-anchor="middle" font-size="28" font-weight="700" fill="#eaf0fa">Two functions</text><text x="280.0" y="264.494" text-anchor="middle" font-size="21" fill="#93a1ba">two functions need to exchange</text><text x="280.0" y="291.794" text-anchor="middle" font-size="21" fill="#93a1ba">media</text><rect x="560" y="190" width="520" height="120" rx="14" fill="#172033" stroke="#eaf0fa" stroke-width="2.5"/><text x="820.0" y="259.1" text-anchor="middle" font-size="26" font-weight="700" fill="#eaf0fa">Same host?</text><rect x="1280" y="190" width="570" height="120" rx="14" fill="#271a47" stroke="#a45cff" stroke-width="2.5"/><text x="1565.0" y="243.1" text-anchor="middle" font-size="26" font-weight="700" fill="#eaf0fa">MXL shared memory</text><text x="1565.0" y="276.53" text-anchor="middle" font-size="20" fill="#93a1ba">zero-copy, no NIC, no encoding</text><line x1="1080" y1="250" x2="1280" y2="250" stroke="#a45cff" stroke-width="5" marker-end="url(#a_violet)"/><text x="1180.0" y="238" text-anchor="middle" font-size="20" fill="#a45cff" font-weight="600">yes</text><line x1="820" y1="310" x2="820" y2="380" stroke="#eaf0fa" stroke-width="4" marker-end="url(#a_ink)"/><text x="840" y="352" text-anchor="start" font-size="21" font-weight="700" fill="#93a1ba">no</text><rect x="560" y="380" width="520" height="120" rx="14" fill="#172033" stroke="#eaf0fa" stroke-width="2.5"/><text x="820.0" y="432.85" text-anchor="middle" font-size="26" font-weight="700" fill="#eaf0fa">Same RDMA-capable fabric</text><text x="820.0" y="465.35" text-anchor="middle" font-size="26" font-weight="700" fill="#eaf0fa">segment?</text><rect x="1280" y="380" width="570" height="120" rx="14" fill="#3b1730" stroke="#f06292" stroke-width="2.5"/><text x="1565.0" y="420.1" text-anchor="middle" font-size="26" font-weight="700" fill="#eaf0fa">MXL Fabrics over RDMA</text><text x="1565.0" y="453.53" text-anchor="middle" font-size="20" fill="#93a1ba">RoCEv2 / EFA, one-sided write, lowest CPU load;</text><text x="1565.0" y="479.53" text-anchor="middle" font-size="20" fill="#93a1ba">reserved like an I/O card</text><line x1="1080" y1="440" x2="1280" y2="440" stroke="#f06292" stroke-width="5" marker-end="url(#a_pink)"/><text x="1180.0" y="428" text-anchor="middle" font-size="20" fill="#f06292" font-weight="600">yes</text><line x1="820" y1="500" x2="820" y2="570" stroke="#eaf0fa" stroke-width="4" marker-end="url(#a_ink)"/><text x="840" y="542" text-anchor="start" font-size="21" font-weight="700" fill="#93a1ba">no</text><rect x="560" y="570" width="520" height="120" rx="14" fill="#172033" stroke="#eaf0fa" stroke-width="2.5"/><text x="820.0" y="622.85" text-anchor="middle" font-size="26" font-weight="700" fill="#eaf0fa">Same LAN with multicast and</text><text x="820.0" y="655.35" text-anchor="middle" font-size="26" font-weight="700" fill="#eaf0fa">PTP?</text><rect x="1280" y="570" width="570" height="120" rx="14" fill="#271a47" stroke="#a45cff" stroke-width="2.5"/><text x="1565.0" y="623.1" text-anchor="middle" font-size="26" font-weight="700" fill="#eaf0fa">SMPTE ST 2110 / 2022-7</text><text x="1565.0" y="656.53" text-anchor="middle" font-size="20" fill="#93a1ba">uncompressed, PTP time, redundant paths</text><line x1="1080" y1="630" x2="1280" y2="630" stroke="#a45cff" stroke-width="5" marker-end="url(#a_violet)"/><text x="1180.0" y="618" text-anchor="middle" font-size="20" fill="#a45cff" font-weight="600">yes</text><line x1="820" y1="690" x2="820" y2="760" stroke="#eaf0fa" stroke-width="4" marker-end="url(#a_ink)"/><text x="840" y="732" text-anchor="start" font-size="21" font-weight="700" fill="#93a1ba">no</text><rect x="560" y="760" width="520" height="120" rx="14" fill="#172033" stroke="#eaf0fa" stroke-width="2.5"/><text x="820.0" y="812.85" text-anchor="middle" font-size="26" font-weight="700" fill="#eaf0fa">Otherwise (WAN, cloud, no</text><text x="820.0" y="845.35" text-anchor="middle" font-size="26" font-weight="700" fill="#eaf0fa">multicast)</text><rect x="1280" y="760" width="570" height="120" rx="14" fill="#3a2a0e" stroke="#fb8c00" stroke-width="2.5"/><text x="1565.0" y="813.1" text-anchor="middle" font-size="26" font-weight="700" fill="#eaf0fa">SRT / RIST via gateway node</text><text x="1565.0" y="846.53" text-anchor="middle" font-size="20" fill="#93a1ba">unicast, FEC; 2110 stays inside the facility</text><line x1="1080" y1="820" x2="1280" y2="820" stroke="#fb8c00" stroke-width="5" marker-end="url(#a_amber)"/><text x="1180.0" y="808" text-anchor="middle" font-size="20" fill="#fb8c00" font-weight="600">else</text><line x1="490" y1="250" x2="560" y2="250" stroke="#eaf0fa" stroke-width="4" marker-end="url(#a_ink)"/><rect x="70" y="350" width="420" height="330" rx="14" fill="#10244a" stroke="#4d9bff" stroke-width="2.5"/><text x="280" y="395" text-anchor="middle" font-size="26" font-weight="700" fill="#eaf0fa">Fallback is soft</text><text x="280" y="435.0" text-anchor="middle" font-size="21" fill="#eaf0fa">If an accelerated path cannot be</text><text x="280" y="463.35" text-anchor="middle" font-size="21" fill="#eaf0fa">provided at placement time, the</text><text x="280" y="491.7" text-anchor="middle" font-size="21" fill="#eaf0fa">connection falls back to the</text><text x="280" y="520.05" text-anchor="middle" font-size="21" fill="#eaf0fa">next option automatically, with</text><text x="280" y="548.4" text-anchor="middle" font-size="21" fill="#eaf0fa">an advisory. The programme is</text><text x="280" y="576.75" text-anchor="middle" font-size="21" fill="#eaf0fa">never stopped for lack of</text><text x="280" y="605.1" text-anchor="middle" font-size="21" fill="#eaf0fa">acceleration.</text><rect x="70" y="710" width="420" height="250" rx="14" fill="#172033" stroke="#3b4d6e" stroke-width="2.5"/><text x="280" y="752" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">Status</text><text x="280" y="790.0" text-anchor="middle" font-size="20" fill="#93a1ba">RDMA path implemented on the</text><text x="280" y="817.0" text-anchor="middle" font-size="20" fill="#93a1ba">libfabric software provider and</text><text x="280" y="844.0" text-anchor="middle" font-size="20" fill="#93a1ba">verified end to end. Validation</text><text x="280" y="871.0" text-anchor="middle" font-size="20" fill="#93a1ba">on RoCEv2 hardware is planned.</text><text x="1850" y="1064" text-anchor="end" font-size="17" fill="#93a1ba">OpenMediaPlatform · open architecture based on EBU DMF, MXL, NMOS, SMPTE ST 2110</text></svg>