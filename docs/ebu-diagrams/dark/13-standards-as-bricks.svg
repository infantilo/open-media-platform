ext x="116" y="906" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">EBU</text><rect x="176" y="885" width="34" height="26" rx="6" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="222" y="906" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">AMWA NMOS</text><rect x="392" y="885" width="34" height="26" rx="6" fill="#3b1730" stroke="#f06292" stroke-width="2.5"/><text x="438" y="906" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">MXL project</text><rect x="578" y="885" width="34" height="26" rx="6" fill="#271a47" stroke="#a45cff" stroke-width="2.5"/><text x="624" y="906" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">SMPTE / IEEE / AES</text><rect x="864" y="885" width="34" height="26" rx="6" fill="#172033" stroke="#3b4d6e" stroke-width="2.5"/><text x="910" y="906" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">other open specs and libraries</text><rect x="1240" y="885" width="34" height="26" rx="6" fill="#3a2a0e" stroke="#fb8c00" stroke-width="2.5"/><text x="1286" y="906" text-anchor="start" font-size="19" font-weight="400" fill="#eaf0fa">our own bricks</text><rect x="70" y="930" width="1780" height="90" rx="14" fill="#172033" stroke="#3b4d6e" stroke-width="2.5"/><text x="960.0" y="968.6999999999999" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">Rule: use the standard where one exists, name its number and version, and build our own brick only for the gap.</text><text x="960.0" y="999.5519999999999" text-anchor="middle" font-size="18" fill="#93a1ba">Own bricks: operate, orchestrate, bridge, host. They make the standard parts work as one facility, and each one is checked as described in diagram 12.</text><text x="1850" y="1064" text-anchor="end" font-size="17" fill="#93a1ba">OpenMediaPlatform · open architecture based on EBU DMF, MXL, NMOS, SMPTE ST 2110</text></svg>