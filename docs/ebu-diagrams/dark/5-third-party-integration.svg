<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eaf0fa"/></marker><marker id="as_ink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#eaf0fa"/></marker><marker id="a_blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d9bff"/></marker><marker id="as_blue" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4d9bff"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#19c3b0"/></marker><marker id="as_teal" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#19c3b0"/></marker><marker id="a_amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb8c00"/></marker><marker id="as_amber" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#fb8c00"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef5350"/></marker><marker id="as_red" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#ef5350"/></marker><marker id="a_violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a45cff"/></marker><marker id="as_violet" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#a45cff"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a1ba"/></marker><marker id="as_mute" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#93a1ba"/></marker><marker id="a_pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f06292"/></marker><marker id="as_pink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#f06292"/></marker></defs><rect width="1920" height="1080" fill="#080c16"/><text x="70" y="85" font-size="44" font-weight="700" fill="#eaf0fa">5 · How a third-party MXL / DMF-compatible product joins</text><text x="70" y="128" font-size="24" fill="#93a1ba">Same contract as our own nodes: register, describe, exchange media over MXL or ST 2110. No fork, no special code.</text><rect x="70" y="146" width="120" height="5" rx="2" fill="#4d9bff"/><rect x="70" y="180" width="1000" height="520" rx="18" fill="#271a47" fill-opacity="0.45" stroke="#a45cff" stroke-width="2" stroke-dasharray="3 0"/><text x="92" y="214" font-size="23" font-weight="700" fill="#a45cff" letter-spacing="1">THIRD-PARTY PRODUCT</text><rect x="110" y="235" width="920" height="95" rx="14" fill="#271a47" stroke="#a45cff" stroke-width="2.5" stroke-dasharray="10 7"/><text x="570.0" y="290.9" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">Product core, e.g. a software audio mixer or a vision engine</text><rect x="110" y="355" width="290" height="150" rx="14" fill="#271a47" stroke="#a45cff" stroke-width="2.5"/><text x="255.0" y="423.7" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">1 · Register</text><text x="255.0" y="454.55199999999996" text-anchor="middle" font-size="18" fill="#93a1ba">NMOS IS-04</text><rect x="425" y="355" width="290" height="150" rx="14" fill="#271a47" stroke="#a45cff" stroke-width="2.5"/><text x="570.0" y="423.7" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">2 · Describe</text><text x="570.0" y="454.55199999999996" text-anchor="middle" font-size="18" fill="#93a1ba">NMOS IS-12/14</text><rect x="740" y="355" width="290" height="150" rx="14" fill="#271a47" stroke="#a45cff" stroke-width="2.5"/><text x="885.0" y="412.0" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">3 · Media I/O</text><text x="885.0" y="442.852" text-anchor="middle" font-size="18" fill="#93a1ba">MXL, ST 2110, optional</text><text x="885.0" y="466.25199999999995" text-anchor="middle" font-size="18" fill="#93a1ba">RDMA</text><rect x="110" y="540" width="920" height="125" rx="14" fill="#271a47" stroke="#a45cff" stroke-width="2.5"/><text x="570.0" y="596.1999999999999" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">Optional: UI bundle + manifest</text><text x="570.0" y="627.0519999999999" text-anchor="middle" font-size="18" fill="#93a1ba">orchestrator loads it into the operator console</text><rect x="1130" y="180" width="720" height="520" rx="18" fill="#0b3436" fill-opacity="0.45" stroke="#19c3b0" stroke-width="2" stroke-dasharray="3 0"/><text x="1152" y="214" font-size="23" font-weight="700" fill="#19c3b0" letter-spacing="1">OPENMEDIAPLATFORM</text><rect x="1170" y="235" width="640" height="95" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1490.0" y="275.6" text-anchor="middle" font-size="26" font-weight="700" fill="#eaf0fa">Orchestrator</text><text x="1490.0" y="309.03" text-anchor="middle" font-size="20" fill="#93a1ba">discovers, connects, monitors, places</text><rect x="1170" y="355" width="640" height="95" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1490.0" y="396.2" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">Generic control UI</text><text x="1490.0" y="427.05199999999996" text-anchor="middle" font-size="18" fill="#93a1ba">built automatically from the IS-12/14 description</text><rect x="1170" y="475" width="640" height="95" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="1490.0" y="516.1999999999999" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">Placement, failover, migration</text><text x="1490.0" y="547.0519999999999" text-anchor="middle" font-size="18" fill="#93a1ba">applies to the product like to any node</text><rect x="1170" y="595" width="640" height="80" rx="14" fill="#3a2a0e" stroke="#fb8c00" stroke-width="2.5"/><text x="1490.0" y="642.7" text-anchor="middle" font-size="22" font-weight="700" fill="#eaf0fa">Existing nodes: players, mixers, gateways</text><line x1="1030" y1="400" x2="1170" y2="282" stroke="#19c3b0" stroke-width="3.5" marker-end="url(#a_teal)" marker-start="url(#as_teal)"/><line x1="1030" y1="430" x2="1170" y2="402" stroke="#19c3b0" stroke-width="3.5" marker-end="url(#a_teal)" marker-start="url(#as_teal)"/><line x1="1030" y1="480" x2="1170" y2="635" stroke="#a45cff" stroke-width="5" marker-end="url(#a_violet)" marker-start="url(#as_violet)"/><text x="1490" y="722" text-anchor="middle" font-size="19" font-weight="700" fill="#93a1ba">violet = media   ·   teal = control</text><rect x="70" y="730" width="1780" height="70" rx="14" fill="#172033" stroke="#3b4d6e" stroke-width="2.5"/><text x="960.0" y="773.4" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf0fa">Integration depth — the vendor chooses, each level already gives value</text><rect x="70" y="820" width="580" height="200" rx="14" fill="#3a2a0e" stroke="#fb8c00" stroke-width="2.5"/><text x="360" y="865" text-anchor="middle" font-size="25" font-weight="700" fill="#eaf0fa">Level A · Register + MXL / 2110</text><text x="360" y="920.0" text-anchor="middle" font-size="21" fill="#eaf0fa">Appears in the registry, can be routed and</text><text x="360" y="948.35" text-anchor="middle" font-size="21" fill="#eaf0fa">monitored. Drop-in for any workflow.</text><rect x="670" y="820" width="580" height="200" rx="14" fill="#0b3436" stroke="#19c3b0" stroke-width="2.5"/><text x="960" y="865" text-anchor="middle" font-size="25" font-weight="700" fill="#eaf0fa">Level B · + control description</text><text x="960" y="920.0" text-anchor="middle" font-size="21" fill="#eaf0fa">Orchestrator and consoles control it without</text><text x="960" y="948.35" text-anchor="middle" font-size="21" fill="#eaf0fa">vendor-specific code.</text><rect x="1270" y="820" width="580" height="200" rx="14" fill="#10244a" stroke="#4d9bff" stroke-width="2.5"/><text x="1560" y="865" text-anchor="middle" font-size="25" font-weight="700" fill="#eaf0fa">Level C · + placement / state contract</text><text x="1560" y="920.0" text-anchor="middle" font-size="21" fill="#eaf0fa">Export / import state and media-ready</text><text x="1560" y="948.35" text-anchor="middle" font-size="21" fill="#eaf0fa">signal: can be moved and failed over without</text><text x="1560" y="976.7" text-anchor="middle" font-size="21" fill="#eaf0fa">a gap.</text><text x="1850" y="1064" text-anchor="end" font-size="17" fill="#93a1ba">OpenMediaPlatform · open architecture based on EBU DMF, MXL, NMOS, SMPTE ST 2110</text></svg>