<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14213d"/></marker><marker id="as_ink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#14213d"/></marker><marker id="a_blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="as_blue" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2563eb"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="as_teal" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0d9488"/></marker><marker id="a_amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="as_amber" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d97706"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as_red" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker><marker id="a_violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="as_violet" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c3aed"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c677d"/></marker><marker id="as_mute" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5c677d"/></marker><marker id="a_pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="as_pink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#db2777"/></marker></defs><rect width="1920" height="1080" fill="#ffffff"/><text x="70" y="85" font-size="44" font-weight="700" fill="#14213d">4 · Make-before-break migration of a live node</text><text x="70" y="128" font-size="24" fill="#5c677d">The old instance keeps producing until the new one is proven ready. Only then is the output switched.</text><rect x="70" y="146" width="120" height="5" rx="2" fill="#2563eb"/><text x="70" y="200" text-anchor="start" font-size="22" font-weight="700" fill="#5c677d">Time →</text><rect x="70" y="260" width="230" height="110" rx="14" fill="#fdecc8" stroke="#d97706" stroke-width="2.5"/><text x="185.0" y="308.7" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Host 1</text><text x="185.0" y="339.55199999999996" text-anchor="middle" font-size="18" fill="#5c677d">old instance</text><line x1="330" y1="315" x2="1850" y2="315" stroke="#9aa5b8" stroke-width="2" stroke-dasharray="4 8"/><rect x="70" y="420" width="230" height="110" rx="14" fill="#d5f5f0" stroke="#0d9488" stroke-width="2.5"/><text x="185.0" y="468.7" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Host 2</text><text x="185.0" y="499.55199999999996" text-anchor="middle" font-size="18" fill="#5c677d">new instance</text><line x1="330" y1="475" x2="1850" y2="475" stroke="#9aa5b8" stroke-width="2" stroke-dasharray="4 8"/><rect x="70" y="580" width="230" height="110" rx="14" fill="#e0eaff" stroke="#2563eb" stroke-width="2.5"/><text x="185.0" y="628.6999999999999" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Downstream</text><text x="185.0" y="659.5519999999999" text-anchor="middle" font-size="18" fill="#5c677d">receiver</text><line x1="330" y1="635" x2="1850" y2="635" stroke="#9aa5b8" stroke-width="2" stroke-dasharray="4 8"/><rect x="70" y="740" width="230" height="110" rx="14" fill="#ece4ff" stroke="#7c3aed" stroke-width="2.5"/><text x="185.0" y="803.4" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Orchestrator</text><line x1="330" y1="795" x2="1850" y2="795" stroke="#9aa5b8" stroke-width="2" stroke-dasharray="4 8"/><rect x="330" y="285" width="1230" height="60" rx="10" fill="#fdecc8" stroke="#d97706" stroke-width="2.5"/><text x="945.0" y="322.7" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">on air</text><rect x="560" y="445" width="1000" height="60" rx="10" fill="#d5f5f0" stroke="#0d9488" stroke-width="2.5"/><text x="1060.0" y="482.35" text-anchor="middle" font-size="21" font-weight="700" fill="#14213d">start → restore state → media-ready</text><rect x="1560" y="445" width="290" height="60" rx="10" fill="#d5f5f0" stroke="#0d9488" stroke-width="2.5"/><text x="1705.0" y="482.7" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">on air</text><rect x="330" y="605" width="1230" height="60" rx="10" fill="#e0eaff" stroke="#2563eb" stroke-width="2.5"/><text x="945.0" y="642.7" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">receives old instance</text><rect x="1560" y="605" width="290" height="60" rx="10" fill="#e0eaff" stroke="#2563eb" stroke-width="2.5"/><text x="1705.0" y="642.7" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">receives new</text><line x1="560" y1="770" x2="560" y2="700" stroke="#7c3aed" stroke-width="3" marker-end="url(#a_violet)"/><text x="560" y="812" text-anchor="middle" font-size="20" font-weight="700" fill="#7c3aed">1 · choose target host</text><line x1="870" y1="770" x2="870" y2="700" stroke="#7c3aed" stroke-width="3" marker-end="url(#a_violet)"/><text x="870" y="812" text-anchor="middle" font-size="20" font-weight="700" fill="#7c3aed">2 · start new instance</text><line x1="1250" y1="770" x2="1250" y2="700" stroke="#7c3aed" stroke-width="3" marker-end="url(#a_violet)"/><text x="1250" y="812" text-anchor="middle" font-size="20" font-weight="700" fill="#7c3aed">3 · copy parameter state</text><line x1="1560" y1="770" x2="1560" y2="700" stroke="#7c3aed" stroke-width="3" marker-end="url(#a_violet)"/><text x="1560" y="812" text-anchor="middle" font-size="20" font-weight="700" fill="#7c3aed">4 · switch connection</text><line x1="1560" y1="345" x2="1560" y2="420" stroke="#dc2626" stroke-width="3" stroke-dasharray="11 8" marker-end="url(#a_red)"/><text x="1590" y="385" text-anchor="start" font-size="20" font-weight="700" fill="#dc2626">5 · stop old instance</text><rect x="70" y="880" width="1780" height="140" rx="14" fill="#eef1f6" stroke="#9aa5b8" stroke-width="2.5"/><text x="960.0" y="959.1" text-anchor="middle" font-size="26" font-weight="400" fill="#14213d">If any step fails: the new instance is torn down and the old one carries on. No half-state on air.</text><text x="960" y="1000" text-anchor="middle" font-size="22" font-weight="400" fill="#5c677d">Gate: the switch happens only after the new node reports 'media ready' (it actually produces / consumes media).</text><text x="1850" y="1064" text-anchor="end" font-size="17" fill="#5c677d">OpenMediaPlatform · open architecture based on EBU DMF, MXL, NMOS, SMPTE ST 2110</text></svg>