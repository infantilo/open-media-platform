<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14213d"/></marker><marker id="as_ink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#14213d"/></marker><marker id="a_blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="as_blue" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2563eb"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="as_teal" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0d9488"/></marker><marker id="a_amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="as_amber" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d97706"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as_red" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker><marker id="a_violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="as_violet" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c3aed"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c677d"/></marker><marker id="as_mute" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5c677d"/></marker><marker id="a_pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="as_pink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#db2777"/></marker></defs><rect width="1920" height="1080" fill="#ffffff"/><text x="70" y="85" font-size="44" font-weight="700" fill="#14213d">10 · What our choice costs, and when we would revisit it</text><text x="70" y="128" font-size="24" fill="#5c677d">Not a religious decision: a trade-off for today's target (24/7 broadcast centres, tens of hosts) that the design keeps reversible.</text><rect x="70" y="146" width="120" height="5" rx="2" fill="#2563eb"/><rect x="70" y="190" width="880" height="330" rx="14" fill="#fde2e2" stroke="#dc2626" stroke-width="2.5"/><text x="100" y="238" text-anchor="start" font-size="29" font-weight="700" fill="#14213d">What our choice costs us</text><text x="100" y="290" text-anchor="start" font-size="22" font-weight="400" fill="#14213d">• We maintain scheduler, updater and hardening ourselves</text><text x="100" y="332" text-anchor="start" font-size="22" font-weight="400" fill="#14213d">• Fewer eyes and less field time than a widely used platform</text><text x="100" y="374" text-anchor="start" font-size="22" font-weight="400" fill="#14213d">• Smaller hiring pool; operators must learn a new tool</text><text x="100" y="416" text-anchor="start" font-size="22" font-weight="400" fill="#14213d">• Large-scale and autoscaling behaviour is unproven</text><text x="100" y="458" text-anchor="start" font-size="22" font-weight="400" fill="#14213d">• Integrations with generic cloud tooling are ours to build</text><rect x="970" y="190" width="880" height="330" rx="14" fill="#fdecc8" stroke="#d97706" stroke-width="2.5"/><text x="1000" y="238" text-anchor="start" font-size="29" font-weight="700" fill="#14213d">Triggers to revisit the decision</text><text x="1000" y="290" text-anchor="start" font-size="22" font-weight="400" fill="#14213d">• Cloud deployments of dozens of hosts with autoscaling</text><text x="1000" y="332" text-anchor="start" font-size="22" font-weight="400" fill="#14213d">• A customer standardises on Kubernetes for all workloads</text><text x="1000" y="374" text-anchor="start" font-size="22" font-weight="400" fill="#14213d">• Pods can share memory and media devices as a routine feature</text><text x="1000" y="416" text-anchor="start" font-size="22" font-weight="400" fill="#14213d">• Our own scheduler becomes the bottleneck in operations</text><text x="1000" y="458" text-anchor="start" font-size="22" font-weight="400" fill="#14213d">• A shared, maintained media operator appears in the community</text><text x="960" y="572" text-anchor="middle" font-size="28" font-weight="700" fill="#14213d">How the design keeps the door open</text><rect x="70" y="590" width="1780" height="430" rx="18" fill="#d5f5f0" fill-opacity="0.45" stroke="#0d9488" stroke-width="2" stroke-dasharray="3 0"/><text x="92" y="624" font-size="23" font-weight="700" fill="#0d9488" letter-spacing="1">THE NODE CONTRACT STAYS IDENTICAL, ONLY THE RUNNER BELOW IT CHANGES</text><rect x="110" y="640" width="520" height="100" rx="14" fill="#d5f5f0" stroke="#0d9488" stroke-width="2.5"/><text x="370.0" y="683.1" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">Orchestrator</text><text x="370.0" y="716.53" text-anchor="middle" font-size="20" fill="#5c677d">placement, workflows, connections, state</text><rect x="110" y="790" width="520" height="100" rx="14" fill="#ece4ff" stroke="#7c3aed" stroke-width="2.5"/><text x="370.0" y="833.1" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">Node contract</text><text x="370.0" y="866.53" text-anchor="middle" font-size="20" fill="#5c677d">IS-04/05, IS-12/14, state export / import</text><line x1="370" y1="740" x2="370" y2="790" stroke="#0d9488" stroke-width="3.5" marker-end="url(#a_teal)" marker-start="url(#as_teal)"/><rect x="700" y="640" width="540" height="100" rx="14" fill="#fdecc8" stroke="#d97706" stroke-width="2.5"/><text x="970.0" y="683.1" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">Runner: host agent</text><text x="970.0" y="716.53" text-anchor="middle" font-size="20" fill="#5c677d">starts processes and OCI images, reports load</text><rect x="1310" y="640" width="500" height="100" rx="14" fill="#e0eaff" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="10 7"/><text x="1560.0" y="683.6999999999999" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Runner: Kubernetes (optional)</text><text x="1560.0" y="714.5519999999999" text-anchor="middle" font-size="18" fill="#5c677d">planned for cloud (k3s / managed)</text><line x1="630" y1="690" x2="700" y2="690" stroke="#0d9488" stroke-width="4" marker-end="url(#a_teal)"/><line x1="1240" y1="690" x2="1310" y2="690" stroke="#14213d" stroke-width="3" stroke-dasharray="11 8" marker-end="url(#a_ink)"/><rect x="700" y="790" width="1110" height="100" rx="14" fill="#fdecc8" stroke="#d97706" stroke-width="2.5"/><text x="1255.0" y="833.6999999999999" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">The same nodes, whichever runner starts them</text><text x="1255.0" y="864.5519999999999" text-anchor="middle" font-size="18" fill="#5c677d">media-aware placement and make-before-break stay in the orchestrator</text><line x1="970" y1="740" x2="970" y2="790" stroke="#d97706" stroke-width="3" marker-end="url(#a_amber)"/><line x1="1560" y1="740" x2="1560" y2="790" stroke="#2563eb" stroke-width="3" stroke-dasharray="11 8" marker-end="url(#a_blue)"/><text x="960" y="945.0" text-anchor="middle" font-size="22" fill="#14213d">Rule of thumb we apply: generic services (databases, web, batch) may run on any platform, including Kubernetes. Live media</text><text x="960" y="974.7" text-anchor="middle" font-size="22" fill="#14213d">functions are placed by something that knows the signal path.</text><text x="1850" y="1064" text-anchor="end" font-size="17" fill="#5c677d">OpenMediaPlatform · open architecture based on EBU DMF, MXL, NMOS, SMPTE ST 2110</text></svg>