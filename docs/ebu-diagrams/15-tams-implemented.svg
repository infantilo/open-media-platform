<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14213d"/></marker><marker id="as_ink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#14213d"/></marker><marker id="a_blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="as_blue" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2563eb"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="as_teal" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0d9488"/></marker><marker id="a_amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="as_amber" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d97706"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as_red" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker><marker id="a_violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="as_violet" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c3aed"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c677d"/></marker><marker id="as_mute" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5c677d"/></marker><marker id="a_pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="as_pink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#db2777"/></marker></defs><rect width="1920" height="1080" fill="#ffffff"/><text x="70" y="85" font-size="44" font-weight="700" fill="#14213d">15 · TAMS implemented: record, replay and time-shift</text><text x="70" y="128" font-size="24" fill="#5c677d">The platform speaks the Time-addressable Media Store API, version 8.2, as a client. Live MXL flows go into the store on a TAI timeline.</text><rect x="70" y="146" width="120" height="5" rx="2" fill="#2563eb"/><rect x="70" y="175" width="1780" height="400" rx="18" fill="#e0eaff" fill-opacity="0.45" stroke="#2563eb" stroke-width="2" stroke-dasharray="3 0"/><text x="92" y="209" font-size="23" font-weight="700" fill="#2563eb" letter-spacing="1">DATA PATH</text><rect x="110" y="235" width="300" height="110" rx="14" fill="#eef1f6" stroke="#9aa5b8" stroke-width="2.5"/><text x="260.0" y="271.05" text-anchor="middle" font-size="25" font-weight="700" fill="#14213d">Live source</text><text x="260.0" y="303.191" text-anchor="middle" font-size="19" fill="#5c677d">MXL video and audio</text><text x="260.0" y="327.89099999999996" text-anchor="middle" font-size="19" fill="#5c677d">flows, TAI time</text><rect x="500" y="215" width="360" height="150" rx="14" fill="#d5f5f0" stroke="#0d9488" stroke-width="2.5"/><text x="680.0" y="255.5" text-anchor="middle" font-size="27" font-weight="700" fill="#14213d">TAMS recorder</text><text x="680.0" y="290.21900000000005" text-anchor="middle" font-size="21" fill="#5c677d">H.264 / AAC, GOP-aligned</text><text x="680.0" y="317.519" text-anchor="middle" font-size="21" fill="#5c677d">segments, one flow per</text><text x="680.0" y="344.8190000000001" text-anchor="middle" font-size="21" fill="#5c677d">essence, disk queue</text><rect x="950" y="215" width="380" height="320" rx="14" fill="#e0eaff" stroke="#2563eb" stroke-width="2.5"/><text x="1140.0" y="296.34999999999997" text-anchor="middle" font-size="29" font-weight="700" fill="#14213d">TAMS store</text><text x="1140.0" y="332.63300000000004" text-anchor="middle" font-size="22" fill="#5c677d">API 8.2. Source > Flow ></text><text x="1140.0" y="361.23300000000006" text-anchor="middle" font-size="22" fill="#5c677d">Segment > Object. Time</text><text x="1140.0" y="389.8330000000001" text-anchor="middle" font-size="22" fill="#5c677d">ranges instead of file</text><text x="1140.0" y="418.4330000000001" text-anchor="middle" font-size="22" fill="#5c677d">names. Objects immutable,</text><text x="1140.0" y="447.03300000000013" text-anchor="middle" font-size="22" fill="#5c677d">reference-counted. Init</text><text x="1140.0" y="475.63300000000015" text-anchor="middle" font-size="22" fill="#5c677d">segments for fragmented MP4.</text><rect x="1420" y="215" width="390" height="90" rx="14" fill="#d5f5f0" stroke="#0d9488" stroke-width="2.5"/><text x="1615.0" y="242.0" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Replay and time-shift</text><text x="1615.0" y="272.852" text-anchor="middle" font-size="18" fill="#5c677d">range, 'N seconds ago', follow with</text><text x="1615.0" y="296.25199999999995" text-anchor="middle" font-size="18" fill="#5c677d">delay</text><rect x="1420" y="330" width="390" height="90" rx="14" fill="#d5f5f0" stroke="#0d9488" stroke-width="2.5"/><text x="1615.0" y="357.0" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Clip export</text><text x="1615.0" y="387.852" text-anchor="middle" font-size="18" fill="#5c677d">MP4, MKV, TS, MOV; lossless or</text><text x="1615.0" y="411.25199999999995" text-anchor="middle" font-size="18" fill="#5c677d">frame-exact</text><rect x="1420" y="445" width="390" height="90" rx="14" fill="#d5f5f0" stroke="#0d9488" stroke-width="2.5"/><text x="1615.0" y="472.0" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Retention worker</text><text x="1615.0" y="502.852" text-anchor="middle" font-size="18" fill="#5c677d">segments, flows, empty flows</text><text x="1615.0" y="526.252" text-anchor="middle" font-size="18" fill="#5c677d">(AppNote 0019)</text><rect x="110" y="410" width="750" height="125" rx="14" fill="#fdecc8" stroke="#d97706" stroke-width="2.5"/><text x="485.0" y="452.6" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">Recording schedule</text><text x="485.0" y="486.03" text-anchor="middle" font-size="20" fill="#5c677d">target 'tams': one metadata copy per show (same objects, no</text><text x="485.0" y="512.03" text-anchor="middle" font-size="20" fill="#5c677d">media moved) plus a library reference asset</text><line x1="410" y1="290" x2="498" y2="290" stroke="#14213d" stroke-width="3.5" marker-end="url(#a_ink)"/><line x1="860" y1="290" x2="948" y2="290" stroke="#0d9488" stroke-width="4.5" marker-end="url(#a_teal)"/><text x="904.0" y="268" text-anchor="middle" font-size="20" fill="#0d9488" font-weight="600">segments</text><line x1="485" y1="410" x2="600" y2="367" stroke="#d97706" stroke-width="3.5" stroke-dasharray="11 8" marker-end="url(#a_amber)"/><line x1="860" y1="480" x2="948" y2="480" stroke="#d97706" stroke-width="3.5" stroke-dasharray="11 8" marker-end="url(#a_amber)"/><text x="904.0" y="458" text-anchor="middle" font-size="20" fill="#d97706" font-weight="600">copy</text><line x1="1330" y1="260" x2="1418" y2="260" stroke="#2563eb" stroke-width="3.5" marker-end="url(#a_blue)" marker-start="url(#as_blue)"/><line x1="1330" y1="375" x2="1418" y2="375" stroke="#2563eb" stroke-width="3.5" marker-end="url(#a_blue)"/><line x1="1330" y1="490" x2="1418" y2="490" stroke="#2563eb" stroke-width="3.5" marker-end="url(#a_blue)" marker-start="url(#as_blue)"/><text x="1810" y="562" text-anchor="end" font-size="19" font-weight="400" fill="#5c677d">Replay returns as MXL flows to mixer and viewer</text><rect x="70" y="605" width="1780" height="430" rx="18" fill="#d5f5f0" fill-opacity="0.45" stroke="#0d9488" stroke-width="2" stroke-dasharray="3 0"/><text x="92" y="639" font-size="23" font-weight="700" fill="#0d9488" letter-spacing="1">SCOPE AND STATUS</text><rect x="110" y="660" width="270" height="160" rx="14" fill="#eef1f6" stroke="#9aa5b8" stroke-width="2.5"/><text x="245.0" y="711.5500000000001" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Time on TAI</text><text x="245.0" y="740.8380000000001" text-anchor="middle" font-size="17" fill="#5c677d">AppNote 0002, 0008. MXL</text><text x="245.0" y="762.9380000000001" text-anchor="middle" font-size="17" fill="#5c677d">index and timestamp</text><text x="245.0" y="785.0380000000001" text-anchor="middle" font-size="17" fill="#5c677d">convert bit-exact.</text><rect x="394" y="660" width="270" height="160" rx="14" fill="#eef1f6" stroke="#9aa5b8" stroke-width="2.5"/><text x="529.0" y="697.8000000000001" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Independent</text><text x="529.0" y="725.3000000000001" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">segments</text><text x="529.0" y="754.5880000000001" text-anchor="middle" font-size="17" fill="#5c677d">AppNote 0005, 0010.</text><text x="529.0" y="776.6880000000001" text-anchor="middle" font-size="17" fill="#5c677d">Keyframe first,</text><text x="529.0" y="798.7880000000001" text-anchor="middle" font-size="17" fill="#5c677d">long-lived flows.</text><rect x="678" y="660" width="270" height="160" rx="14" fill="#eef1f6" stroke="#9aa5b8" stroke-width="2.5"/><text x="813.0" y="711.5500000000001" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Init segments</text><text x="813.0" y="740.8380000000001" text-anchor="middle" font-size="17" fill="#5c677d">AppNote 0024. Fragmented</text><text x="813.0" y="762.9380000000001" text-anchor="middle" font-size="17" fill="#5c677d">MP4 with one reused init</text><text x="813.0" y="785.0380000000001" text-anchor="middle" font-size="17" fill="#5c677d">object.</text><rect x="110" y="835" width="270" height="160" rx="14" fill="#eef1f6" stroke="#9aa5b8" stroke-width="2.5"/><text x="245.0" y="886.5500000000001" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Retention</text><text x="245.0" y="915.8380000000001" text-anchor="middle" font-size="17" fill="#5c677d">AppNote 0019. Tags, own</text><text x="245.0" y="937.9380000000001" text-anchor="middle" font-size="17" fill="#5c677d">worker node, tagged flows</text><text x="245.0" y="960.0380000000001" text-anchor="middle" font-size="17" fill="#5c677d">only.</text><rect x="394" y="835" width="270" height="160" rx="14" fill="#eef1f6" stroke="#9aa5b8" stroke-width="2.5"/><text x="529.0" y="886.5500000000001" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Access</text><text x="529.0" y="915.8380000000001" text-anchor="middle" font-size="17" fill="#5c677d">ADR-0028. Bearer, Basic,</text><text x="529.0" y="937.9380000000001" text-anchor="middle" font-size="17" fill="#5c677d">URL token. TLS, secrets</text><text x="529.0" y="960.0380000000001" text-anchor="middle" font-size="17" fill="#5c677d">from file only.</text><rect x="678" y="835" width="270" height="160" rx="14" fill="#eef1f6" stroke="#9aa5b8" stroke-width="2.5"/><text x="813.0" y="886.5500000000001" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">In the platform</text><text x="813.0" y="915.8380000000001" text-anchor="middle" font-size="17" fill="#5c677d">Scheduled recording,</text><text x="813.0" y="937.9380000000001" text-anchor="middle" font-size="17" fill="#5c677d">panels, file transfer</text><text x="813.0" y="960.0380000000001" text-anchor="middle" font-size="17" fill="#5c677d">between hosts.</text><rect x="1010" y="655" width="380" height="340" rx="14" fill="#d5f5f0" stroke="#0d9488" stroke-width="2.5"/><text x="1200" y="697" text-anchor="middle" font-size="21" font-weight="700" fill="#0d9488">VERIFIED</text><text x="1030" y="735" text-anchor="start" font-size="20" font-weight="400" fill="#14213d">- Test server that enforces the</text><text x="1030" y="761" text-anchor="start" font-size="20" font-weight="400" fill="#14213d">  spec rules</text><text x="1030" y="797" text-anchor="start" font-size="20" font-weight="400" fill="#14213d">- The specification's own mock</text><text x="1030" y="823" text-anchor="start" font-size="20" font-weight="400" fill="#14213d">  server, schemas checked</text><text x="1030" y="859" text-anchor="start" font-size="20" font-weight="400" fill="#14213d">- End to end with real sources</text><text x="1030" y="885" text-anchor="start" font-size="20" font-weight="400" fill="#14213d">  and ffprobe</text><text x="1030" y="921" text-anchor="start" font-size="20" font-weight="400" fill="#14213d">- Playback into a real MXL</text><text x="1030" y="947" text-anchor="start" font-size="20" font-weight="400" fill="#14213d">  domain</text><rect x="1420" y="655" width="390" height="340" rx="14" fill="#fdecc8" stroke="#d97706" stroke-width="2.5"/><text x="1615" y="697" text-anchor="middle" font-size="21" font-weight="700" fill="#d97706">STILL OPEN</text><text x="1440" y="735" text-anchor="start" font-size="20" font-weight="400" fill="#14213d">- Run on a production store</text><text x="1440" y="761" text-anchor="start" font-size="20" font-weight="400" fill="#14213d">  (partner with access wanted)</text><text x="1440" y="797" text-anchor="start" font-size="20" font-weight="400" fill="#14213d">- Strict CMAF brands (cmafmux)</text><text x="1440" y="859" text-anchor="start" font-size="20" font-weight="400" fill="#14213d">- Load at 1080p50 and long-term</text><text x="1440" y="885" text-anchor="start" font-size="20" font-weight="400" fill="#14213d">  operation</text><text x="1440" y="921" text-anchor="start" font-size="20" font-weight="400" fill="#14213d">- Interoperability with other</text><text x="1440" y="947" text-anchor="start" font-size="20" font-weight="400" fill="#14213d">  TAMS clients</text><text x="1850" y="1064" text-anchor="end" font-size="17" fill="#5c677d">OpenMediaPlatform · open architecture based on EBU DMF, MXL, NMOS, SMPTE ST 2110</text></svg>