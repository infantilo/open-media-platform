<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14213d"/></marker><marker id="as_ink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#14213d"/></marker><marker id="a_blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="as_blue" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2563eb"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="as_teal" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0d9488"/></marker><marker id="a_amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="as_amber" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d97706"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as_red" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker><marker id="a_violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="as_violet" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c3aed"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c677d"/></marker><marker id="as_mute" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5c677d"/></marker><marker id="a_pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="as_pink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#db2777"/></marker></defs><rect width="1920" height="1080" fill="#ffffff"/><text x="70" y="85" font-size="44" font-weight="700" fill="#14213d">7 · Choosing the media path between two functions</text><text x="70" y="128" font-size="24" fill="#5c677d">One rule set, applied automatically at placement time. The signal is never lost: acceleration is optional, a fallback always exists.</text><rect x="70" y="146" width="120" height="5" rx="2" fill="#2563eb"/><rect x="70" y="190" width="420" height="120" rx="14" fill="#eef1f6" stroke="#14213d" stroke-width="2.5"/><text x="280.0" y="229.5" text-anchor="middle" font-size="28" font-weight="700" fill="#14213d">Two functions</text><text x="280.0" y="264.494" text-anchor="middle" font-size="21" fill="#5c677d">two functions need to exchange</text><text x="280.0" y="291.794" text-anchor="middle" font-size="21" fill="#5c677d">media</text><rect x="560" y="190" width="520" height="120" rx="14" fill="#eef1f6" stroke="#14213d" stroke-width="2.5"/><text x="820.0" y="259.1" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">Same host?</text><rect x="1280" y="190" width="570" height="120" rx="14" fill="#ece4ff" stroke="#7c3aed" stroke-width="2.5"/><text x="1565.0" y="243.1" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">MXL shared memory</text><text x="1565.0" y="276.53" text-anchor="middle" font-size="20" fill="#5c677d">zero-copy, no NIC, no encoding</text><line x1="1080" y1="250" x2="1280" y2="250" stroke="#7c3aed" stroke-width="5" marker-end="url(#a_violet)"/><text x="1180.0" y="238" text-anchor="middle" font-size="20" fill="#7c3aed" font-weight="600">yes</text><line x1="820" y1="310" x2="820" y2="380" stroke="#14213d" stroke-width="4" marker-end="url(#a_ink)"/><text x="840" y="352" text-anchor="start" font-size="21" font-weight="700" fill="#5c677d">no</text><rect x="560" y="380" width="520" height="120" rx="14" fill="#eef1f6" stroke="#14213d" stroke-width="2.5"/><text x="820.0" y="432.85" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">Same RDMA-capable fabric</text><text x="820.0" y="465.35" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">segment?</text><rect x="1280" y="380" width="570" height="120" rx="14" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/><text x="1565.0" y="420.1" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">MXL Fabrics over RDMA</text><text x="1565.0" y="453.53" text-anchor="middle" font-size="20" fill="#5c677d">RoCEv2 / EFA, one-sided write, lowest CPU load;</text><text x="1565.0" y="479.53" text-anchor="middle" font-size="20" fill="#5c677d">reserved like an I/O card</text><line x1="1080" y1="440" x2="1280" y2="440" stroke="#db2777" stroke-width="5" marker-end="url(#a_pink)"/><text x="1180.0" y="428" text-anchor="middle" font-size="20" fill="#db2777" font-weight="600">yes</text><line x1="820" y1="500" x2="820" y2="570" stroke="#14213d" stroke-width="4" marker-end="url(#a_ink)"/><text x="840" y="542" text-anchor="start" font-size="21" font-weight="700" fill="#5c677d">no</text><rect x="560" y="570" width="520" height="120" rx="14" fill="#eef1f6" stroke="#14213d" stroke-width="2.5"/><text x="820.0" y="622.85" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">Same LAN with multicast and</text><text x="820.0" y="655.35" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">PTP?</text><rect x="1280" y="570" width="570" height="120" rx="14" fill="#ece4ff" stroke="#7c3aed" stroke-width="2.5"/><text x="1565.0" y="623.1" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">SMPTE ST 2110 / 2022-7</text><text x="1565.0" y="656.53" text-anchor="middle" font-size="20" fill="#5c677d">uncompressed, PTP time, redundant paths</text><line x1="1080" y1="630" x2="1280" y2="630" stroke="#7c3aed" stroke-width="5" marker-end="url(#a_violet)"/><text x="1180.0" y="618" text-anchor="middle" font-size="20" fill="#7c3aed" font-weight="600">yes</text><line x1="820" y1="690" x2="820" y2="760" stroke="#14213d" stroke-width="4" marker-end="url(#a_ink)"/><text x="840" y="732" text-anchor="start" font-size="21" font-weight="700" fill="#5c677d">no</text><rect x="560" y="760" width="520" height="120" rx="14" fill="#eef1f6" stroke="#14213d" stroke-width="2.5"/><text x="820.0" y="812.85" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">Otherwise (WAN, cloud, no</text><text x="820.0" y="845.35" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">multicast)</text><rect x="1280" y="760" width="570" height="120" rx="14" fill="#fdecc8" stroke="#d97706" stroke-width="2.5"/><text x="1565.0" y="813.1" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">SRT / RIST via gateway node</text><text x="1565.0" y="846.53" text-anchor="middle" font-size="20" fill="#5c677d">unicast, FEC; 2110 stays inside the facility</text><line x1="1080" y1="820" x2="1280" y2="820" stroke="#d97706" stroke-width="5" marker-end="url(#a_amber)"/><text x="1180.0" y="808" text-anchor="middle" font-size="20" fill="#d97706" font-weight="600">else</text><line x1="490" y1="250" x2="560" y2="250" stroke="#14213d" stroke-width="4" marker-end="url(#a_ink)"/><rect x="70" y="350" width="420" height="330" rx="14" fill="#e0eaff" stroke="#2563eb" stroke-width="2.5"/><text x="280" y="395" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">Fallback is soft</text><text x="280" y="435.0" text-anchor="middle" font-size="21" fill="#14213d">If an accelerated path cannot be</text><text x="280" y="463.35" text-anchor="middle" font-size="21" fill="#14213d">provided at placement time, the</text><text x="280" y="491.7" text-anchor="middle" font-size="21" fill="#14213d">connection falls back to the</text><text x="280" y="520.05" text-anchor="middle" font-size="21" fill="#14213d">next option automatically, with</text><text x="280" y="548.4" text-anchor="middle" font-size="21" fill="#14213d">an advisory. The programme is</text><text x="280" y="576.75" text-anchor="middle" font-size="21" fill="#14213d">never stopped for lack of</text><text x="280" y="605.1" text-anchor="middle" font-size="21" fill="#14213d">acceleration.</text><rect x="70" y="710" width="420" height="250" rx="14" fill="#eef1f6" stroke="#9aa5b8" stroke-width="2.5"/><text x="280" y="752" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Status</text><text x="280" y="790.0" text-anchor="middle" font-size="20" fill="#5c677d">RDMA path implemented on the</text><text x="280" y="817.0" text-anchor="middle" font-size="20" fill="#5c677d">libfabric software provider and</text><text x="280" y="844.0" text-anchor="middle" font-size="20" fill="#5c677d">verified end to end. Validation</text><text x="280" y="871.0" text-anchor="middle" font-size="20" fill="#5c677d">on RoCEv2 hardware is planned.</text><text x="1850" y="1064" text-anchor="end" font-size="17" fill="#5c677d">OpenMediaPlatform · open architecture based on EBU DMF, MXL, NMOS, SMPTE ST 2110</text></svg>