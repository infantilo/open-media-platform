<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14213d"/></marker><marker id="as_ink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#14213d"/></marker><marker id="a_blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="as_blue" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2563eb"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="as_teal" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0d9488"/></marker><marker id="a_amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="as_amber" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d97706"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as_red" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker><marker id="a_violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="as_violet" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c3aed"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c677d"/></marker><marker id="as_mute" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5c677d"/></marker><marker id="a_pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="as_pink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#db2777"/></marker></defs><rect width="1920" height="1080" fill="#ffffff"/><text x="70" y="85" font-size="44" font-weight="700" fill="#14213d">11 · What this proof of concept is, and what it is not</text><text x="70" y="128" font-size="24" fill="#5c677d">A working open reference for the DMF idea: strong for learning, experiments and development, not a drop-in for a certified plant.</text><rect x="70" y="146" width="120" height="5" rx="2" fill="#2563eb"/><rect x="70" y="175" width="865" height="430" rx="18" fill="#d5f5f0" fill-opacity="0.45" stroke="#0d9488" stroke-width="2" stroke-dasharray="3 0"/><text x="92" y="209" font-size="23" font-weight="700" fill="#0d9488" letter-spacing="1">WHAT YOU CAN DO WITH IT</text><rect x="985" y="175" width="865" height="430" rx="18" fill="#fde2e2" fill-opacity="0.45" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 0"/><text x="1007" y="209" font-size="23" font-weight="700" fill="#dc2626" letter-spacing="1">WHAT YOU SHOULD NOT RELY ON IT FOR</text><rect x="95" y="222" width="815" height="68" rx="14" fill="#d5f5f0" stroke="#0d9488" stroke-width="2.5"/><text x="502.5" y="249.64999999999998" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Experiment with MXL, NMOS and ST 2110 hands-on</text><text x="502.5" y="278.938" text-anchor="middle" font-size="17" fill="#5c677d">flows, connections, timing on running software; no licence needed</text><rect x="95" y="298" width="815" height="68" rx="14" fill="#d5f5f0" stroke="#0d9488" stroke-width="2.5"/><text x="502.5" y="325.65" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Develop your own functions as nodes</text><text x="502.5" y="354.938" text-anchor="middle" font-size="17" fill="#5c677d">self-describing contract, node SDK, tutorial; try integration Level A, B and C</text><rect x="95" y="374" width="815" height="68" rx="14" fill="#d5f5f0" stroke="#0d9488" stroke-width="2.5"/><text x="502.5" y="401.65" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Learn and teach the DMF idea end to end</text><text x="502.5" y="430.938" text-anchor="middle" font-size="17" fill="#5c677d">control vs media plane, placement, failure handling: all visible</text><rect x="95" y="450" width="815" height="68" rx="14" fill="#d5f5f0" stroke="#0d9488" stroke-width="2.5"/><text x="502.5" y="477.65" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Run small productions and lab set-ups</text><text x="502.5" y="506.938" text-anchor="middle" font-size="17" fill="#5c677d">playout, mixing, graphics, recording, radio; read the open points first</text><rect x="95" y="526" width="815" height="68" rx="14" fill="#d5f5f0" stroke="#0d9488" stroke-width="2.5"/><text x="502.5" y="553.6500000000001" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Audit and change everything</text><text x="502.5" y="582.9380000000001" text-anchor="middle" font-size="17" fill="#5c677d">open source (Apache-2.0), standards first, no lock-in</text><rect x="1010" y="222" width="815" height="68" rx="14" fill="#fde2e2" stroke="#dc2626" stroke-width="2.5"/><text x="1417.5" y="249.64999999999998" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Replace a certified 24/7 plant today</text><text x="1417.5" y="278.938" text-anchor="middle" font-size="17" fill="#5c677d">short field record; several paths not yet run on real hardware</text><rect x="1010" y="298" width="815" height="68" rx="14" fill="#fde2e2" stroke="#dc2626" stroke-width="2.5"/><text x="1417.5" y="325.65" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Come with support, SLA or indemnity</text><text x="1417.5" y="354.938" text-anchor="middle" font-size="17" fill="#5c677d">no vendor behind it; no patent or codec licence coverage; no warranty</text><rect x="1010" y="374" width="815" height="68" rx="14" fill="#fde2e2" stroke="#dc2626" stroke-width="2.5"/><text x="1417.5" y="401.65" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Cover every format and device</text><text x="1417.5" y="430.938" text-anchor="middle" font-size="17" fill="#5c677d">no NDI gateway; capture cards not verified on hardware</text><rect x="1010" y="450" width="815" height="68" rx="14" fill="#fde2e2" stroke="#dc2626" stroke-width="2.5"/><text x="1417.5" y="477.65" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Claim certification</text><text x="1417.5" y="506.938" text-anchor="middle" font-size="17" fill="#5c677d">standards implemented and checked, but not formally certified</text><rect x="1010" y="526" width="815" height="68" rx="14" fill="#fde2e2" stroke="#dc2626" stroke-width="2.5"/><text x="1417.5" y="553.6500000000001" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Scale to hundreds of hosts or full MAM / traffic / ad</text><text x="1417.5" y="582.9380000000001" text-anchor="middle" font-size="17" fill="#5c677d">sized for tens of hosts; asset management, traffic and billing are out of scope</text><rect x="70" y="630" width="280" height="40" rx="10" fill="#eef1f6" stroke="#9aa5b8" stroke-width="2"/><text x="210.0" y="658" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Dimension</text><rect x="370" y="630" width="560" height="40" rx="10" fill="#fdecc8" stroke="#d97706" stroke-width="2"/><text x="650.0" y="658" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Large commercial products</text><rect x="950" y="630" width="560" height="40" rx="10" fill="#d5f5f0" stroke="#0d9488" stroke-width="2"/><text x="1230.0" y="658" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">This proof of concept</text><rect x="1530" y="630" width="320" height="40" rx="10" fill="#eef1f6" stroke="#9aa5b8" stroke-width="2"/><text x="1690.0" y="658" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Who is ahead</text><rect x="70" y="678" width="280" height="62" rx="10" fill="#eef1f6" stroke="#9aa5b8" stroke-width="1.5"/><text x="84" y="702.7" text-anchor="start" font-size="21" font-weight="700" fill="#14213d">Openness and</text><text x="84" y="730.0" text-anchor="start" font-size="21" font-weight="700" fill="#14213d">standards</text><rect x="370" y="678" width="560" height="62" rx="10" fill="#eef1f6" stroke="#9aa5b8" stroke-width="1.5"/><text x="384" y="703.3" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">Mix of proprietary and standards-based parts;</text><text x="384" y="728.0" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">control often vendor-specific</text><rect x="950" y="678" width="560" height="62" rx="10" fill="#eef1f6" stroke="#9aa5b8" stroke-width="1.5"/><text x="964" y="703.3" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">Standards first (DMF, MXL, NMOS, ST 2110), open</text><text x="964" y="728.0" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">source, any node can join</text><rect x="1530" y="678" width="320" height="62" rx="10" fill="#d5f5f0" stroke="#0d9488" stroke-width="2.5"/><text x="1690.0" y="717" text-anchor="middle" font-size="21" font-weight="700" fill="#14213d">PoC ahead</text><rect x="70" y="746" width="280" height="62" rx="10" fill="#eef1f6" stroke="#9aa5b8" stroke-width="1.5"/><text x="84" y="784.35" text-anchor="start" font-size="21" font-weight="700" fill="#14213d">Breadth of functions</text><rect x="370" y="746" width="560" height="62" rx="10" fill="#eef1f6" stroke="#9aa5b8" stroke-width="1.5"/><text x="384" y="771.3" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">Complete families: MAM, traffic, ad, QC, many</text><text x="384" y="796.0" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">codecs and devices</text><rect x="950" y="746" width="560" height="62" rx="10" fill="#eef1f6" stroke="#9aa5b8" stroke-width="1.5"/><text x="964" y="771.3" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">Core live functions plus some file tools;</text><text x="964" y="796.0" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">deliberately narrow</text><rect x="1530" y="746" width="320" height="62" rx="10" fill="#fdecc8" stroke="#d97706" stroke-width="2.5"/><text x="1690.0" y="785" text-anchor="middle" font-size="21" font-weight="700" fill="#14213d">Commercial ahead</text><rect x="70" y="814" width="280" height="62" rx="10" fill="#eef1f6" stroke="#9aa5b8" stroke-width="1.5"/><text x="84" y="838.7" text-anchor="start" font-size="21" font-weight="700" fill="#14213d">Maturity and</text><text x="84" y="866.0" text-anchor="start" font-size="21" font-weight="700" fill="#14213d">certification</text><rect x="370" y="814" width="560" height="62" rx="10" fill="#eef1f6" stroke="#9aa5b8" stroke-width="1.5"/><text x="384" y="851.65" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">Years in the field, certified, hardened, audited</text><rect x="950" y="814" width="560" height="62" rx="10" fill="#eef1f6" stroke="#9aa5b8" stroke-width="1.5"/><text x="964" y="839.3" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">Young; verified in lab and CI; open points</text><text x="964" y="864.0" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">documented</text><rect x="1530" y="814" width="320" height="62" rx="10" fill="#fdecc8" stroke="#d97706" stroke-width="2.5"/><text x="1690.0" y="853" text-anchor="middle" font-size="21" font-weight="700" fill="#14213d">Commercial ahead</text><rect x="70" y="882" width="280" height="62" rx="10" fill="#eef1f6" stroke="#9aa5b8" stroke-width="1.5"/><text x="84" y="920.35" text-anchor="start" font-size="21" font-weight="700" fill="#14213d">Support and liability</text><rect x="370" y="882" width="560" height="62" rx="10" fill="#eef1f6" stroke="#9aa5b8" stroke-width="1.5"/><text x="384" y="907.3" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">Contracts, SLAs, indemnity, training, roadmap</text><text x="384" y="932.0" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">commitments</text><rect x="950" y="882" width="560" height="62" rx="10" fill="#eef1f6" stroke="#9aa5b8" stroke-width="1.5"/><text x="964" y="907.3" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">Community and own effort; you carry integration and</text><text x="964" y="932.0" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">responsibility</text><rect x="1530" y="882" width="320" height="62" rx="10" fill="#fdecc8" stroke="#d97706" stroke-width="2.5"/><text x="1690.0" y="921" text-anchor="middle" font-size="21" font-weight="700" fill="#14213d">Commercial ahead</text><rect x="70" y="950" width="280" height="62" rx="10" fill="#eef1f6" stroke="#9aa5b8" stroke-width="1.5"/><text x="84" y="974.7" text-anchor="start" font-size="21" font-weight="700" fill="#14213d">Experimentation and</text><text x="84" y="1002.0" text-anchor="start" font-size="21" font-weight="700" fill="#14213d">development</text><rect x="370" y="950" width="560" height="62" rx="10" fill="#eef1f6" stroke="#9aa5b8" stroke-width="1.5"/><text x="384" y="975.3" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">Licensed, closed; sandbox on request, limited</text><text x="384" y="1000.0" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">insight</text><rect x="950" y="950" width="560" height="62" rx="10" fill="#eef1f6" stroke="#9aa5b8" stroke-width="1.5"/><text x="964" y="975.3" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">Install on a normal Linux machine or VM, read and</text><text x="964" y="1000.0" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">change the source</text><rect x="1530" y="950" width="320" height="62" rx="10" fill="#d5f5f0" stroke="#0d9488" stroke-width="2.5"/><text x="1690.0" y="989" text-anchor="middle" font-size="21" font-weight="700" fill="#14213d">PoC ahead</text><text x="1850" y="1064" text-anchor="end" font-size="17" fill="#5c677d">OpenMediaPlatform · open architecture based on EBU DMF, MXL, NMOS, SMPTE ST 2110</text></svg>