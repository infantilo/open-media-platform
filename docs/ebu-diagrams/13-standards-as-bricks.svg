ext x="116" y="906" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">EBU</text><rect x="176" y="885" width="34" height="26" rx="6" fill="#d5f5f0" stroke="#0d9488" stroke-width="2.5"/><text x="222" y="906" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">AMWA NMOS</text><rect x="392" y="885" width="34" height="26" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/><text x="438" y="906" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">MXL project</text><rect x="578" y="885" width="34" height="26" rx="6" fill="#ece4ff" stroke="#7c3aed" stroke-width="2.5"/><text x="624" y="906" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">SMPTE / IEEE / AES</text><rect x="864" y="885" width="34" height="26" rx="6" fill="#eef1f6" stroke="#9aa5b8" stroke-width="2.5"/><text x="910" y="906" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">other open specs and libraries</text><rect x="1240" y="885" width="34" height="26" rx="6" fill="#fdecc8" stroke="#d97706" stroke-width="2.5"/><text x="1286" y="906" text-anchor="start" font-size="19" font-weight="400" fill="#14213d">our own bricks</text><rect x="70" y="930" width="1780" height="90" rx="14" fill="#eef1f6" stroke="#9aa5b8" stroke-width="2.5"/><text x="960.0" y="968.6999999999999" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Rule: use the standard where one exists, name its number and version, and build our own brick only for the gap.</text><text x="960.0" y="999.5519999999999" text-anchor="middle" font-size="18" fill="#5c677d">Own bricks: operate, orchestrate, bridge, host. They make the standard parts work as one facility, and each one is checked as described in diagram 12.</text><text x="1850" y="1064" text-anchor="end" font-size="17" fill="#5c677d">OpenMediaPlatform · open architecture based on EBU DMF, MXL, NMOS, SMPTE ST 2110</text></svg>