<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><marker id="a_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14213d"/></marker><marker id="as_ink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#14213d"/></marker><marker id="a_blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="as_blue" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2563eb"/></marker><marker id="a_teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="as_teal" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0d9488"/></marker><marker id="a_amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="as_amber" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d97706"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="as_red" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker><marker id="a_violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="as_violet" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7c3aed"/></marker><marker id="a_mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c677d"/></marker><marker id="as_mute" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5c677d"/></marker></defs><rect width="1920" height="1080" fill="#ffffff"/><text x="70" y="85" font-size="44" font-weight="700" fill="#14213d">1 · Architecture at a glance</text><text x="70" y="128" font-size="24" fill="#5c677d">Every function is a replaceable node. The orchestrator knows no vendor and no node type, only standards.</text><rect x="70" y="146" width="120" height="5" rx="2" fill="#2563eb"/><rect x="70" y="180" width="1780" height="150" rx="18" fill="#e0eaff" fill-opacity="0.45" stroke="#2563eb" stroke-width="2" stroke-dasharray="3 0"/><text x="92" y="214" font-size="23" font-weight="700" fill="#2563eb" letter-spacing="1">OPERATOR LAYER</text><rect x="110" y="222" width="520" height="95" rx="14" fill="#e0eaff" stroke="#2563eb" stroke-width="2.5"/><text x="370.0" y="263.2" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Web UI shell</text><text x="370.0" y="294.05199999999996" text-anchor="middle" font-size="18" fill="#5c677d">role-scoped operator consoles in the browser</text><rect x="670" y="222" width="520" height="95" rx="14" fill="#e0eaff" stroke="#2563eb" stroke-width="2.5"/><text x="930.0" y="263.2" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Node UI fragments</text><text x="930.0" y="294.05199999999996" text-anchor="middle" font-size="18" fill="#5c677d">each node ships its own UI, loaded at runtime</text><rect x="1230" y="222" width="580" height="95" rx="14" fill="#e0eaff" stroke="#2563eb" stroke-width="2.5"/><text x="1520.0" y="263.2" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Panels &amp; hardware control</text><text x="1520.0" y="294.05199999999996" text-anchor="middle" font-size="18" fill="#5c677d">touch consoles, control surfaces via gateways</text><rect x="70" y="350" width="1780" height="260" rx="18" fill="#d5f5f0" fill-opacity="0.45" stroke="#0d9488" stroke-width="2" stroke-dasharray="3 0"/><text x="92" y="384" font-size="23" font-weight="700" fill="#0d9488" letter-spacing="1">CONTROL PLANE (HA, NO MEDIA PASSES THROUGH HERE)</text><rect x="110" y="400" width="360" height="170" rx="14" fill="#d5f5f0" stroke="#0d9488" stroke-width="2.5"/><text x="290.0" y="452.1" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">Orchestrator core</text><text x="290.0" y="485.53" text-anchor="middle" font-size="20" fill="#5c677d">registry · connections ·</text><text x="290.0" y="511.53" text-anchor="middle" font-size="20" fill="#5c677d">lifecycle · placement ·</text><text x="290.0" y="537.53" text-anchor="middle" font-size="20" fill="#5c677d">workflows</text><rect x="510" y="400" width="300" height="170" rx="14" fill="#d5f5f0" stroke="#0d9488" stroke-width="2.5"/><text x="660.0" y="467.0" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Control framework</text><text x="660.0" y="497.852" text-anchor="middle" font-size="18" fill="#5c677d">NMOS IS-12/14: nodes</text><text x="660.0" y="521.252" text-anchor="middle" font-size="18" fill="#5c677d">self-describe parameters</text><rect x="850" y="400" width="300" height="170" rx="14" fill="#d5f5f0" stroke="#0d9488" stroke-width="2.5"/><text x="1000.0" y="467.0" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Event bus</text><text x="1000.0" y="497.852" text-anchor="middle" font-size="18" fill="#5c677d">tally · alarms · state</text><text x="1000.0" y="521.252" text-anchor="middle" font-size="18" fill="#5c677d">changes (durable streams)</text><rect x="1190" y="400" width="300" height="170" rx="14" fill="#d5f5f0" stroke="#0d9488" stroke-width="2.5"/><text x="1340.0" y="455.29999999999995" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">Clustering</text><text x="1340.0" y="486.15199999999993" text-anchor="middle" font-size="18" fill="#5c677d">consensus between</text><text x="1340.0" y="509.5519999999999" text-anchor="middle" font-size="18" fill="#5c677d">orchestrators, replicated</text><text x="1340.0" y="532.9519999999999" text-anchor="middle" font-size="18" fill="#5c677d">database</text><rect x="1530" y="400" width="280" height="170" rx="14" fill="#d5f5f0" stroke="#0d9488" stroke-width="2.5"/><text x="1670.0" y="467.0" text-anchor="middle" font-size="24" font-weight="700" fill="#14213d">AuthN / AuthZ</text><text x="1670.0" y="497.852" text-anchor="middle" font-size="18" fill="#5c677d">NMOS IS-10 · roles ·</text><text x="1670.0" y="521.252" text-anchor="middle" font-size="18" fill="#5c677d">audit</text><rect x="70" y="630" width="1780" height="200" rx="18" fill="#fdecc8" fill-opacity="0.45" stroke="#d97706" stroke-width="2" stroke-dasharray="3 0"/><text x="92" y="664" font-size="23" font-weight="700" fill="#d97706" letter-spacing="1">MEDIA FUNCTIONS (NODES)</text><rect x="110" y="680" width="265" height="115" rx="14" fill="#fdecc8" stroke="#d97706" stroke-width="2.5"/><text x="242.5" y="731.5" text-anchor="middle" font-size="23" font-weight="700" fill="#14213d">Players</text><text x="242.5" y="761.0630000000001" text-anchor="middle" font-size="17" fill="#5c677d">playout, clips</text><rect x="392" y="680" width="265" height="115" rx="14" fill="#fdecc8" stroke="#d97706" stroke-width="2.5"/><text x="524.5" y="731.5" text-anchor="middle" font-size="23" font-weight="700" fill="#14213d">Audio mixer</text><text x="524.5" y="761.0630000000001" text-anchor="middle" font-size="17" fill="#5c677d">dynamic channels</text><rect x="674" y="680" width="265" height="115" rx="14" fill="#fdecc8" stroke="#d97706" stroke-width="2.5"/><text x="806.5" y="731.5" text-anchor="middle" font-size="23" font-weight="700" fill="#14213d">Video mixer</text><text x="806.5" y="761.0630000000001" text-anchor="middle" font-size="17" fill="#5c677d">M/E banks</text><rect x="956" y="680" width="265" height="115" rx="14" fill="#fdecc8" stroke="#d97706" stroke-width="2.5"/><text x="1088.5" y="731.5" text-anchor="middle" font-size="23" font-weight="700" fill="#14213d">Graphics</text><text x="1088.5" y="761.0630000000001" text-anchor="middle" font-size="17" fill="#5c677d">OGraf engine</text><rect x="1238" y="680" width="265" height="115" rx="14" fill="#fdecc8" stroke="#d97706" stroke-width="2.5"/><text x="1370.5" y="731.5" text-anchor="middle" font-size="23" font-weight="700" fill="#14213d">Gateways</text><text x="1370.5" y="761.0630000000001" text-anchor="middle" font-size="17" fill="#5c677d">SRT / RIST / ST 2110</text><rect x="1520" y="680" width="265" height="115" rx="14" fill="#ece4ff" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="10 7"/><text x="1652.5" y="731.5" text-anchor="middle" font-size="23" font-weight="700" fill="#14213d">3rd-party nodes</text><text x="1652.5" y="761.0630000000001" text-anchor="middle" font-size="17" fill="#5c677d">same contract</text><rect x="70" y="850" width="1780" height="170" rx="18" fill="#ece4ff" fill-opacity="0.45" stroke="#7c3aed" stroke-width="2" stroke-dasharray="3 0"/><text x="92" y="884" font-size="23" font-weight="700" fill="#7c3aed" letter-spacing="1">MEDIA EXCHANGE (THE ONLY PLACE PICTURES AND SOUND TRAVEL)</text><rect x="110" y="895" width="520" height="95" rx="14" fill="#ece4ff" stroke="#7c3aed" stroke-width="2.5"/><text x="370.0" y="922.6" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">MXL · same host</text><text x="370.0" y="956.03" text-anchor="middle" font-size="20" fill="#5c677d">zero-copy shared memory, no NIC, no</text><text x="370.0" y="982.03" text-anchor="middle" font-size="20" fill="#5c677d">encoding</text><rect x="700" y="895" width="520" height="95" rx="14" fill="#ece4ff" stroke="#7c3aed" stroke-width="2.5"/><text x="960.0" y="935.6" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">SMPTE ST 2110 / 2022-7 · LAN</text><text x="960.0" y="969.03" text-anchor="middle" font-size="20" fill="#5c677d">uncompressed over IP, PTP time (ST 2059)</text><rect x="1290" y="895" width="520" height="95" rx="14" fill="#ece4ff" stroke="#7c3aed" stroke-width="2.5"/><text x="1550.0" y="922.6" text-anchor="middle" font-size="26" font-weight="700" fill="#14213d">SRT / RIST · WAN &amp; cloud</text><text x="1550.0" y="956.03" text-anchor="middle" font-size="20" fill="#5c677d">gateway node bridges 2110 inside the</text><text x="1550.0" y="982.03" text-anchor="middle" font-size="20" fill="#5c677d">facility</text><line x1="960" y1="310" x2="960" y2="400" stroke="#2563eb" stroke-width="3.5" marker-end="url(#a_blue)" marker-start="url(#as_blue)"/><line x1="960" y1="570" x2="960" y2="680" stroke="#0d9488" stroke-width="3.5" stroke-dasharray="11 8" marker-end="url(#a_teal)" marker-start="url(#as_teal)"/><text x="985" y="368" text-anchor="start" font-size="20" font-weight="700" fill="#2563eb">REST / SSE</text><text x="985" y="640" text-anchor="start" font-size="20" font-weight="700" fill="#0d9488">IS-04/05/12/14, commands</text><line x1="1550" y1="795" x2="1550" y2="895" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#a_violet)" marker-start="url(#as_violet)"/><text x="1850" y="1064" text-anchor="end" font-size="17" fill="#5c677d">OpenMediaPlatform · open architecture based on EBU DMF, MXL, NMOS, SMPTE ST 2110</text></svg>