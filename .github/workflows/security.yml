name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          check-latest: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          rc=0
          for m in orchestrator nodes/mock tools/contract-check tools/nmos-conformance-check tools/update-bundle host-agent supervisor update nodeoptions jobwire podmanrun; do
            echo "== $m"
            (cd "$m" && govulncheck ./...) || rc=1
          done
          exit $rc

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Prueft nur nodes/Cargo.lock gegen die RustSec-Datenbank, braucht
      # keinen Build (und damit kein third_party/mxl).
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cd nodes && cargo audit

  # HAERTUNG-PLAN.md 98.2: Lizenzen, Quellen und Verbote (nodes/deny.toml) bisher nur lokal in `make check`. cargo deny braucht die
  # Paketstruktur (cargo metadata) und damit die Pfad-Abhängigkeit third_party/mxl (nicht gebaut, nur der feste Commit als Quelltext).
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: MXL-Quelltext (fester Commit)
        run: |
          MXL_VERSION="$(sed -n 's/^MXL_VERSION="\(.*\)"/\1/p' deploy/dev/install-mxl.sh | head -1)"
          MXL_COMMIT="$(sed -n 's/^MXL_COMMIT="\(.*\)"/\1/p' deploy/dev/install-mxl.sh | head -1)"
          git clone --depth 1 --branch "$MXL_VERSION" https://github.com/dmf-mxl/mxl third_party/mxl
          [ "$(git -C third_party/mxl rev-parse HEAD)" = "$MXL_COMMIT" ] || { echo "MXL-Tag $MXL_VERSION zeigt nicht mehr auf $MXL_COMMIT" >&2; exit 1; }

      - name: cargo deny
        run: |
          cargo install cargo-deny --locked
          cd nodes && cargo deny check
