name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          rc=0
          for m in orchestrator nodes/mock tools/contract-check tools/nmos-conformance-check tools/update-bundle host-agent supervisor update nodeoptions jobwire; do
            echo "== $m"
            (cd "$m" && govulncheck ./...) || rc=1
          done
          exit $rc

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Prueft nur nodes/Cargo.lock gegen die RustSec-Datenbank, braucht
      # keinen Build (und damit kein third_party/mxl).
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cd nodes && cargo audit
