name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: "1.26"
          check-latest: true

      # Rust ist bewusst nicht dabei: der Workspace haengt an
      # third_party/mxl (lokal gebaut, auf dem Runner nicht vorhanden,
      # siehe ci.yml). Rust-Abhaengigkeiten deckt security.yml (cargo audit) ab.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}

      # Mehrere Go-Module ohne go.work: jedes einzeln bauen.
      - name: Go-Module bauen
        if: matrix.language == 'go'
        run: |
          for m in orchestrator nodes/mock tools/contract-check tools/nmos-conformance-check tools/update-bundle host-agent supervisor update nodeoptions; do
            (cd "$m" && go build ./...)
          done

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
