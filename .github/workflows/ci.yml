name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Audit 2026-10-23: ohne Datenbank übersprangen sich die DB-Tests (u. a. Anmeldung/Token, Hosts, Workflows) still. dbtest legt je
    # Testpaket eine eigene Datenbank an, die Dienst-Datenbank selbst bleibt unberührt.
    services:
      postgres:
        image: docker.io/library/postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
        env:
          POSTGRES_USER: omp
          POSTGRES_PASSWORD: omp
          POSTGRES_DB: omp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          check-latest: true

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # Kein Rust-Toolchain-Setup hier (Nutzerentscheidung 2026-07-27,
      # docs/decisions.md): der Rust-Workspace (nodes/) hängt über
      # omp-mediaio an third_party/mxl (PATH-Dependency, gitignored,
      # lokal per install-mxl.sh gebaut) — ein GitHub-Actions-Runner hat
      # das nicht, `cargo`-Aufrufe scheiterten hier bereits beim
      # Manifest-Laden (root-caused 2026-07-27, seit dem MXL-Vendoring/
      # C4 nie funktioniert). Rust/MXL-Code bleibt Pflicht zur echten
      # lokalen Live-Verifikation vor jedem Commit (`make check`, s.
      # Historie in docs/decisions.md) statt Teil dieses Gates.
      - name: make check-ci
        env:
          OMP_POSTGRES_URL: postgres://omp:omp@localhost:5432/omp?sslmode=disable
        run: make check-ci

  # Audit 2026-10-23 "Rust (~97k Zeilen, 746 Tests) in keiner CI": der Rust-Workspace braucht MXL (third_party/mxl, gitignored) — hier wird
  # der feste Tag samt unseren Patches geholt (wie deploy/dev/install-mxl.sh), die C-Bibliothek selbst aber nicht gebaut
  # (Feature mxl-not-built). Zunächst nicht blockierend (continue-on-error), bis der Lauf auf dem Runner nachweislich stabil ist.
  rust:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Systempakete (GStreamer, Bindgen, OpenSSL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libclang-dev libssl-dev libglib2.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            libopus-dev libasound2-dev

      - name: MXL holen (fester Tag + OMP-Patches)
        run: |
          MXL_VERSION="$(sed -n 's/^MXL_VERSION="\(.*\)"/\1/p' deploy/dev/install-mxl.sh | head -1)"
          git clone --depth 1 --branch "$MXL_VERSION" https://github.com/dmf-mxl/mxl third_party/mxl
          for p in deploy/dev/mxl-patches/*.diff; do git -C third_party/mxl apply "$PWD/$p"; done

      - name: Rust-Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            nodes/target
          key: rust-${{ runner.os }}-${{ hashFiles('nodes/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: cargo test (Workspace)
        working-directory: nodes
        # Der Debug-Zeittest des Intercom-Mixers hängt von der Rechnerlast ab und gehört in ein Release-Profil.
        # Zwei Tests brauchen mehr als der Runner hat: der Intercom-Zeittest (Debug-Profil, lastabhängig) und die echte Fabrics-Übertragung (libfabric/MXL-Bibliothek).
        run: cargo test --workspace --no-fail-fast -- --skip hundred_parties_twenty_channels --skip transfers_a_real_grain_between_two_domains_over_tcp

  # Schritt D2 (UMSETZUNG.md): AMWA NMOS Testing Tool gegen unsere
  # nmos-cpp-Registry (IS-04-02, Registration+Query API). NICHT gegen
  # eigene Nodes für IS-04-01 — verifiziert am echten Tool-Lauf
  # (docs/decisions.md 2026-07-13): unsere Nodes implementieren bewusst
  # kein eigenständiges IS-04-"Node API" (Registration-API-Push statt
  # Peer-to-Peer-Discovery, ARCHITECTURE.md §3/§5), die Suite bricht
  # deshalb sofort mit 0 Tests ab — kein sinnvolles CI-Gate, dauerhaft
  # akzeptiert (keine architektonische Lücke, sondern eine bewusste
  # Design-Entscheidung).
  #
  # IS-05-01 (Connection API) lief bis Schritt D9 aus demselben Grund
  # nicht mit — der fehlenden Basis-Discovery-Endpunkte wegen (nur
  # staged/active pro Receiver, Schritt B1). Seit D9 (UMSETZUNG.md,
  # docs/decisions.md) hat der Mock-Node die vollständigen IS-05-01-
  # Basis-Discovery-Pfade — läuft jetzt echt gegen ihn, mit einer
  # explizit begründeten Ausnahmeliste unten (analog zu IS-04-02s
  # test_01/test_02/test_27).
  amwa-nmos-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          check-latest: true

      # docker run --network host erreicht Container, die mit expliziten
      # Port-Mappings gestartet wurden, über localhost — gleiches Muster
      # wie der lokale Podman-Dev-Fallback in `make up`, hier mit docker
      # (auf GitHub-Actions-Runnern vorinstalliert, kein Podman nötig).
      - name: NMOS-Registry starten
        run: |
          docker run -d --name omp-nmos-registry \
            -p 8010:8010 -p 8011:8011 \
            -v "$PWD/deploy/nmos/registry.json":/home/registry.json:ro \
            -e RUN_NODE=FALSE \
            docker.io/rhastie/nmos-cpp:master-b6c8367@sha256:68e61e17dffab70303cfc10fcf4f5f8f219ae84eb189961e120e86a126959413
          for i in $(seq 1 20); do
            curl -fs http://localhost:8010/x-nmos/query/v1.3/ > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fs http://localhost:8010/x-nmos/query/v1.3/ > /dev/null

      # Entrypoint des offiziellen Images startet immer den interaktiven
      # Web-Server (run_nmos_testing.sh ruft `python3 nmos-test.py` ohne
      # Argumente, ignoriert jedes CMD) — für den nicht-interaktiven
      # CLI-Modus muss der Entrypoint überschrieben werden (verifiziert
      # am echten Image, docs/decisions.md 2026-07-13).
      # nmos-test.py selbst liefert einen Exit-Code ungleich 0, sobald
      # IRGENDEIN Test im Suite-Lauf nicht "PASS" ist — auch für die drei
      # bewusst akzeptierten, dauerhaften Abweichungen (test_01/test_02/
      # test_27, s. u.). Ohne das "|| true" bricht `bash -e` (GH-Actions-
      # Default-Shell für Run-Steps) den gesamten Job an dieser Stelle ab,
      # BEVOR der eigentliche Auswertungsschritt unten (mit seiner
      # `--allow`-Ausnahmeliste) überhaupt startet — genau das war der
      # tatsächliche Grund, warum dieser Job seit A9 nie grün war
      # (root-caused 2026-07-27, nicht die zuvor vermuteten "Unable to
      # update repository"-Meldungen direkt darüber, die sind selbst
      # unschädlich/vom Tool abgefangen). Die echte Auswertung passiert
      # bewusst NICHT hier, sondern im nächsten Schritt.
      - name: AMWA NMOS Testing Tool — IS-04-02 (Registry APIs) ausführen
        run: |
          mkdir -p nmos-results
          docker run --rm --network host \
            -v "$PWD/nmos-results":/tmp/results \
            --entrypoint python3 \
            docker.io/amwa/nmos-testing:latest@sha256:1a75a923f5afc632252aa9173295ad534194a1a13b6323cfc39bf4c5f295f8b4 \
            nmos-test.py suite IS-04-02 \
              --host localhost localhost --port 8010 8010 --version v1.3 v1.3 \
              --selection all --output /tmp/results/is0402.json || true

      # Definierte Testliste (UMSETZUNG.md D2): alle IS-04-02-Tests außer
      # den drei unten dokumentierten, bewusst akzeptierten Abweichungen
      # müssen grün sein. Kein Ergebnis stillschweigend ignoriert — jede
      # Ausnahme ist einzeln begründet und am echten Tool-Lauf verifiziert.
      - name: "Ergebnisse auswerten (IS-04-02: definierte Testliste grün, Abweichungen dokumentiert)"
        run: |
          cd tools/nmos-conformance-check
          go run . --results ../../nmos-results/is0402.json \
            --allow "test_01=mDNS-Advertisement bewusst nicht implementiert — OMP-Nodes/die Registry verbinden über eine feste OMP_REGISTRY_URL statt Zero-Config-Discovery (gleiche Design-Entscheidung wie ARCHITECTURE.md §18.2 für Host-Discovery)" \
            --allow "test_02=mDNS-Advertisement bewusst nicht implementiert, s. test_01" \
            --allow "test_27=registration_expiry_interval bewusst auf 60s statt der vom AMWA-Tool angenommenen 12s (GARBAGE_COLLECTION_TIMEOUT) gesetzt — deploy/nmos/registry.json, am echten Tool-Lauf mit 12s gegenverifiziert (docs/decisions.md 2026-07-13)"

      # Schritt D9 (UMSETZUNG.md): der Mock-Node selbst als IS-05-01-
      # Testziel — kein Registry-Umweg nötig, IS-05 läuft node-zu-node
      # (orchestrator/internal/is05/client.go-Doc). `-senders 1` seit
      # Nachtrag 193 (vorher `-senders 0`, s. u.): echte Sender-seitige
      # IS-05-Connection-API (nodes/mock/internal/connection/sender.go),
      # damit `auto_connection_1/2/3/4/5/6/13` einen echten,
      # IS-04-registrierten Sender zum Verbinden vorfinden.
      - name: Mock-Node für IS-05-01 starten
        run: |
          cd nodes/mock
          go build -o /tmp/omp-mock .
          OMP_REGISTRY_URL="http://localhost:8010" OMP_NATS_URL="nats://localhost:4222" \
            /tmp/omp-mock -senders 1 -receivers 2 -port 9099 &
          for i in $(seq 1 20); do
            curl -fs http://localhost:9099/x-nmos/connection/v1.1/ > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fs http://localhost:9099/x-nmos/connection/v1.1/ > /dev/null
          curl -fs http://localhost:9099/x-nmos/connection/v1.2/ > /dev/null
          curl -fs http://localhost:9099/x-nmos/connection/ > /dev/null

      - name: AMWA NMOS Testing Tool — IS-05-01 (Connection API) gegen den Mock-Node ausführen
        run: |
          docker run --rm --network host \
            -v "$PWD/nmos-results":/tmp/results \
            --entrypoint python3 \
            docker.io/amwa/nmos-testing:latest@sha256:1a75a923f5afc632252aa9173295ad534194a1a13b6323cfc39bf4c5f295f8b4 \
            nmos-test.py suite IS-05-01 \
              --host localhost --port 9099 --version v1.1 \
              --selection all --output /tmp/results/is0501.json || true

      # Definierte Testliste (UMSETZUNG.md D11, docs/decisions.md
      # Nachtrag 145): am echten Tool-Lauf verifiziert (nicht geraten).
      # D9 hatte hier noch 19 Ausnahmen in vier Ursachen-Gruppen — D11
      # hat drei davon vollständig geschlossen (`transport_params`-
      # Feldtiefe + echtes PATCH-Merge, `activation_time`-Lebenszyklus
      # inkl. echter zeitgesteuerter Aktivierung, echte Bulk-POST-
      # Semantik) und dabei zwei zusätzliche, erst dadurch sichtbar
      # gewordene reale Bugs gefunden+behoben ("auto"-Platzhalter
      # blieben unaufgelöst in /active; `activate_scheduled_absolute`
      # interpretierte `requested_time` als Unix- statt echter TAI-Zeit,
      # ~37s Schaltsekunden-Versatz). Die letzte Ursachen-Gruppe
      # (auto_connection_1/2/3/4/5/6/13, fehlender Sender) ist seit
      # Nachtrag 193 durch die neue Sender-Fixture geschlossen — KEINE
      # Ausnahmen mehr in dieser Liste. Ungetestet gegen das echte
      # AMWA-Tool (hier ohne Docker entwickelt, s. docs/decisions.md
      # Nachtrag 193) — falls dieser Lauf hier neue, echte Abweichungen
      # findet, gehören die (wie bei D9/D11) einzeln hierhin, nicht
      # stillschweigend mit `|| true` verschluckt.
      - name: "Ergebnisse auswerten (IS-05-01: definierte Testliste grün, Abweichungen dokumentiert)"
        run: |
          cd tools/nmos-conformance-check
          go run . --results ../../nmos-results/is0501.json

      # Nachtrag 189: AMWA-TV/is-05 Release v1.2.0 (Aug. 2024) ist
      # wire-kompatibel zu v1.1.x (einzige inhaltliche Änderung: weitere
      # Transport-Typen ab v1.2 über das NMOS-"Transports"-Parameter-
      # Register statt fest in der Spec — für uns ohne Wirkung, da wir
      # nur RTP + das proprietäre `urn:x-omp:transport:mxl` kennen). Der
      # bereits laufende Mock-Node bedient seither `/x-nmos/connection/
      # v1.2/` mit denselben Handlern wie v1.1 (kein Neustart nötig),
      # daher hier derselbe Testlauf nur mit `--version v1.2` — seit
      # Nachtrag 193 ebenfalls ohne Ausnahmeliste (s. oben).
      - name: AMWA NMOS Testing Tool — IS-05-01 (Connection API) gegen v1.2 des Mock-Node ausführen
        run: |
          docker run --rm --network host \
            -v "$PWD/nmos-results":/tmp/results \
            --entrypoint python3 \
            docker.io/amwa/nmos-testing:latest@sha256:1a75a923f5afc632252aa9173295ad534194a1a13b6323cfc39bf4c5f295f8b4 \
            nmos-test.py suite IS-05-01 \
              --host localhost --port 9099 --version v1.2 \
              --selection all --output /tmp/results/is0501-v12.json || true

      - name: "Ergebnisse auswerten (IS-05-01 v1.2: definierte Testliste grün, Abweichungen dokumentiert)"
        run: |
          cd tools/nmos-conformance-check
          go run . --results ../../nmos-results/is0501-v12.json

      - name: Ergebnisse als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: amwa-nmos-testing-results
          path: nmos-results/
