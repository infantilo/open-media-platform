[package]
name = "omp-node-sdk"
version = "0.1.0"
edition = "2024"
# Projektlizenz noch nicht entschieden (docs/decisions.md, Schritt C1) —
# publish=false verhindert ein versehentliches crates.io-Publish vor dieser
# Entscheidung und lässt cargo-deny dieses Crate von der Lizenzprüfung
# ausnehmen ([licenses.private] ignore=true in deny.toml).
publish = false

[dependencies]
async-nats = "0.52.0"
# Nur fürs `Stream`-Trait (`Subscriber::next()`, `subscribe_tally`,
# UMSETZUNG.md C11) — bereits transitive Abhängigkeit von async-nats/tokio
# (siehe Cargo.lock), hier nur explizit gemacht statt neu eingeführt;
# kein eigener NATS-Client (gleiche Ausnahme wie async-nats selbst,
# docs/decisions.md Schritt A6).
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
getrandom = "0.4.3"
# Nur für `libc::kill(self, SIGINT)` im SIGTERM-Handler (`node.rs`,
# docs/decisions.md Nachtrag 153) — bereits transitive Abhängigkeit von
# tokio selbst auf Unix (siehe Cargo.lock), hier nur explizit gemacht.
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Kein `ssl-rustls` mehr: tiny_http 0.12 hängt dort an rustls 0.20 / ring 0.16 (nicht mehr gepflegt). Das TLS des optionalen
# HTTPS-Listeners übernimmt `tlsproxy.rs` mit rustls 0.23 (siehe dort).
tiny_http = "0.12.0"
tokio = { version = "1.52.3", features = ["rt", "time", "macros", "signal", "net", "io-util", "sync"] }
# rustls 0.23 mit dem Provider `ring` (kein aws-lc-rs/cmake); bereits im Baum über async-nats.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
ureq = { version = "3.3.0", features = ["json"] }
