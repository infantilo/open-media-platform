<!DOCTYPE html>
<!--
  wpesrc-Host-Seite (K5-Teil-1, docs/END-GOAL-FEATURES.md §5.3
  "lokale statische HTML-Seite ... die Templates per import() lädt und
  die OGraf-Lifecycle-Methoden aufruft"). Vom Node per `wpesrc`s
  `run-javascript`-Action gesteuert (pipeline.rs) — window.omp ist die
  einzige Schnittstelle, absichtlich minimal (Teil 1: genau ein
  Template-Slot je Ebene).
-->
<html>
<head>
<meta charset="utf-8">
<style>
  /* transparent, damit der Alpha-Kanal (K5-Teil-0, pixelgenau verifiziert
     per wpesrc draw-background=false) tatsächlich leer statt schwarz ist. */
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
</style>
</head>
<body>
<script type="module">
  // K5-Teil-0-Formfund (docs/decisions.md 2026-07-15): `main` ist ein
  // default-exportierter Klassen-Konstruktor (extends HTMLElement), noch
  // NICHT als Custom Element registriert — das muss diese Host-Seite
  // selbst tun (`new` auf einer unregistrierten HTMLElement-Unterklasse
  // wirft sonst "Illegal constructor").
  // Mehrere gleichzeitige Grafik-Ebenen (Nutzerwunsch 2026-10-01): jede
  // Ebene hat eine ID und ein eigenes Template-Element, alle liegen
  // übereinander in DIESER einen Seite — wpesrc rendert die Komposition
  // als Fill+Key. Der Schritt (continue) wird vom Node geführt und als
  // Zielschritt übergeben (Einzige Quelle der Wahrheit, kein Auseinander-
  // laufen mit einem hier mitgezählten Wert).
  window.omp = {
    layers: new Map(), // layerId -> { el, templateId }

    async show(layerId, templateId, dir, main, data) {
      try {
        let layer = this.layers.get(layerId);
        if (layer && layer.templateId !== templateId) {
          await this.hide(layerId);
          layer = null;
        }
        if (!layer) {
          const mod = await import(`/ograf-templates/${dir}/${main}`);
          const TemplateClass = mod.default;
          const tag = "ograf-tpl-" + templateId.toLowerCase().replace(/[^a-z0-9-]/g, "-");
          if (!customElements.get(tag)) {
            customElements.define(tag, TemplateClass);
          }
          const el = document.createElement(tag);
          document.body.appendChild(el);
          layer = { el, templateId };
          this.layers.set(layerId, layer);
          await el.load({ renderType: "realtime", data });
        } else if (layer.el.updateAction) {
          await layer.el.updateAction({ data });
        }
        await layer.el.playAction({});
      } catch (e) {
        console.error("omp.show failed:", e);
      }
    },

    // Live-Änderung der Daten einer sichtbaren Ebene.
    async update(layerId, data) {
      const layer = this.layers.get(layerId);
      if (!layer) return;
      try {
        if (layer.el.updateAction) await layer.el.updateAction({ data });
      } catch (e) {
        console.error("omp.update failed:", e);
      }
    },

    // Nächster Schritt einer mehrstufigen Ebene: continueAction() des
    // Elements, falls vorhanden, sonst playAction({ goto: <Zielschritt> }).
    async continue(layerId, step) {
      const layer = this.layers.get(layerId);
      if (!layer) return;
      try {
        if (layer.el.continueAction) await layer.el.continueAction({});
        else await layer.el.playAction({ goto: step });
      } catch (e) {
        console.error("omp.continue failed:", e);
      }
    },

    // Eine Ebene ausblenden; ohne ID alle.
    async hide(layerId) {
      if (layerId === undefined || layerId === null) {
        for (const id of [...this.layers.keys()]) await this.hide(id);
        return;
      }
      const layer = this.layers.get(layerId);
      if (!layer) return;
      try {
        await layer.el.stopAction({});
        if (layer.el.dispose) await layer.el.dispose();
      } catch (e) {
        console.error("omp.hide failed:", e);
      } finally {
        layer.el.remove();
        this.layers.delete(layerId);
      }
    },
  };

  // Markiert für pipeline.rs' Bereitschafts-Sonde (page_ready), dass das
  // Modul-Skript fertig ausgeführt ist — per Pad-Probe auf dem ersten
  // wpesrc-Puffer beobachtet der Node ohnehin nur, dass IRGENDein Frame
  // gerendert wurde, dieses Flag ist die zusätzliche, explizite
  // Bestätigung "window.omp existiert" (rein informativ, aktuell von
  // keinem Rust-Code gelesen — document.title als einfachster,
  // per `run-javascript`-Rückfrage nicht nötiger Kanal für spätere
  // manuelle Diagnose per CDP).
  document.title = "omp-ograf-harness-ready";
</script>
</body>
</html>
