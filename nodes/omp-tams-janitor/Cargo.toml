[package]
name = "omp-tams-janitor"
version = "0.1.0"
edition = "2024"
# Kapitel 105.6 (Aufbewahrung als Dauerläufer, AppNote 0019). publish=false wie bei den übrigen Node-Crates.
publish = false

[lib]
name = "omp_tams_janitor"
path = "src/lib.rs"

[[bin]]
name = "omp-tams-janitor"
path = "src/main.rs"

[dependencies]
omp-node-sdk = { version = "0.1.0", path = "../omp-node-sdk" }
omp-tams = { version = "0.1.0", path = "../omp-tams" }
omp-mediaio = { version = "0.1.0", path = "../omp-mediaio" }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt", "macros", "signal", "sync"] }

[dev-dependencies]
omp-tams = { version = "0.1.0", path = "../omp-tams", features = ["testserver"] }
