[package]
name = "omp-midi-gateway"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
libc = "0.2"
omp-node-sdk = { version = "0.1.0", path = "../omp-node-sdk" }
omp-playout-core = { version = "0.1.0", path = "../omp-playout-core" }
serde_json = "1.0.150"
# ureq: Live-Strom (SSE) des Mischers lesen; dieselbe Version wie omp-node-sdk/omp-playout-core, keine neue Abhängigkeit im Baum.
ureq = { version = "3.3.0", features = ["json"] }
tokio = { version = "1.52.3", features = ["rt", "macros", "signal", "sync"] }
