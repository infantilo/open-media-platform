[package]
name = "omp-sign-avatar"
version = "0.1.0"
edition = "2024"
# Projektlizenz noch nicht entschieden (docs/decisions.md) — wie die übrigen Nodes nicht veröffentlicht.
publish = false

# Rasterizer, Avatar und Wiedergabe sind reines Rust ohne Fremdabhängigkeiten
# (Lizenzlage, docs/GEBAERDENSPRACHE.md §5); GStreamer/MXL nur im Ausgabe-Rahmen.
[dependencies]
gstreamer = "0.25.3"
gstreamer-app = "0.25.2"
omp-mediaio = { version = "0.1.0", path = "../omp-mediaio", features = ["mxl"] }
omp-node-sdk = { version = "0.1.0", path = "../omp-node-sdk" }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt", "macros", "signal", "sync", "time"] }
