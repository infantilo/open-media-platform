<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#080c16">
<title>Intercom</title>
<style>
:root{--bg:#080c16;--panel:#0f1522;--raised:#172033;--ink:#eaf0fa;--mute:#93a1ba;--line:#223049;--accent:#19d3f3;--talk:#e53935;--ok:#43a047;--warn:#fb8c00;
--hi:#565d66;--m-light:#3d434b;--m-mid:#2b2f34;--m-dark:#1a1c1f;--glow:0 0 8px 1px rgba(229,57,53,.65);--font:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
img,a{-webkit-user-drag:none}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.3 var(--font);touch-action:manipulation}
body{padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);max-width:980px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:8px 0;position:sticky;top:0;background:var(--bg);z-index:3}
header h1{font-size:14px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.dot.on{background:var(--ok)}.dot.bad{background:var(--talk)}.dot.speak{background:var(--ok);box-shadow:0 0 0 3px rgba(67,160,71,.35)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button:disabled{opacity:.4;cursor:default}
.key,.hb,.mini{border:1px solid #000;border-top-color:var(--hi);background:linear-gradient(180deg,var(--m-light),var(--m-mid) 55%,var(--m-dark));box-shadow:0 2px 0 #000,0 3px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);transition:transform .04s,box-shadow .04s,background .08s}
.key:active:not(:disabled),.hb:active:not(:disabled),.mini:active:not(:disabled),.key[aria-pressed=true],.hb[aria-pressed=true],.mini[aria-pressed=true]{transform:translateY(2px);box-shadow:0 0 0 #000,inset 0 2px 5px rgba(0,0,0,.6)}
.key{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:1px;width:100%;min-height:52px;padding:6px 8px 6px 13px;border-radius:7px;text-align:left;font-weight:600;font-size:14px;line-height:1.15}
.key::before{content:'';position:absolute;left:5px;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--cc,var(--line))}
.key .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.key .wh{font-size:11px;font-weight:500;color:var(--mute);min-height:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.key .wh b{color:#6bdc72}
.key.simple{flex-direction:row;align-items:center;gap:8px;min-height:52px}
.key.simple span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.key[aria-pressed=true]{background:linear-gradient(180deg,#a82622,#e53935 60%,#a42521);color:#fff;box-shadow:var(--glow),inset 0 2px 4px rgba(0,0,0,.35)}
.key[aria-pressed=true] .wh{color:#ffd9d7}
.hb{border-radius:6px;padding:0 10px;height:28px;font-size:12px;font-weight:600}
.hb[aria-pressed=true]{background:linear-gradient(180deg,#a82622,#e53935 60%,#a42521);color:#fff;box-shadow:var(--glow),inset 0 2px 4px rgba(0,0,0,.35)}
#dnd[aria-pressed=true]{background:linear-gradient(180deg,#b86300,#fb8c00 60%,#b86300);box-shadow:0 0 8px 1px rgba(251,140,0,.6),inset 0 2px 4px rgba(0,0,0,.35)}
.mini{width:26px;height:24px;border-radius:5px;font-size:11px;font-weight:700;color:var(--mute)}
.mini.listen[aria-pressed=true]{background:linear-gradient(180deg,#2f7d32,#43a047 60%,#2f7d32);color:#fff;box-shadow:0 0 6px 1px rgba(67,160,71,.55),inset 0 2px 4px rgba(0,0,0,.35)}
.mini.solo[aria-pressed=true]{background:linear-gradient(180deg,#b86300,#fb8c00 60%,#b86300);color:#fff;box-shadow:0 0 6px 1px rgba(251,140,0,.55),inset 0 2px 4px rgba(0,0,0,.35)}
.meter{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:0 0 8px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#a45cff);transition:width .08s}
#banner{display:none;margin:0 0 8px;padding:6px 10px;border-radius:6px;background:var(--warn);color:#000;font-weight:600}
#banner.show{display:block}
#start{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:20px 0;color:var(--mute)}
#start button{background:linear-gradient(90deg,var(--accent),#a45cff);color:#06101a;border-radius:7px;padding:10px 20px;font-size:15px;font-weight:700;touch-action:manipulation}
#err{color:#ef5350}
nav#pages{display:flex;gap:6px;margin:0 0 8px;overflow-x:auto}
nav#pages button{flex:none;padding:0 12px}
nav#pages button[aria-pressed=true]{transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px 8px;align-items:start}
.unit{display:flex;flex-direction:column;gap:5px;padding:5px;border-radius:9px;background:var(--panel);border:1px solid var(--line)}
.unit[data-speaking=true]{border-color:#43a047;box-shadow:0 0 0 1px rgba(67,160,71,.4)}
.unit.ring{animation:ring .5s 6}
@keyframes ring{50%{background:rgba(251,140,0,.35)}}
.ctl{display:flex;align-items:center;gap:4px}
.ctl .sp{flex:1}
.knob{display:flex;flex-direction:column;align-items:center;width:34px;cursor:ns-resize;touch-action:none;user-select:none;-webkit-user-select:none}
.knob svg{width:30px;height:30px;display:block}
.knob .trk{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round}
.knob .val{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.knob .body{fill:url(#kg);stroke:#000;stroke-width:1}
.knob .ptr{stroke:#fff;stroke-width:2;stroke-linecap:round}
.knob span{font-size:9px;line-height:1;color:var(--mute);margin-top:1px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.knob.drag span{color:var(--accent)}
.hint{color:var(--mute);font-size:11px;margin:12px 0}
/* Eingebettet (z. B. in der Handy-Kamera-Seite, ?embed=1): kompakter, ohne Tastenhinweis */
html.embed body{padding:0 4px;max-width:none}
html.embed header{padding:4px 0}
html.embed #start{padding:8px 0;gap:8px}
html.embed .hint{display:none}
html.embed .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px 6px}
</style>
</head>
<body>
<header>
  <span class="dot" id="conn" title=""></span>
  <h1 id="me">Intercom</h1>
  <button id="latch" class="hb" aria-pressed="false" hidden></button>
  <button id="dnd" class="hb" aria-pressed="false" hidden></button>
  <button id="mute" class="hb" aria-pressed="false" hidden></button>
</header>
<div id="banner" role="status"></div>
<div id="start">
  <div id="intro"></div>
  <button id="go"></button>
  <div id="err" role="alert"></div>
</div>
<main id="app" hidden>
  <div class="meter" aria-hidden="true"><i id="mic"></i></div>
  <nav id="pages" aria-label="Seiten"></nav>
  <section id="chans"></section>
  <p class="hint" id="hint"></p>
</main>
<audio id="out" autoplay playsinline></audio>
<script>
(() => {
  const L = (navigator.language || 'de').startsWith('de') ? 'de' : 'en';
  const T = {
    de: {intro:'Mikrofon und Kopfhörer bereithalten.', go:'Verbinden', mute:'Mikrofon', dnd:'Nicht stören', busy:'ist nicht erreichbar (Nicht stören)', reply:'Antworten', muted:'Mikrofon stumm', talk:'Sprechen', hold:'Halten = sprechen (loslassen beendet)', latch:'Rasten', latchTitle:'Rasten: Tippen schaltet das Sprechen ein und beim nächsten Tippen aus. Aus (Standard): nur sprechen, solange gedrückt.', listen:'Hören', level:'Pegel', pan:'Lage', solo:'Solo', people:'Teilnehmer', call:'Rufen', all:'Alle rufen', hint:'Tasten 1–9: Kanal sprechen (halten) · M: Mikrofon stumm', offline:'offline', forced:'Mikrofon gesperrt', onair:'ON AIR', ring:'Ruf von', reconnect:'Verbindung verloren – verbinde neu …', noaudio:'Kein Mikrofonzugriff', badtoken:'Zugang ungültig oder abgelaufen', secure:'Mikrofon braucht HTTPS oder localhost.', speaking:'spricht'},
    en: {intro:'Have your microphone and headphones ready.', go:'Connect', mute:'Microphone', dnd:'Do not disturb', busy:'is not available (do not disturb)', reply:'Reply', muted:'Microphone muted', talk:'Talk', hold:'Hold = talk (release ends it)', latch:'Latch', latchTitle:'Latch: a tap turns talking on, the next tap off. Off (default): talk only while pressed.', listen:'Listen', level:'Level', pan:'Pan', solo:'Solo', people:'Parties', call:'Call', all:'Call all', hint:'Keys 1–9: talk on channel (hold) · M: mute microphone', offline:'offline', forced:'Microphone locked', onair:'ON AIR', ring:'Call from', reconnect:'Connection lost – reconnecting …', noaudio:'No microphone access', badtoken:'Access invalid or expired', secure:'The microphone needs HTTPS or localhost.', speaking:'speaking'}
  }[L];
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const token = q.get('token') || '';
  document.documentElement.lang = L;
  if (q.get('embed')) document.documentElement.classList.add('embed');
  $('intro').textContent = T.intro; $('go').textContent = T.go; $('mute').textContent = T.mute; $('dnd').textContent = T.dnd; $('latch').textContent = T.latch; $('latch').title = T.latchTitle;
  $('hint').textContent = T.hint;

  let pc = null, dc = null, stream = null, state = null, closing = false, retry = 0, pingTimer = 0, lastRing = null;
  const latched = new Set();     // per Tippen eingerastete Kanäle
  const callOn = new Set();       // laufende Rufe (Teilnehmer-IDs)
  const send = o => { if (dc && dc.readyState === 'open') dc.send(JSON.stringify(o)); };
  window.__ic = { get state() { return state; }, get pc() { return pc; }, send };

  function banner(text) { const b = $('banner'); b.textContent = text || ''; b.classList.toggle('show', !!text); }

  async function connect() {
    if (pc) { try { pc.close(); } catch (e) {} }
    pc = new RTCPeerConnection({ iceServers: [] });
    dc = pc.createDataChannel('ctl');
    dc.onmessage = ev => { try { onMsg(JSON.parse(ev.data)); } catch (e) {} };
    dc.onopen = () => { banner(''); retry = 0; };
    clearInterval(pingTimer); pingTimer = setInterval(() => send({ t: 'ping' }), 2000);
    pc.ontrack = ev => { $('out').srcObject = ev.streams[0] || new MediaStream([ev.track]); $('out').play().catch(() => {}); };
    pc.onconnectionstatechange = () => {
      const s = pc.connectionState;
      $('conn').className = 'dot ' + (s === 'connected' ? 'on' : (s === 'failed' || s === 'closed' ? 'bad' : ''));
      $('conn').title = s;
      if ((s === 'failed' || s === 'disconnected' || s === 'closed') && !closing) {
        banner(T.reconnect);
        setTimeout(() => { if (!closing && pc && pc.connectionState !== 'connected') connect().catch(() => {}); }, Math.min(5000, 800 * ++retry));
      }
    };
    stream.getAudioTracks().forEach(t => pc.addTrack(t, stream));
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise(res => {
      if (pc.iceGatheringState === 'complete') return res();
      const t = setTimeout(res, 3000);
      pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); } });
    });
    const r = await fetch('offer?token=' + encodeURIComponent(token), { method: 'POST', headers: { 'content-type': 'application/sdp' }, body: pc.localDescription.sdp });
    if (r.status === 401) { closing = true; throw new Error(T.badtoken); }
    if (!r.ok) throw new Error(await r.text());
    await pc.setRemoteDescription({ type: 'answer', sdp: await r.text() });
  }

  $('go').onclick = async () => {
    $('err').textContent = '';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('err').textContent = T.secure; return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: false } });
    } catch (e) { $('err').textContent = T.noaudio + ': ' + e.message; return; }
    try { await connect(); } catch (e) { $('err').textContent = e.message; return; }
    $('start').hidden = true; $('app').hidden = false; $('mute').hidden = false; $('dnd').hidden = false; $('latch').hidden = false;
  };

  $('mute').onclick = () => { if (state && !state.me.forced) send({ t: 'mute', on: !state.me.muted }); };
  $('dnd').onclick = () => { if (state) send({ t: 'dnd', on: !state.me.dnd }); };

  let beepCtx = null;
  function beep() {
    try { beepCtx = beepCtx || new AudioContext(); const o = beepCtx.createOscillator(), g = beepCtx.createGain();
      o.frequency.value = 880; g.gain.value = 0.12; o.connect(g); g.connect(beepCtx.destination); o.start(); o.stop(beepCtx.currentTime + 0.25); } catch (e) {}
  }
  function onMsg(m) {
    if (m.t === 'state') { state = m; render(); }
    else if (m.t === 'busy') { banner(m.name + ' ' + T.busy); setTimeout(() => banner(''), 3000); }
    else if (m.t === 'ring') { beep(); if (navigator.vibrate) navigator.vibrate([200, 100, 200]); lastRing = m; banner(T.ring + ' ' + m.name); setTimeout(() => banner(''), 4000);
      document.querySelectorAll('.unit.call').forEach(e => { e.classList.remove('ring'); void e.offsetWidth; e.classList.add('ring'); }); }
  }

  const nameOf = id => (state.parties.find(p => p.id === id) || {}).name || '?';
  const esc = t => String(t).replace(/</g, '&lt;');

  // Sprechen nur, solange gedrückt ist (Standard). „Rasten“ (Kopfzeile) schaltet auf Tippen = an/aus um.
  let latchMode = false;
  try { latchMode = localStorage.getItem('ic-latch') === '1'; } catch (e) {}
  const releasers = new Set(); // alles, was gerade gehalten wird — wird bei Fokusverlust/Kontextmenü losgelassen
  const releaseAll = () => { [...releasers].forEach(f => f()); };
  function talkButton(chId, el) {
    let down = 0;
    const set = on => send({ t: 'talk', ch: chId, on });
    const release = () => { if (!down) return; const dur = performance.now() - down; down = 0; releasers.delete(abort); if (latchMode && dur < 250) latched.add(chId); else set(false); };
    const abort = () => { if (!down) return; down = 0; releasers.delete(release); set(false); };
    el.addEventListener('pointerdown', ev => {
      ev.preventDefault(); el.setPointerCapture(ev.pointerId);
      if (latched.has(chId)) { latched.delete(chId); set(false); down = 0; return; }
      down = performance.now(); releasers.add(abort); set(true);
    });
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', abort);
    el.addEventListener('lostpointercapture', abort);
  }

  // Halten-Taste (Rufen): drückt = an, loslassen = aus.
  function holdButton(el, start, stop) {
    let held = false;
    const end = () => { if (!held) return; held = false; releasers.delete(end); stop(); };
    el.addEventListener('pointerdown', ev => { ev.preventDefault(); el.setPointerCapture(ev.pointerId); held = true; releasers.add(end); start(); });
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end); el.addEventListener('lostpointercapture', end);
  }

  // ---- Layout: Seiten mit Tasten. Ohne Layout: alle Kanäle als Karten, danach Rufen/Alle ----
  let pageIdx = 0;
  const defaultLayout = () => {
    const keys = [];
    if (state.me.force) keys.push({ type: 'all' });
    for (const c of state.channels.filter(c => c.kind !== 'call')) keys.push({ type: 'channel', ch: c.id, style: 'strip' });
    keys.push({ type: 'reply' });
    for (const p of state.parties) if (p.id !== state.me.id) keys.push({ type: 'call', party: p.id });
    return { pages: [{ name: '', keys }] };
  };
  const layoutOf = () => (state.layout && state.layout.pages && state.layout.pages.length ? state.layout : defaultLayout());
  // Eingehende Rufe zeigt jedes Layout oben, auch wenn der Kanal nicht darin vorkommt.
  const callChannels = () => state.channels.filter(c => c.kind === 'call');
  const chanById = id => state.channels.find(c => c.id === id);
  const currentKeys = () => {
    const lay = layoutOf(); pageIdx = Math.min(pageIdx, lay.pages.length - 1);
    return lay.pages[pageIdx].keys;
  };
  // Kanäle der aktuellen Seite in Reihenfolge (für Ziffern 1–9)
  const pageChannels = () => [...callChannels(), ...currentKeys().filter(k => k.type === 'channel' && chanById(k.ch)).map(k => chanById(k.ch))];

  let sig = '', cells = [];
  const hintFor = id => { const i = pageChannels().findIndex(c => c.id === id); return i >= 0 && i < 9 ? ' [' + (i + 1) + ']' : ''; };

  // Drehregler: senkrecht ziehen, Mausrad, Doppelklick = Grundstellung. `center` = Anzeige-Bogen ab Mitte (Lage).
  const KNOB_DEFS = '<svg width="0" height="0" style="position:absolute"><defs><radialGradient id="kg" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#565d66"/><stop offset="1" stop-color="#1a1c1f"/></radialGradient></defs></svg>';
  document.body.insertAdjacentHTML('afterbegin', KNOB_DEFS);
  const pt = (a, r) => (16 + r * Math.sin(a * Math.PI / 180)).toFixed(2) + ' ' + (16 - r * Math.cos(a * Math.PI / 180)).toFixed(2);
  const arc = (a0, a1) => a1 - a0 < 0.5 ? '' : 'M' + pt(a0, 13) + ' A13 13 0 ' + (a1 - a0 > 180 ? 1 : 0) + ' 1 ' + pt(a1, 13);
  function makeKnob(label, min, max, def, center, fmt, onInput) {
    const el = document.createElement('div'); el.className = 'knob'; el.title = label;
    el.innerHTML = '<svg viewBox="0 0 32 32"><path class="trk" d="' + arc(-135, 135) + '"/><path class="val"/><circle class="body" cx="16" cy="16" r="9"/><line class="ptr" x1="16" y1="16" x2="16" y2="9"/></svg><span></span>';
    const val = el.querySelector('.val'), ptr = el.querySelector('.ptr'), cap = el.querySelector('span');
    let v = def, dragging = false;
    const ang = x => -135 + (x - min) / (max - min) * 270;
    const paint = () => {
      const a = ang(v); ptr.setAttribute('transform', 'rotate(' + a + ' 16 16)');
      const a0 = center ? ang(def) : -135; val.setAttribute('d', arc(Math.min(a0, a), Math.max(a0, a)));
      cap.textContent = dragging ? fmt(v) : label;
    };
    const set = x => { x = Math.max(min, Math.min(max, Math.round(x))); if (x !== v) { v = x; paint(); onInput(v); } };
    let y0 = 0, v0 = 0;
    el.addEventListener('pointerdown', ev => { ev.preventDefault(); el.setPointerCapture(ev.pointerId); dragging = true; y0 = ev.clientY; v0 = v; el.classList.add('drag'); paint(); });
    el.addEventListener('pointermove', ev => { if (dragging) set(v0 + (y0 - ev.clientY) * (max - min) / 140); });
    const end = () => { dragging = false; el.classList.remove('drag'); paint(); };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    el.addEventListener('dblclick', () => set(def));
    el.addEventListener('wheel', ev => { ev.preventDefault(); set(v + (ev.deltaY < 0 ? 1 : -1) * (max - min) / 40); }, { passive: false });
    paint();
    return { el, get dragging() { return dragging; }, put(x) { if (!dragging && x !== v) { v = x; paint(); } } };
  }
  const fmtLevel = v => v <= 0 ? '−∞ dB' : (20 * Math.log10(v / 100)).toFixed(0) + ' dB';
  const fmtPan = v => v === 0 ? 'C' : (v < 0 ? 'L ' : 'R ') + Math.abs(v);

  // Eine Taste mit dem Namen des Sprechziels; darunter Hören/Solo und die Regler für Pegel und Lage.
  function makeChannel(c, knobs) {
    const rootEl = document.createElement('div'); rootEl.className = 'unit' + (c.kind === 'call' ? ' call' : '');
    rootEl.innerHTML = '<button class="key talk"><span class="nm"></span><span class="wh"></span></button><div class="ctl"><button class="mini listen"></button>' + (knobs ? '<button class="mini solo"></button><span class="sp"></span>' : '') + '</div>';
    const e = { name: rootEl.querySelector('.nm'), who: rootEl.querySelector('.wh'), talk: rootEl.querySelector('.talk'), listen: rootEl.querySelector('.listen'), solo: rootEl.querySelector('.solo'), ctl: rootEl.querySelector('.ctl') };
    e.listen.textContent = T.listen.charAt(0).toUpperCase(); e.listen.title = T.listen;
    let lvl = null, pan = null;
    if (knobs) {
      e.solo.textContent = T.solo.charAt(0).toUpperCase(); e.solo.title = T.solo;
      e.solo.onclick = () => send({ t: 'solo', ch: c.id, on: !chanById(c.id).solo });
      lvl = makeKnob(T.level, 0, 150, 100, false, fmtLevel, v => send({ t: 'level', ch: c.id, v: v / 100 }));
      pan = makeKnob(T.pan, -100, 100, 0, true, fmtPan, v => send({ t: 'pan', ch: c.id, v: v / 100 }));
      e.ctl.append(lvl.el, pan.el);
    }
    e.listen.onclick = () => send({ t: 'listen', ch: c.id, on: !chanById(c.id).listen_on });
    talkButton(c.id, e.talk);
    return { el: rootEl, update(label) {
      const me = state.me, cc = chanById(c.id); if (!cc) return;
      rootEl.style.setProperty('--cc', cc.color || 'var(--accent)');
      e.name.textContent = (label || cc.name) + hintFor(cc.id);
      e.listen.setAttribute('aria-pressed', String(cc.listen_on)); e.ctl.hidden = !cc.listen;
      const sp = cc.speakers.filter(id => id !== me.id).map(nameOf);
      rootEl.dataset.speaking = String(sp.length > 0);
      e.who.innerHTML = sp.length ? '<b>' + sp.map(esc).join(', ') + '</b> ' + T.speaking : '&nbsp;';
      e.talk.title = T.hold; e.talk.disabled = !cc.talk_allowed || me.forced; e.talk.setAttribute('aria-pressed', String(cc.talk));
      if (knobs) { e.solo.setAttribute('aria-pressed', String(cc.solo)); lvl.put(Math.round(cc.level * 100)); pan.put(Math.round(cc.pan * 100)); }
    } };
  }
  function makeSimple(onUpdate, wire) {
    const b = document.createElement('button'); b.className = 'key simple'; b.innerHTML = '<span class="dot"></span><span></span>';
    wire(b);
    return { el: b, update(label) { onUpdate(b, b.lastChild, b.firstChild, label); } };
  }
  function makeCell(k) {
    const me = () => state.me;
    switch (k.type) {
      case 'channel': {
        const c = chanById(k.ch); if (!c) return null;
        return { cell: makeChannel(c, k.style !== 'key'), label: k.label };
      }
      case 'call': {
        if (!state.parties.some(p => p.id === k.party)) return null;
        return { label: k.label, cell: makeSimple((b, t, d, label) => {
          const p = state.parties.find(x => x.id === k.party); if (!p) return;
          b.disabled = !p.online || me().forced; b.setAttribute('aria-pressed', String(callOn.has(k.party)));
          d.className = 'dot ' + (p.speaking ? 'speak' : (p.online ? 'on' : '')); t.textContent = (label || p.name) + (p.dnd ? ' ⊘' : ''); b.title = T.call;
        }, b => holdButton(b, () => { callOn.add(k.party); send({ t: 'call', to: [k.party], on: true }); }, () => { callOn.delete(k.party); send({ t: 'call', on: false }); })) };
      }
      case 'all':
        if (!me().force) return null;
        return { label: k.label, cell: makeSimple((b, t, d, label) => { b.disabled = !!me().forced; b.setAttribute('aria-pressed', String(callOn.has('all'))); d.className = 'dot on'; t.textContent = label || T.all; },
          b => holdButton(b, () => { callOn.add('all'); send({ t: 'call', to: 'all', on: true }); }, () => { callOn.delete('all'); send({ t: 'call', on: false }); })) };
      case 'reply':
        return { label: k.label, cell: makeSimple((b, t, d, label) => {
          const r = lastRing && state.parties.some(p => p.id === lastRing.from && p.online);
          b.hidden = !r; if (!r) return;
          b.disabled = !!me().forced; b.setAttribute('aria-pressed', String(callOn.has(lastRing.from))); d.className = 'dot on'; t.textContent = (label || T.reply) + ': ' + lastRing.name;
        }, b => holdButton(b, () => { if (lastRing) { callOn.add(lastRing.from); send({ t: 'call', to: [lastRing.from], on: true }); } }, () => { if (lastRing) callOn.delete(lastRing.from); send({ t: 'call', on: false }); })) };
      case 'mute':
        return { label: k.label, cell: makeSimple((b, t, d, label) => { b.disabled = !!me().forced; b.setAttribute('aria-pressed', String(me().muted || me().forced)); d.className = 'dot ' + (me().muted || me().forced ? 'bad' : 'on'); t.textContent = label || (me().forced ? T.forced : me().muted ? T.muted : T.mute); },
          b => { b.onclick = () => $('mute').click(); }) };
      case 'dnd':
        return { label: k.label, cell: makeSimple((b, t, d, label) => { b.setAttribute('aria-pressed', String(!!me().dnd)); d.className = 'dot ' + (me().dnd ? 'bad' : ''); t.textContent = label || T.dnd; },
          b => { b.onclick = () => $('dnd').click(); }) };
    }
    return null;
  }

  function rebuild() {
    const root = $('chans'); root.replaceChildren(); cells = []; latched.clear();
    const lay = layoutOf();
    const nav = $('pages'); nav.replaceChildren(); nav.hidden = lay.pages.length < 2;
    lay.pages.forEach((pg, i) => { const b = document.createElement('button'); b.className = 'hb'; b.textContent = pg.name || String(i + 1); b.setAttribute('aria-pressed', String(i === pageIdx));
      b.onclick = () => { pageIdx = i; sessionStorage.setItem('ic-page', String(i)); sig = ''; render(); }; nav.append(b); });
    // Eingehende Rufe ganz oben, danach die Tasten der Seite — alles in einem Raster.
    const grid = document.createElement('div'); grid.className = 'grid'; root.append(grid);
    for (const c of callChannels()) { const m = makeChannel(c, true); grid.append(m.el); cells.push({ cell: m, label: '' }); }
    for (const k of currentKeys()) {
      const m = makeCell(k); if (!m) continue;
      grid.append(m.cell.el); cells.push(m);
    }
  }

  function render() {
    const me = state.me;
    $('me').textContent = me.name + (me.on_air ? ' · ' + T.onair : '');
    const mb = $('mute'); mb.textContent = me.forced ? T.forced : (me.muted ? T.muted : T.mute);
    mb.setAttribute('aria-pressed', String(me.muted || me.forced)); mb.disabled = !!me.forced;
    $('dnd').setAttribute('aria-pressed', String(!!me.dnd));
    $('mic').style.width = Math.max(0, Math.min(100, (me.mic_db + 60) / 60 * 100)) + '%';
    if (!sig) pageIdx = Math.max(0, Number(sessionStorage.getItem('ic-page') || 0));
    // Neu aufbauen nur, wenn sich Aufbau ändert (Layout, Kanäle, Teilnehmer, Antwort-Taste) — nicht bei Pegeln/Zuständen.
    const s2 = JSON.stringify([state.layout, pageIdx, state.channels.map(c => c.id), state.parties.map(p => p.id), me.force, !!lastRing]);
    if (s2 !== sig) { sig = s2; rebuild(); }
    for (const c of cells) c.cell.update(c.label);
  }

  // Tastatur: 1–9 = Kanal sprechen (halten), M = Stumm
  const keysDown = new Set();
  addEventListener('keydown', ev => {
    if (!state || ev.repeat || ev.target.tagName === 'INPUT') return;
    if (ev.key === 'm' || ev.key === 'M') { $('mute').click(); return; }
    const n = parseInt(ev.key, 10);
    const pc2 = pageChannels(); if (n >= 1 && n <= 9 && pc2[n - 1] && !keysDown.has(n)) { keysDown.add(n); send({ t: 'talk', ch: pc2[n - 1].id, on: true }); }
  });
  addEventListener('keyup', ev => {
    const n = parseInt(ev.key, 10);
    if (keysDown.has(n)) { keysDown.delete(n); const pc2 = state ? pageChannels() : []; if (pc2[n - 1]) send({ t: 'talk', ch: pc2[n - 1].id, on: false }); }
  });
  addEventListener('pagehide', () => { closing = true; releaseAll(); });
  // Kein System-Menü beim langen Druck (Handy: Kontextmenü/Textauswahl), und nichts bleibt hängen, wenn die Seite den Fokus verliert.
  addEventListener('contextmenu', ev => { ev.preventDefault(); releaseAll(); });
  addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
  const paintLatch = () => { $('latch').setAttribute('aria-pressed', String(latchMode)); };
  $('latch').onclick = () => {
    latchMode = !latchMode; try { localStorage.setItem('ic-latch', latchMode ? '1' : '0'); } catch (e) {}
    if (!latchMode) { for (const id of [...latched]) { latched.delete(id); send({ t: 'talk', ch: id, on: false }); } }
    paintLatch();
  };
  paintLatch();
})();
</script>
</body>
</html>
