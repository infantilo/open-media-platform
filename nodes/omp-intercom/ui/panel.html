<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14171c">
<title>Intercom</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#16191d;--mute:#6a7380;--line:#d9dde3;--accent:#1f6feb;--talk:#d1242f;--ok:#1a7f37;--warn:#bf8700;--key:#e9ecf0}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--panel:#1d2128;--ink:#e8ebef;--mute:#8d97a5;--line:#2c323b;--accent:#4c8dff;--talk:#ff4d57;--ok:#3fb950;--warn:#d4a72c;--key:#272d36}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,sans-serif;touch-action:manipulation}
body{padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);max-width:720px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;padding:12px 0;position:sticky;top:0;background:var(--bg);z-index:3}
header h1{font-size:18px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mute);flex:none}
.dot.on{background:var(--ok)}.dot.bad{background:var(--talk)}.dot.speak{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 35%,transparent)}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--key);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.toggle[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
#mute[aria-pressed=true]{background:var(--talk);border-color:var(--talk);color:#fff}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .08s}
#banner{display:none;margin:0 0 12px;padding:10px 12px;border-radius:10px;background:var(--warn);color:#000}
#banner.show{display:block}
#start{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:24px 0}
#start button{background:var(--accent);color:#fff;border-color:var(--accent);padding:14px 22px;font-size:18px;touch-action:manipulation}
#err{color:var(--talk)}
.chan{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;border-left:6px solid var(--cc,var(--accent))}
.chan.ring{animation:ring .5s 6}
@keyframes ring{50%{background:color-mix(in srgb,var(--warn) 40%,var(--panel))}}
.chan .top{display:flex;align-items:center;gap:10px}
.chan .name{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.chan .who{color:var(--mute);font-size:14px;min-height:20px;margin:6px 0 8px}
.chan .who b{color:var(--ok)}
.talk{width:100%;min-height:64px;font-size:18px;font-weight:600}
.talk[aria-pressed=true]{background:var(--talk);border-color:var(--talk);color:#fff}
.talk[disabled]{opacity:.45}
.row{display:flex;gap:10px;align-items:center;margin-top:10px}
.row label{font-size:13px;color:var(--mute);width:56px;flex:none}
input[type=range]{flex:1;min-width:0;height:32px}
nav#pages{display:flex;gap:8px;margin:0 0 12px;overflow-x:auto}
nav#pages button{flex:none}
nav#pages button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.keygrid{align-items:start;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.ckey{display:flex;flex-direction:column;gap:4px;border-left:6px solid var(--cc,var(--accent));border-radius:10px;background:var(--panel);padding:6px}
.ckey .talk{min-height:72px;font-size:16px}
.ckey .sub{font-size:12px;color:var(--mute);min-height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ckey .sub b{color:var(--ok)}
.ckey .mini{min-height:32px;padding:4px 8px;font-size:12px}
.stripcol{margin-bottom:0}
h2{font-size:14px;color:var(--mute);margin:18px 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.person{display:flex;align-items:center;gap:8px;text-align:left;width:100%}
.person[aria-pressed=true]{background:var(--talk);border-color:var(--talk);color:#fff}
.person[disabled]{opacity:.45}
.hint{color:var(--mute);font-size:13px;margin:16px 0}
</style>
</head>
<body>
<header>
  <span class="dot" id="conn" title=""></span>
  <h1 id="me">Intercom</h1>
  <button id="dnd" class="toggle" aria-pressed="false" hidden></button>
  <button id="mute" class="toggle" aria-pressed="false" hidden></button>
</header>
<div id="banner" role="status"></div>
<div id="start">
  <div id="intro"></div>
  <button id="go"></button>
  <div id="err" role="alert"></div>
</div>
<main id="app" hidden>
  <div class="meter" aria-hidden="true"><i id="mic"></i></div>
  <nav id="pages" aria-label="Seiten"></nav>
  <section id="chans"></section>
  <p class="hint" id="hint"></p>
</main>
<audio id="out" autoplay playsinline></audio>
<script>
(() => {
  const L = (navigator.language || 'de').startsWith('de') ? 'de' : 'en';
  const T = {
    de: {intro:'Mikrofon und Kopfhörer bereithalten.', go:'Verbinden', mute:'Mikrofon', dnd:'Nicht stören', busy:'ist nicht erreichbar (Nicht stören)', reply:'Antworten', muted:'Mikrofon stumm', talk:'Sprechen', hold:'Halten = sprechen, Tippen = rasten', listen:'Hören', level:'Pegel', pan:'Lage', solo:'Solo', people:'Teilnehmer', call:'Rufen', all:'Alle rufen', hint:'Tasten 1–9: Kanal sprechen (halten) · M: Mikrofon stumm', offline:'offline', forced:'Mikrofon gesperrt', onair:'ON AIR', ring:'Ruf von', reconnect:'Verbindung verloren – verbinde neu …', noaudio:'Kein Mikrofonzugriff', badtoken:'Zugang ungültig oder abgelaufen', secure:'Mikrofon braucht HTTPS oder localhost.', speaking:'spricht'},
    en: {intro:'Have your microphone and headphones ready.', go:'Connect', mute:'Microphone', dnd:'Do not disturb', busy:'is not available (do not disturb)', reply:'Reply', muted:'Microphone muted', talk:'Talk', hold:'Hold = talk, tap = latch', listen:'Listen', level:'Level', pan:'Pan', solo:'Solo', people:'Parties', call:'Call', all:'Call all', hint:'Keys 1–9: talk on channel (hold) · M: mute microphone', offline:'offline', forced:'Microphone locked', onair:'ON AIR', ring:'Call from', reconnect:'Connection lost – reconnecting …', noaudio:'No microphone access', badtoken:'Access invalid or expired', secure:'The microphone needs HTTPS or localhost.', speaking:'speaking'}
  }[L];
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const token = q.get('token') || '';
  document.documentElement.lang = L;
  $('intro').textContent = T.intro; $('go').textContent = T.go; $('mute').textContent = T.mute; $('dnd').textContent = T.dnd;
  $('hint').textContent = T.hint;

  let pc = null, dc = null, stream = null, state = null, closing = false, retry = 0, pingTimer = 0, lastRing = null;
  const latched = new Set();     // per Tippen eingerastete Kanäle
  const callOn = new Set();       // laufende Rufe (Teilnehmer-IDs)
  const send = o => { if (dc && dc.readyState === 'open') dc.send(JSON.stringify(o)); };
  window.__ic = { get state() { return state; }, get pc() { return pc; }, send };

  function banner(text) { const b = $('banner'); b.textContent = text || ''; b.classList.toggle('show', !!text); }

  async function connect() {
    if (pc) { try { pc.close(); } catch (e) {} }
    pc = new RTCPeerConnection({ iceServers: [] });
    dc = pc.createDataChannel('ctl');
    dc.onmessage = ev => { try { onMsg(JSON.parse(ev.data)); } catch (e) {} };
    dc.onopen = () => { banner(''); retry = 0; };
    clearInterval(pingTimer); pingTimer = setInterval(() => send({ t: 'ping' }), 2000);
    pc.ontrack = ev => { $('out').srcObject = ev.streams[0] || new MediaStream([ev.track]); $('out').play().catch(() => {}); };
    pc.onconnectionstatechange = () => {
      const s = pc.connectionState;
      $('conn').className = 'dot ' + (s === 'connected' ? 'on' : (s === 'failed' || s === 'closed' ? 'bad' : ''));
      $('conn').title = s;
      if ((s === 'failed' || s === 'disconnected' || s === 'closed') && !closing) {
        banner(T.reconnect);
        setTimeout(() => { if (!closing && pc && pc.connectionState !== 'connected') connect().catch(() => {}); }, Math.min(5000, 800 * ++retry));
      }
    };
    stream.getAudioTracks().forEach(t => pc.addTrack(t, stream));
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise(res => {
      if (pc.iceGatheringState === 'complete') return res();
      const t = setTimeout(res, 3000);
      pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); } });
    });
    const r = await fetch('offer?token=' + encodeURIComponent(token), { method: 'POST', headers: { 'content-type': 'application/sdp' }, body: pc.localDescription.sdp });
    if (r.status === 401) { closing = true; throw new Error(T.badtoken); }
    if (!r.ok) throw new Error(await r.text());
    await pc.setRemoteDescription({ type: 'answer', sdp: await r.text() });
  }

  $('go').onclick = async () => {
    $('err').textContent = '';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('err').textContent = T.secure; return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: false } });
    } catch (e) { $('err').textContent = T.noaudio + ': ' + e.message; return; }
    try { await connect(); } catch (e) { $('err').textContent = e.message; return; }
    $('start').hidden = true; $('app').hidden = false; $('mute').hidden = false; $('dnd').hidden = false;
  };

  $('mute').onclick = () => { if (state && !state.me.forced) send({ t: 'mute', on: !state.me.muted }); };
  $('dnd').onclick = () => { if (state) send({ t: 'dnd', on: !state.me.dnd }); };

  let beepCtx = null;
  function beep() {
    try { beepCtx = beepCtx || new AudioContext(); const o = beepCtx.createOscillator(), g = beepCtx.createGain();
      o.frequency.value = 880; g.gain.value = 0.12; o.connect(g); g.connect(beepCtx.destination); o.start(); o.stop(beepCtx.currentTime + 0.25); } catch (e) {}
  }
  function onMsg(m) {
    if (m.t === 'state') { state = m; render(); }
    else if (m.t === 'busy') { banner(m.name + ' ' + T.busy); setTimeout(() => banner(''), 3000); }
    else if (m.t === 'ring') { beep(); if (navigator.vibrate) navigator.vibrate([200, 100, 200]); lastRing = m; banner(T.ring + ' ' + m.name); setTimeout(() => banner(''), 4000);
      document.querySelectorAll('.chan.call').forEach(e => { e.classList.remove('ring'); void e.offsetWidth; e.classList.add('ring'); }); }
  }

  const nameOf = id => (state.parties.find(p => p.id === id) || {}).name || '?';
  const esc = t => String(t).replace(/</g, '&lt;');

  function talkButton(chId, el) {
    let down = 0;
    const set = on => send({ t: 'talk', ch: chId, on });
    el.addEventListener('pointerdown', ev => {
      ev.preventDefault(); el.setPointerCapture(ev.pointerId);
      if (latched.has(chId)) { latched.delete(chId); set(false); down = 0; return; }
      down = performance.now(); set(true);
    });
    el.addEventListener('pointerup', () => {
      if (!down) return;
      if (performance.now() - down < 250) latched.add(chId); else set(false);
      down = 0;
    });
    el.addEventListener('pointercancel', () => { if (down) { down = 0; set(false); } });
  }

  // Halten-Taste (Rufen): drückt = an, loslassen = aus.
  function holdButton(el, start, stop) {
    let held = false;
    el.addEventListener('pointerdown', ev => { ev.preventDefault(); el.setPointerCapture(ev.pointerId); held = true; start(); });
    const end = () => { if (!held) return; held = false; stop(); };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  }

  // ---- Layout: Seiten mit Tasten. Ohne Layout: alle Kanäle als Karten, danach Rufen/Alle ----
  let pageIdx = 0;
  const defaultLayout = () => {
    const keys = [];
    if (state.me.force) keys.push({ type: 'all' });
    for (const c of state.channels.filter(c => c.kind !== 'call')) keys.push({ type: 'channel', ch: c.id, style: 'strip' });
    keys.push({ type: 'reply' });
    for (const p of state.parties) if (p.id !== state.me.id) keys.push({ type: 'call', party: p.id });
    return { pages: [{ name: '', keys }] };
  };
  const layoutOf = () => (state.layout && state.layout.pages && state.layout.pages.length ? state.layout : defaultLayout());
  // Eingehende Rufe zeigt jedes Layout oben, auch wenn der Kanal nicht darin vorkommt.
  const callChannels = () => state.channels.filter(c => c.kind === 'call');
  const chanById = id => state.channels.find(c => c.id === id);
  const currentKeys = () => {
    const lay = layoutOf(); pageIdx = Math.min(pageIdx, lay.pages.length - 1);
    return lay.pages[pageIdx].keys;
  };
  // Kanäle der aktuellen Seite in Reihenfolge (für Ziffern 1–9)
  const pageChannels = () => [...callChannels(), ...currentKeys().filter(k => k.type === 'channel' && chanById(k.ch)).map(k => chanById(k.ch))];

  let sig = '', cells = [];
  function makeStrip(c) {
    const rootEl = document.createElement('div'); rootEl.className = 'chan' + (c.kind === 'call' ? ' call' : '');
    rootEl.innerHTML = '<div class="top"><span class="name"></span><button class="toggle listen"></button><button class="toggle solo"></button></div><div class="who"></div>' +
      '<button class="talk"></button><div class="row lvl"><label></label><input type="range" min="0" max="150" step="1"></div><div class="row pan"><label></label><input type="range" min="-100" max="100" step="5"></div>';
    const e = { name: rootEl.querySelector('.name'), listen: rootEl.querySelector('.listen'), solo: rootEl.querySelector('.solo'), who: rootEl.querySelector('.who'),
      talk: rootEl.querySelector('.talk'), lvl: rootEl.querySelector('.lvl input'), pan: rootEl.querySelector('.pan input') };
    rootEl.querySelector('.lvl label').textContent = T.level; rootEl.querySelector('.pan label').textContent = T.pan;
    e.listen.textContent = T.listen; e.solo.textContent = T.solo;
    e.listen.onclick = () => send({ t: 'listen', ch: c.id, on: !chanById(c.id).listen_on });
    e.solo.onclick = () => send({ t: 'solo', ch: c.id, on: !chanById(c.id).solo });
    e.lvl.oninput = () => send({ t: 'level', ch: c.id, v: e.lvl.value / 100 });
    e.pan.oninput = () => send({ t: 'pan', ch: c.id, v: e.pan.value / 100 });
    talkButton(c.id, e.talk);
    return { el: rootEl, update(label) {
      const me = state.me, cc = chanById(c.id); if (!cc) return;
      rootEl.style.setProperty('--cc', cc.color || 'var(--accent)');
      e.name.textContent = (label || cc.name) + hintFor(cc.id);
      e.listen.setAttribute('aria-pressed', String(cc.listen_on)); e.listen.hidden = !cc.listen;
      e.solo.setAttribute('aria-pressed', String(cc.solo)); e.solo.hidden = !cc.listen;
      const sp = cc.speakers.filter(id => id !== me.id).map(nameOf);
      e.who.innerHTML = sp.length ? '<b>' + sp.map(esc).join(', ') + '</b> ' + T.speaking : '&nbsp;';
      e.talk.textContent = cc.talk_allowed ? T.talk + (cc.talk ? ' …' : '') : '—';
      e.talk.title = T.hold; e.talk.disabled = !cc.talk_allowed || me.forced; e.talk.setAttribute('aria-pressed', String(cc.talk));
      if (document.activeElement !== e.lvl) e.lvl.value = Math.round(cc.level * 100);
      if (document.activeElement !== e.pan) e.pan.value = Math.round(cc.pan * 100);
      rootEl.querySelector('.lvl').hidden = !cc.listen; rootEl.querySelector('.pan').hidden = !cc.listen;
    } };
  }
  const hintFor = id => { const i = pageChannels().findIndex(c => c.id === id); return i >= 0 && i < 9 ? ' [' + (i + 1) + ']' : ''; };
  function makeChannelKey(c) {
    const el = document.createElement('div'); el.className = 'ckey';
    el.innerHTML = '<button class="talk"></button><div class="sub"></div><button class="toggle mini"></button>';
    const talk = el.querySelector('.talk'), sub = el.querySelector('.sub'), listen = el.querySelector('.mini');
    listen.textContent = T.listen; listen.onclick = () => send({ t: 'listen', ch: c.id, on: !chanById(c.id).listen_on });
    talkButton(c.id, talk);
    return { el, update(label) {
      const me = state.me, cc = chanById(c.id); if (!cc) return;
      el.style.setProperty('--cc', cc.color || 'var(--accent)');
      talk.textContent = (label || cc.name) + hintFor(cc.id) + (cc.talk ? ' …' : '');
      talk.disabled = !cc.talk_allowed || me.forced; talk.setAttribute('aria-pressed', String(cc.talk)); talk.title = T.hold;
      const sp = cc.speakers.filter(id => id !== me.id).map(nameOf);
      sub.innerHTML = sp.length ? '<b>' + sp.map(esc).join(', ') + '</b>' : '&nbsp;';
      listen.hidden = !cc.listen; listen.setAttribute('aria-pressed', String(cc.listen_on));
    } };
  }
  function makeSimple(onUpdate, wire) {
    const b = document.createElement('button'); b.className = 'person'; b.innerHTML = '<span class="dot"></span><span></span>';
    wire(b);
    return { el: b, update(label) { onUpdate(b, b.lastChild, b.firstChild, label); } };
  }
  function makeCell(k) {
    const me = () => state.me;
    switch (k.type) {
      case 'channel': {
        const c = chanById(k.ch); if (!c) return null;
        return { cell: k.style === 'key' ? makeChannelKey(c) : makeStrip(c), strip: k.style !== 'key', label: k.label };
      }
      case 'call': {
        if (!state.parties.some(p => p.id === k.party)) return null;
        return { label: k.label, cell: makeSimple((b, t, d, label) => {
          const p = state.parties.find(x => x.id === k.party); if (!p) return;
          b.disabled = !p.online || me().forced; b.setAttribute('aria-pressed', String(callOn.has(k.party)));
          d.className = 'dot ' + (p.speaking ? 'speak' : (p.online ? 'on' : '')); t.textContent = (label || p.name) + (p.dnd ? ' ⊘' : ''); b.title = T.call;
        }, b => holdButton(b, () => { callOn.add(k.party); send({ t: 'call', to: [k.party], on: true }); }, () => { callOn.delete(k.party); send({ t: 'call', on: false }); })) };
      }
      case 'all':
        if (!me().force) return null;
        return { label: k.label, cell: makeSimple((b, t, d, label) => { b.disabled = !!me().forced; b.setAttribute('aria-pressed', String(callOn.has('all'))); d.className = 'dot on'; t.textContent = label || T.all; },
          b => holdButton(b, () => { callOn.add('all'); send({ t: 'call', to: 'all', on: true }); }, () => { callOn.delete('all'); send({ t: 'call', on: false }); })) };
      case 'reply':
        return { label: k.label, cell: makeSimple((b, t, d, label) => {
          const r = lastRing && state.parties.some(p => p.id === lastRing.from && p.online);
          b.hidden = !r; if (!r) return;
          b.disabled = !!me().forced; b.setAttribute('aria-pressed', String(callOn.has(lastRing.from))); d.className = 'dot on'; t.textContent = (label || T.reply) + ': ' + lastRing.name;
        }, b => holdButton(b, () => { if (lastRing) { callOn.add(lastRing.from); send({ t: 'call', to: [lastRing.from], on: true }); } }, () => { if (lastRing) callOn.delete(lastRing.from); send({ t: 'call', on: false }); })) };
      case 'mute':
        return { label: k.label, cell: makeSimple((b, t, d, label) => { b.disabled = !!me().forced; b.setAttribute('aria-pressed', String(me().muted || me().forced)); d.className = 'dot ' + (me().muted || me().forced ? 'bad' : 'on'); t.textContent = label || (me().forced ? T.forced : me().muted ? T.muted : T.mute); },
          b => { b.onclick = () => $('mute').click(); }) };
      case 'dnd':
        return { label: k.label, cell: makeSimple((b, t, d, label) => { b.setAttribute('aria-pressed', String(!!me().dnd)); d.className = 'dot ' + (me().dnd ? 'bad' : ''); t.textContent = label || T.dnd; },
          b => { b.onclick = () => $('dnd').click(); }) };
    }
    return null;
  }

  function rebuild() {
    const root = $('chans'); root.replaceChildren(); cells = []; latched.clear();
    const lay = layoutOf();
    const nav = $('pages'); nav.replaceChildren(); nav.hidden = lay.pages.length < 2;
    lay.pages.forEach((pg, i) => { const b = document.createElement('button'); b.textContent = pg.name || String(i + 1); b.setAttribute('aria-pressed', String(i === pageIdx));
      b.onclick = () => { pageIdx = i; sessionStorage.setItem('ic-page', String(i)); sig = ''; render(); }; nav.append(b); });
    // Eingehende Rufe ganz oben
    const calls = document.createElement('div'); root.append(calls);
    for (const c of callChannels()) { const m = makeStrip(c); calls.append(m.el); cells.push({ cell: m, label: '' }); }
    let grid = null, col = null;
    for (const k of currentKeys()) {
      const m = makeCell(k); if (!m) continue;
      if (m.strip) { grid = null; if (!col) { col = document.createElement('div'); col.className = 'stripcol'; root.append(col); } col.append(m.cell.el); }
      else { col = null; if (!grid) { grid = document.createElement('div'); grid.className = 'keygrid'; root.append(grid); } grid.append(m.cell.el); }
      cells.push(m);
    }
  }

  function render() {
    const me = state.me;
    $('me').textContent = me.name + (me.on_air ? ' · ' + T.onair : '');
    const mb = $('mute'); mb.textContent = me.forced ? T.forced : (me.muted ? T.muted : T.mute);
    mb.setAttribute('aria-pressed', String(me.muted || me.forced)); mb.disabled = !!me.forced;
    $('dnd').setAttribute('aria-pressed', String(!!me.dnd));
    $('mic').style.width = Math.max(0, Math.min(100, (me.mic_db + 60) / 60 * 100)) + '%';
    if (!sig) pageIdx = Math.max(0, Number(sessionStorage.getItem('ic-page') || 0));
    // Neu aufbauen nur, wenn sich Aufbau ändert (Layout, Kanäle, Teilnehmer, Antwort-Taste) — nicht bei Pegeln/Zuständen.
    const s2 = JSON.stringify([state.layout, pageIdx, state.channels.map(c => c.id), state.parties.map(p => p.id), me.force, !!lastRing]);
    if (s2 !== sig) { sig = s2; rebuild(); }
    for (const c of cells) c.cell.update(c.label);
  }

  // Tastatur: 1–9 = Kanal sprechen (halten), M = Stumm
  const keysDown = new Set();
  addEventListener('keydown', ev => {
    if (!state || ev.repeat || ev.target.tagName === 'INPUT') return;
    if (ev.key === 'm' || ev.key === 'M') { $('mute').click(); return; }
    const n = parseInt(ev.key, 10);
    const pc2 = pageChannels(); if (n >= 1 && n <= 9 && pc2[n - 1] && !keysDown.has(n)) { keysDown.add(n); send({ t: 'talk', ch: pc2[n - 1].id, on: true }); }
  });
  addEventListener('keyup', ev => {
    const n = parseInt(ev.key, 10);
    if (keysDown.has(n)) { keysDown.delete(n); const pc2 = state ? pageChannels() : []; if (pc2[n - 1]) send({ t: 'talk', ch: pc2[n - 1].id, on: false }); }
  });
  addEventListener('pagehide', () => { closing = true; });
})();
</script>
</body>
</html>
