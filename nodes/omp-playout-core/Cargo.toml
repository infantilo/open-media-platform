[package]
name = "omp-playout-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "Gemeinsamer, reiner Sendekern (Listen, Zeitachse, Fixzeit, Trigger, Bereitschaft) fuer TV- und Radio-Automation (Radio-Plan RB1)"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
