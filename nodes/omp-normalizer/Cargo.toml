[package]
name = "omp-normalizer"
version = "0.1.0"
edition = "2024"
# Projektlizenz noch nicht entschieden (docs/decisions.md, Schritt C1) —
# publish=false wie bei den übrigen Nodes.
publish = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
gstreamer = "0.25.3"
omp-mediaio = { version = "0.1.0", path = "../omp-mediaio", features = ["mxl"] }
omp-node-sdk = { version = "0.1.0", path = "../omp-node-sdk" }
tokio = { version = "1.52.3", features = ["rt", "macros", "signal", "sync"] }

[dev-dependencies]
# nur für die Live-Tests (Leser-Typen von MXL); gleiche Pfad-Einstellung wie in omp-mediaio
mxl = { path = "../../third_party/mxl/rust/mxl", features = ["mxl-not-built"] }
