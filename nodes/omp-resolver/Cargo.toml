[package]
name = "omp-resolver"
version = "0.1.0"
edition = "2024"
# Projektlizenz noch nicht entschieden (docs/decisions.md, Schritt C1).
publish = false

# Kapitel 27 / P4b (E6 = Rust-Crate im Workspace): reine Auswahllogik für
# Quellen ohne HTTP/Uhr/State — von Playout-Automation, Audio-/Video-Mixer und
# anderen Nodes gemeinsam nutzbar (Spec §254: keine fünf Implementierungen).
# Nur serde: die Quellen kommen als JSON von `GET /api/v1/sources`.
[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
