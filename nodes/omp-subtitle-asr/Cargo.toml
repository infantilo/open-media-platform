[package]
name = "omp-subtitle-asr"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gstreamer = "0.25.3"
gstreamer-app = "0.25"
omp-mediaio = { version = "0.1.0", path = "../omp-mediaio", features = ["mxl"] }
omp-node-sdk = { version = "0.1.0", path = "../omp-node-sdk" }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt", "macros", "signal", "sync"] }
ureq = { version = "3.3.0", features = ["json"] }
