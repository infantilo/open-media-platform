[package]
name = "omp-webrtc-gateway"
version = "0.1.0"
edition = "2024"
# Projektlizenz noch nicht entschieden (docs/decisions.md, Schritt C1) —
# publish=false wie bei omp-node-sdk.
publish = false

[dependencies]
gstreamer = "0.25.3"
# Beide brauchen die -dev-Pakete `libgstreamer-plugins-bad1.0-dev`
# (pkg-config gstreamer-webrtc-1.0/gstreamer-sdp-1.0), s. docs/decisions.md
# Nachtrag 241.
gstreamer-sdp = "0.25"
gstreamer-video = "0.25"
gstreamer-webrtc = "0.25"
omp-mediaio = { version = "0.1.0", path = "../omp-mediaio", features = ["mxl"] }
omp-node-sdk = { version = "0.1.0", path = "../omp-node-sdk" }
# Nutzerwunsch 2026-09-23 (Einladungslinks als QR-Code fürs Handy) —
# Minimal-Dependency-Regel (§0 Punkt 5): default-features=false lässt
# die `image`/`svg`-Renderer-Features weg (SVG wird selbst aus den
# rohen Modulen gebaut, s. invite.rs), dadurch NULL transitive
# Abhängigkeiten (`cargo tree` bestätigt).
qrcode = { version = "0.14.1", default-features = false }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt", "macros", "signal", "sync"] }
