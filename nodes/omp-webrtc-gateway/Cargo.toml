[package]
name = "omp-webrtc-gateway"
version = "0.1.0"
edition = "2024"
# Projektlizenz noch nicht entschieden (docs/decisions.md, Schritt C1) —
# publish=false wie bei omp-node-sdk.
publish = false

[dependencies]
gstreamer = "0.25.3"
# Beide brauchen die -dev-Pakete `libgstreamer-plugins-bad1.0-dev`
# (pkg-config gstreamer-webrtc-1.0/gstreamer-sdp-1.0), s. docs/decisions.md
# Nachtrag 241.
gstreamer-sdp = "0.25"
gstreamer-video = "0.25"
gstreamer-webrtc = "0.25"
omp-mediaio = { version = "0.1.0", path = "../omp-mediaio", features = ["mxl"] }
omp-node-sdk = { version = "0.1.0", path = "../omp-node-sdk" }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt", "macros", "signal", "sync"] }
