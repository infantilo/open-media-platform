<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>OMP Kamera</title>
<style>
  :root { color-scheme: dark; --bg:#121212; --surface:#1e1e1e; --text:#eaeaea; --dim:#9a9a9a;
          --ok:#4caf50; --err:#ef5350; --warn:#fb8c00; --accent:#4c8dff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:var(--bg);
         color:var(--text); font:16px/1.4 system-ui,sans-serif; max-width:640px; margin-inline:auto;
         display:flex; flex-direction:column; min-height:100%; }
  h1 { font-size:18px; margin:4px 0 12px; }
  select, button { font:inherit; padding:10px; border-radius:8px; border:1px solid #444; background:var(--surface);
                   color:var(--text); min-height:44px; }
  button { font-weight:600; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.stop { background:var(--err); border-color:var(--err); color:#fff; }
  button:disabled { opacity:.45; }
  .dim { color:var(--dim); }

  /* ---- Vor dem Verbinden / nach dem Trennen: NUR Konfiguration + großer Verbinden-Button ---- */
  #setup .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  #setup label { display:flex; flex-direction:column; gap:2px; font-size:13px; color:var(--dim); flex:1 1 130px; }
  #setup .check { flex-direction:row; align-items:center; gap:8px; color:var(--text); font-size:15px; flex:1 1 100%; }
  #setup .check input { width:22px; height:22px; }
  #setup #start { width:100%; margin-top:16px; font-size:17px; padding:16px; }
  /* Bugliste 2026-09-25 #2: gut sichtbarer, laienverständlicher Fehler-
     Hinweis direkt im Setup-Bildschirm (s. HTML-Kommentar bei #setupError). */
  .error-banner { margin-top:10px; padding:10px 12px; border-radius:8px; background:var(--err); color:#fff;
                  font-size:14px; font-weight:600; line-height:1.35; }

  /* ---- Nach dem Verbinden: Kachel-Ansicht (Kamera + Retourbild) ---- */
  #live { display:none; flex-direction:column; flex:1; min-height:0; }
  #live.active { display:flex; }
  #tiles { position:relative; flex:1; min-height:0; display:flex; gap:4px; background:#000; border-radius:8px; overflow:hidden; }
  #tiles.single { aspect-ratio:16/9; flex:none; }
  .tile { position:relative; background:#000; overflow:hidden; }
  .tile video { width:100%; height:100%; object-fit:contain; display:block; }
  #tiles:not(.single) .tile { flex:1 1 50%; aspect-ratio:auto; }
  /* Getippte Kachel groß, andere als PIP-Overlay unten rechts (aus dem Flex-Fluss genommen). */
  #tiles.cam-large .tile[data-role="cam"] { flex:1 1 100%; }
  #tiles.cam-large .tile[data-role="retour"],
  #tiles.retour-large .tile[data-role="cam"] {
    position:absolute; right:8px; bottom:8px; width:32%; aspect-ratio:16/9;
    border:2px solid #444; border-radius:6px; z-index:2; box-shadow:0 2px 8px #000a;
  }
  #tiles.retour-large .tile[data-role="retour"] { flex:1 1 100%; }
  .badge { position:absolute; top:8px; left:8px; padding:2px 10px; border-radius:12px; font-size:13px;
           font-weight:600; background:#000a; pointer-events:none; }
  .badge.live { color:#fff; background:var(--err); }
  .tile-label { position:absolute; bottom:6px; left:8px; font-size:11px; color:#fff; background:#000a;
                padding:1px 8px; border-radius:10px; pointer-events:none; }

  #live .row { display:flex; gap:8px; margin-top:10px; }
  #live .row > button { flex:1; }

  /* ---- Status/Log: eingeklappt, per kleinem Button erreichbar ---- */
  #statusPanel { display:none; margin-top:10px; }
  #statusPanel.open { display:block; }
  .stats { padding:10px 12px; background:var(--surface); border-radius:8px; font-size:14px; }
  .stats b { font-size:26px; font-variant-numeric:tabular-nums; }
  #log { margin-top:8px; font:12px ui-monospace,monospace; color:var(--dim); white-space:pre-wrap; max-height:8em; overflow:auto; }
</style>
</head>
<body>
<h1>OMP Kamera</h1>

<!-- Vor dem Verbinden / nach dem Trennen: nur Konfiguration, kein Videobild sichtbar (Nutzerauftrag 2026-09-24). -->
<div id="setup">
  <div class="row">
    <label>Kamera <select id="camera"></select></label>
    <label>Auflösung
      <select id="res">
        <option value="640x360">640×360</option>
        <option value="1280x720" selected>1280×720</option>
        <option value="1920x1080">1920×1080</option>
      </select>
    </label>
    <label>Bildrate
      <select id="fps"><option>25</option><option selected>30</option><option>50</option><option>60</option></select>
    </label>
  </div>
  <div class="row">
    <label class="check"><input type="checkbox" id="audio" checked> Ton senden</label>
    <label class="check"><input type="checkbox" id="measure"> Latenz messen (Zeitstempel im Bild)</label>
  </div>
  <button id="start" class="primary">Verbinden</button>
  <p class="dim" id="setupHint" style="font-size:13px;"></p>
  <!-- Bugliste 2026-09-25 #2 ("wenn beim verbinden ein Fehler auftritt,
       muss dieser gut sichtbar dargestellt werden"): vorher landete jeder
       Verbindungsfehler NUR im technischen, standardmäßig eingeklappten
       `#log` innerhalb von `#live` — einer Sektion, die bei einem
       fehlgeschlagenen Connect nie sichtbar wird (`#setup` bleibt aktiv).
       Diese Zeile sitzt direkt hier, wo der Nutzer nach einem
       fehlgeschlagenen Versuch tatsächlich steht. -->
  <p id="setupError" class="error-banner" hidden></p>
</div>

<!-- Nach dem Verbinden: Kamera + Retourbild halb/halb, Tap zum Vergrößern (Nutzerauftrag 2026-09-24). -->
<div id="live">
  <div id="tiles" class="single">
    <div class="tile" data-role="cam">
      <video id="preview" autoplay muted playsinline></video>
      <span id="camBadge" class="badge">Bereit</span>
      <span class="tile-label" id="camLabel" hidden>Kamera</span>
    </div>
    <div class="tile" data-role="retour" id="retourTile" hidden>
      <video id="retourVideo" autoplay playsinline></video>
      <span id="retourBadge" class="badge">–</span>
      <span class="tile-label">Retourbild</span>
    </div>
  </div>
  <div class="row">
    <button id="stop" class="stop">Verbindung trennen</button>
    <button id="toggleStatus">Status</button>
  </div>
  <div id="statusPanel">
    <div class="stats" id="stats">
      <div>Verbindung Kamera: <b id="conn" style="font-size:inherit">–</b></div>
      <div id="retourConnRow" hidden>Verbindung Retourbild: <b id="retourConn" style="font-size:inherit">–</b></div>
      <div id="latRow" hidden>Latenz Glas→Decoder: <b id="lat">–</b> ms
        <span class="dim">(Ø · max <span id="latMax">–</span> ms)</span></div>
      <div class="dim" id="clockInfo"></div>
    </div>
    <div id="log"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const log = (t) => { const l = $('log'); l.textContent = new Date().toLocaleTimeString() + ' ' + t + '\n' + l.textContent; };

// Bugliste 2026-09-25 #2: `showConnectError` ist die einzige Stelle, die
// bei einem fehlgeschlagenen Verbindungsversuch etwas SICHTBARES zeigt
// (`#setupError`, direkt im Setup-Bildschirm, wo der Nutzer nach einem
// Fehlschlag tatsächlich steht) — `log()` bleibt zusätzlich als
// technisches Detail im (weiterhin eingeklappten) `#log` erhalten, für
// Fehlersuche durch die Regie/den Bediener per Bildschirmteilen o. Ä.
const showConnectError = (friendlyMsg, technicalDetail) => {
  const el = $('setupError');
  el.textContent = friendlyMsg;
  el.hidden = false;
  log('FEHLER: ' + (technicalDetail || friendlyMsg));
};
const clearConnectError = () => { $('setupError').hidden = true; };

// Übersetzt technische Fehler (DOMException-Namen von `getUserMedia`,
// `WHIP <status>: …`/`WHEP <status>: …` aus `connect()`/`connectRetour()`)
// in einen für Laien verständlichen Satz — Rohtext bleibt trotzdem im
// `#log` erhalten (s. `showConnectError`), nichts geht verloren.
function friendlyConnectError(e) {
  const name = e && e.name;
  if (name === 'NotAllowedError' || name === 'SecurityError') {
    return 'Kein Zugriff auf Kamera/Mikrofon. Bitte in den Browser-Einstellungen erlauben und erneut versuchen.';
  }
  if (name === 'NotFoundError') {
    return 'Keine Kamera gefunden. Bitte prüfen, ob eine Kamera vorhanden/aktiviert ist.';
  }
  if (name === 'NotReadableError') {
    return 'Die Kamera wird bereits von einer anderen App verwendet. Bitte diese schließen und erneut versuchen.';
  }
  if (name === 'OverconstrainedError') {
    return 'Die gewählte Auflösung/Bildrate wird von dieser Kamera nicht unterstützt. Bitte eine andere Einstellung wählen.';
  }
  const msg = (e && (e.message || String(e))) || '';
  const statusMatch = /^(?:WHIP|WHEP) (\d+):/.exec(msg);
  if (statusMatch) {
    const status = Number(statusMatch[1]);
    if (status === 401) {
      return 'Diese Einladung ist ungültig oder wurde zurückgezogen. Bitte einen neuen Link/QR-Code vom Bediener/der Regie anfordern.';
    }
    return `Verbindung zum Server fehlgeschlagen (Code ${status}). Bitte erneut versuchen oder die Regie kontaktieren.`;
  }
  return 'Verbindung fehlgeschlagen. Bitte erneut versuchen oder die Regie kontaktieren.';
}

// Einladungs-Token (Nutzerwunsch 2026-09-23, "security!"): nur mit
// gültigem `?token=` aus einem Einladungslink nimmt der Node `/whip`
// überhaupt an (s. invite.rs) — ohne Token gar nicht erst versuchen,
// klare Fehlermeldung statt einer verwirrenden 401 nach Kamerastart.
const params = new URLSearchParams(location.search);
const inviteToken = params.get('token') || '';
const whipUrl = '/whip' + (inviteToken ? '?token=' + encodeURIComponent(inviteToken) : '');

// Retourbild-Paarung (Nutzerwunsch 2026-09-24): ein kombinierter
// Einladungslink trägt zusätzlich die Basis-URL + den Token der
// gepaarten Monitor-Node-Instanz (s. ui/bundle.js-Moduldoku) — fehlen
// sie, läuft diese Seite unverändert als reine Kamera ohne Retourbild
// (Rückwärtskompatibilität zu älteren, unpaarten Einladungslinks).
const monitorBase = (params.get('monitorBase') || '').trim().replace(/\/+$/, '');
const monitorToken = params.get('monitorToken') || '';
const hasRetour = !!(monitorBase && monitorToken);
const whepUrl = hasRetour ? monitorBase + '/whep?token=' + encodeURIComponent(monitorToken) : '';

let pc = null, camStream = null, sendStream = null, wakeLock = null, drawing = false, pollTimer = null;
let retourPc = null;
let clockOffset = 0;
// Bugliste 2026-09-25 Nachtrag ("Trennen"-Button hängt fest): Timer für
// die Kulanzfrist nach `disconnected`, s. `connect()`s `onconnectionstatechange`.
let disconnectGraceTimer = null;

$('setupHint').textContent = hasRetour
  ? 'Diese Einladung bringt auch ein Retourbild mit — nach dem Verbinden erscheinen Kamera- und Retourbild nebeneinander.'
  : '';

// ---- Uhrenabgleich (Messmodus): Versatz Handy-Uhr -> Server-Uhr, kleinste RTT gewinnt ----
async function syncClock() {
  let best = null;
  for (let i = 0; i < 10; i++) {
    const t0 = performance.now();
    const r = await fetch('/clock', { cache: 'no-store' });
    const s = await r.json();
    const rtt = performance.now() - t0;
    const off = s.ms - (Date.now() - rtt / 2);
    if (!best || rtt < best.rtt) best = { rtt, off };
  }
  clockOffset = best.off;
  $('clockInfo').textContent = `Uhrenversatz ${best.off.toFixed(1)} ms (RTT ${best.rtt.toFixed(1)} ms) — Messfehler ≈ ±${(best.rtt / 2).toFixed(1)} ms`;
}

// ---- Zeitstempel-Streifen: 1 Marker + 44 Bit Server-ms + 4 Bit Prüfsumme (s. pipeline.rs) ----
function drawStrip(ctx, w, h) {
  const ts = Math.round(Date.now() + clockOffset);
  const bits = [1];
  for (let i = 43; i >= 0; i--) bits.push(Math.floor(ts / 2 ** i) % 2);
  let sum = 0;
  for (let k = 0; k < 11; k++) sum += Math.floor(ts / 16 ** k) % 16;
  const chk = sum % 16;
  for (let i = 3; i >= 0; i--) bits.push((chk >> i) & 1);
  const cw = w / 49, sh = Math.ceil(h / 40);
  for (let i = 0; i < 49; i++) {
    ctx.fillStyle = bits[i] ? '#fff' : '#000';
    ctx.fillRect(Math.floor(i * cw), 0, Math.ceil(cw), sh);
  }
}

async function listCameras() {
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'videoinput');
  const sel = $('camera');
  const cur = sel.value;
  sel.innerHTML = '';
  devs.forEach((d, i) => sel.add(new Option(d.label || 'Kamera ' + (i + 1), d.deviceId)));
  if (cur) sel.value = cur;
}

async function openCamera() {
  const [w, h] = $('res').value.split('x').map(Number);
  const fps = Number($('fps').value);
  const video = { width: { ideal: w }, height: { ideal: h }, frameRate: { ideal: fps } };
  if ($('camera').value) video.deviceId = { exact: $('camera').value };
  else video.facingMode = 'environment';
  camStream = await navigator.mediaDevices.getUserMedia({ video, audio: $('audio').checked });
  await listCameras(); // erst nach der Freigabe sind die Kameranamen sichtbar
  $('preview').srcObject = camStream;
  const t = camStream.getVideoTracks()[0];
  if (t) { t.contentHint = 'motion'; log('Kamera: ' + t.label + ' ' + JSON.stringify(t.getSettings())); }
  return { w, h, fps };
}

// ---- Kachel-Layout: 'split' (halb/halb, Standard), 'cam-large', 'retour-large' (Nutzerauftrag: Tap zum Vergrößern) ----
function setLayout(mode) {
  const tiles = $('tiles');
  tiles.classList.remove('cam-large', 'retour-large');
  if (mode === 'cam-large') tiles.classList.add('cam-large');
  else if (mode === 'retour-large') tiles.classList.add('retour-large');
}
function onTileTap(role) {
  if (!hasRetour) return; // ohne Retourbild gibt es nichts zu vergrößern/PIPen
  const tiles = $('tiles');
  const current = tiles.classList.contains('cam-large') ? 'cam-large'
    : tiles.classList.contains('retour-large') ? 'retour-large' : 'split';
  const tapped = role === 'cam' ? 'cam-large' : 'retour-large';
  setLayout(current === tapped ? 'split' : tapped);
}

async function start() {
  clearConnectError();
  if (!window.isSecureContext) {
    showConnectError(
      'Diese Seite muss über eine sichere (https-)Verbindung geöffnet werden, sonst funktioniert der Kamera-Zugriff nicht.',
      'Kein sicherer Kontext — Seite per HTTPS öffnen (Kamera-Zugriff).'
    );
    return;
  }
  if (!inviteToken) {
    showConnectError(
      'Kein gültiger Einladungslink. Bitte den Link oder QR-Code vom Bediener/der Regie neu anfordern.',
      'kein Einladungslink — diese Seite ohne gültigen Link (mit "?token=…") geöffnet.'
    );
    return;
  }
  $('start').disabled = true;
  try {
    const { fps } = await openCamera();
    const measure = $('measure').checked;
    sendStream = camStream;
    if (measure) {
      await syncClock();
      // Kamerabild + Zeitstempel über eine Canvas senden (kostet etwas Latenz
      // gegenüber dem direkten Kameratrack — nur im Messmodus).
      const vs = camStream.getVideoTracks()[0].getSettings();
      const cv = document.createElement('canvas');
      cv.width = vs.width; cv.height = vs.height;
      const ctx = cv.getContext('2d');
      const src = document.createElement('video');
      src.muted = true; src.playsInline = true; src.srcObject = camStream; await src.play();
      drawing = true;
      // Feste Bildrate per Timer (mit Drift-Ausgleich) statt an die Frames
      // des Kameratracks gekoppelt: der Kameratrack liefert je nach Gerät
      // unregelmäßig, das ergäbe Lücken im MXL-Flow (Latenzsprünge).
      const period = 1000 / fps;
      let next = performance.now();
      const tick = () => {
        if (!drawing) return;
        ctx.drawImage(src, 0, 0, cv.width, cv.height);
        drawStrip(ctx, cv.width, cv.height);
        next += period;
        setTimeout(tick, Math.max(0, next - performance.now()));
      };
      tick();
      sendStream = new MediaStream([...cv.captureStream(fps).getVideoTracks(), ...camStream.getAudioTracks()]);
    }
    await connect(sendStream);
    if (hasRetour) {
      // Retourbild-Verbindung ist ein reiner Zusatznutzen — ein Fehler
      // hier darf die bereits laufende Kamera-Sendung nicht abbrechen,
      // daher eigenes try/catch statt im selben Ablauf wie oben.
      try { await connectRetour(); } catch (e) { log('Retourbild-FEHLER: ' + (e.message || e)); }
    }
    $('setup').style.display = 'none';
    $('live').classList.add('active');
    $('tiles').classList.toggle('single', !hasRetour);
    $('retourTile').hidden = !hasRetour;
    $('retourConnRow').hidden = !hasRetour;
    $('camLabel').hidden = !hasRetour; // nur bei zwei Kacheln braucht es Beschriftung, sonst eindeutig
    setLayout('split');
    $('latRow').hidden = !measure;
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (_) {}
    pollTimer = setInterval(pollStats, 500);
  } catch (e) {
    showConnectError(friendlyConnectError(e), e.message || String(e));
    await stop(true);
  }
}

async function connect(stream) {
  pc = new RTCPeerConnection({ iceServers: [] });
  const thisPc = pc;
  for (const t of stream.getTracks()) pc.addTrack(t, stream);
  // H.264 bevorzugen: Handys kodieren es in Hardware (geringe Latenz, wenig Akku).
  const caps = RTCRtpSender.getCapabilities('video').codecs;
  const h264 = caps.filter((c) => c.mimeType === 'video/H264');
  const vt = pc.getTransceivers().find((t) => t.sender.track && t.sender.track.kind === 'video');
  if (h264.length && vt) vt.setCodecPreferences([...h264, ...caps.filter((c) => c.mimeType !== 'video/H264')]);
  else log('WARNUNG: kein H.264 im Browser verfügbar');
  // Bugliste 2026-09-25 Nachtrag ("Trennen"-Button hängt nach
  // server-seitigem Disconnect fest"): bislang wurde `stop()` NUR vom
  // eigenen "Trennen"-Klick (oder dem Fehlerpfad in `start()`) erreicht
  // — endete die Verbindung von SICH AUS (Regie widerruft die Einladung
  // + `gateway.teardown()`), blieb `#live` mit dem "Verbindung trennen"-
  // Button einfach stehen, obwohl längst nichts mehr verbunden war.
  // `failed`/`closed` lösen den Reset sofort aus; `disconnected` (kann
  // ein kurzer WLAN-Hänger sein, den die ICE-Sitzung von selbst wieder
  // berapariert) bekommt erst eine kurze Kulanzfrist, damit ein
  // Netzwerk-Blip nicht sofort die ganze Sitzung killt.
  pc.onconnectionstatechange = () => {
    $('conn').textContent = pc.connectionState;
    setBadges();
    const state = thisPc.connectionState;
    if (state === 'connected' && disconnectGraceTimer) {
      clearTimeout(disconnectGraceTimer);
      disconnectGraceTimer = null;
    } else if (state === 'failed' || state === 'closed') {
      if (disconnectGraceTimer) { clearTimeout(disconnectGraceTimer); disconnectGraceTimer = null; }
      if (pc === thisPc) stop(false);
    } else if (state === 'disconnected' && !disconnectGraceTimer) {
      disconnectGraceTimer = setTimeout(() => {
        disconnectGraceTimer = null;
        if (pc === thisPc && thisPc.connectionState !== 'connected') stop(false);
      }, 4000);
    }
  };
  await pc.setLocalDescription(await pc.createOffer());
  await new Promise((r) => { if (pc.iceGatheringState === 'complete') r(); else
    pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && r(); });
  const res = await fetch(whipUrl, { method: 'POST', headers: { 'Content-Type': 'application/sdp' }, body: pc.localDescription.sdp });
  const text = await res.text();
  if (res.status !== 201) throw new Error('WHIP ' + res.status + ': ' + text);
  await pc.setRemoteDescription({ type: 'answer', sdp: text });
  // Sender-Parameter: Bitrate begrenzen, Bildrate vor Auflösung halten.
  const sender = vt && vt.sender;
  if (sender) {
    const p = sender.getParameters();
    if (!p.encodings || !p.encodings.length) p.encodings = [{}];
    p.encodings[0].maxBitrate = 6_000_000;
    p.degradationPreference = 'maintain-framerate';
    try { await sender.setParameters(p); } catch (_) {}
  }
  log('WHIP verbunden');
}

// ---- Retourbild: direkte WHEP-Verbindung zur gepaarten Monitor-Node-Instanz ----
// (identisches Protokoll wie monitor.html — hier eingebettet statt einer
// zweiten Seite, weil Nutzerauftrag 2026-09-24 EIN kombiniertes Erlebnis
// verlangt: "Kamerabild UND Retourbild ... nicht zwei separate Links").
async function connectRetour() {
  retourPc = new RTCPeerConnection({ iceServers: [] });
  retourPc.addTransceiver('video', { direction: 'recvonly' });
  retourPc.addTransceiver('audio', { direction: 'recvonly' });
  const caps = RTCRtpReceiver.getCapabilities('video').codecs;
  const h264 = caps.filter((c) => c.mimeType === 'video/H264');
  const vt = retourPc.getTransceivers()[0];
  if (h264.length) vt.setCodecPreferences([...h264, ...caps.filter((c) => c.mimeType !== 'video/H264')]);
  for (const t of retourPc.getTransceivers()) {
    try { t.receiver.jitterBufferTarget = 0; } catch (_) {}
    try { t.receiver.playoutDelayHint = 0; } catch (_) {}
  }
  const ms = new MediaStream();
  $('retourVideo').srcObject = ms;
  retourPc.ontrack = (e) => { ms.addTrack(e.track); log('Retourbild-Track: ' + e.track.kind); };
  retourPc.onconnectionstatechange = () => { $('retourConn').textContent = retourPc.connectionState; setBadges(); };
  await retourPc.setLocalDescription(await retourPc.createOffer());
  await new Promise((r) => { if (retourPc.iceGatheringState === 'complete') r(); else
    retourPc.onicegatheringstatechange = () => retourPc.iceGatheringState === 'complete' && r(); });
  const res = await fetch(whepUrl, { method: 'POST', headers: { 'Content-Type': 'application/sdp' }, body: retourPc.localDescription.sdp });
  const text = await res.text();
  if (res.status !== 201) throw new Error('WHEP ' + res.status + ': ' + text);
  await retourPc.setRemoteDescription({ type: 'answer', sdp: text });
  log('Retourbild (WHEP) verbunden');
}

function setBadges() {
  const camBadge = $('camBadge');
  const camLive = pc && pc.connectionState === 'connected';
  camBadge.textContent = camLive ? 'LIVE' : (pc ? pc.connectionState : 'Bereit');
  camBadge.className = 'badge' + (camLive ? ' live' : '');
  if (hasRetour) {
    const retourBadge = $('retourBadge');
    const retourLive = retourPc && retourPc.connectionState === 'connected';
    retourBadge.textContent = retourLive ? 'LIVE' : (retourPc ? retourPc.connectionState : '–');
    retourBadge.className = 'badge' + (retourLive ? ' live' : '');
  }
}

async function pollStats() {
  try {
    const g = async (n) => (await (await fetch('/params/' + n, { cache: 'no-store' })).json()).value;
    if (!$('latRow').hidden) {
      const [avg, max] = await Promise.all([g('e2eLatencyMs'), g('e2eLatencyMaxMs')]);
      $('lat').textContent = avg == null ? '–' : avg.toFixed(0);
      $('latMax').textContent = max == null ? '–' : max.toFixed(0);
    }
  } catch (_) {}
}

async function stop(quiet) {
  drawing = false;
  clearInterval(pollTimer);
  if (disconnectGraceTimer) { clearTimeout(disconnectGraceTimer); disconnectGraceTimer = null; }
  try { await fetch(whipUrl, { method: 'DELETE' }); } catch (_) {}
  if (pc) { pc.close(); pc = null; }
  if (retourPc) { retourPc.close(); retourPc = null; }
  $('retourVideo').srcObject = null;
  for (const s of [camStream, sendStream]) s && s.getTracks().forEach((t) => t.stop());
  camStream = sendStream = null;
  try { await wakeLock?.release(); } catch (_) {}
  $('live').classList.remove('active');
  $('statusPanel').classList.remove('open');
  setLayout('split');
  $('setup').style.display = '';
  $('start').disabled = false;
  $('conn').textContent = '–'; $('retourConn').textContent = '–'; setBadges();
  if (!quiet) log('gestoppt');
}

$('start').onclick = start;
$('stop').onclick = () => stop(false);
$('toggleStatus').onclick = () => $('statusPanel').classList.toggle('open');
$('tiles').querySelector('[data-role="cam"]').addEventListener('click', () => onTileTap('cam'));
$('retourTile').addEventListener('click', () => onTileTap('retour'));
document.addEventListener('visibilitychange', async () => {
  // Wake-Lock geht beim Wechsel in den Hintergrund verloren.
  if (document.visibilityState === 'visible' && pc) { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (_) {} }
});
if (!window.isSecureContext) log('Hinweis: Kamera-Zugriff braucht HTTPS (oder localhost).');
navigator.mediaDevices?.enumerateDevices().then(listCameras).catch(() => {});
</script>
