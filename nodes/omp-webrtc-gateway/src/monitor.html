<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>OMP Monitor</title>
<style>
  :root { color-scheme: dark; --bg:#121212; --surface:#1e1e1e; --text:#eaeaea; --dim:#9a9a9a;
          --err:#ef5350; --accent:#4c8dff; }
  * { box-sizing: border-box; }
  body { margin:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:var(--bg);
         color:var(--text); font:16px/1.4 system-ui,sans-serif; max-width:720px; margin-inline:auto; }
  h1 { font-size:18px; margin:4px 0 12px; }
  .screen { position:relative; background:#000; border-radius:8px; overflow:hidden; aspect-ratio:16/9; }
  video { width:100%; height:100%; object-fit:contain; display:block; }
  .badge { position:absolute; top:8px; left:8px; padding:2px 10px; border-radius:12px; font-size:13px;
           font-weight:600; background:#000a; }
  .badge.live { color:#fff; background:var(--err); }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  button { font:inherit; padding:10px; border-radius:8px; border:1px solid #444; background:var(--surface);
           color:var(--text); min-height:44px; flex:1; font-weight:600; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.stop { background:var(--err); border-color:var(--err); color:#fff; }
  button:disabled { opacity:.45; }
  .check { display:flex; align-items:center; gap:8px; font-size:15px; flex:1 1 100%; }
  .check input { width:22px; height:22px; }
  .stats { margin-top:12px; padding:10px 12px; background:var(--surface); border-radius:8px; font-size:14px; }
  .stats b.big { font-size:26px; font-variant-numeric:tabular-nums; }
  .dim { color:var(--dim); }
  #log { margin-top:8px; font:12px ui-monospace,monospace; color:var(--dim); white-space:pre-wrap; max-height:8em; overflow:auto; }
</style>
</head>
<body>
<h1>OMP Monitor</h1>

<div class="screen">
  <video id="v" autoplay muted playsinline></video>
  <span id="badge" class="badge">Bereit</span>
</div>

<div class="row">
  <button id="start" class="primary">Ansehen</button>
  <button id="stop" class="stop" disabled>Stopp</button>
  <button id="unmute" disabled>Ton an</button>
</div>
<div class="row">
  <label class="check"><input type="checkbox" id="measure"> Latenz messen (Quelle mit Zeitstempel-Streifen, z. B. Kamera im Messmodus)</label>
</div>

<div class="stats">
  <div>Verbindung: <b id="conn">–</b> · <span id="res" class="dim">–</span></div>
  <div id="latRow" hidden>Latenz Kamera→Monitor: <b class="big" id="lat">–</b> ms
    <span class="dim">(Ø · min <span id="latMin">–</span> · max <span id="latMax">–</span> ms · <span id="latN">0</span> Bilder)</span></div>
  <div class="dim" id="clockInfo"></div>
</div>
<div id="log"></div>

<script>
// i18n (de/en): Sprache per ?lang=, sonst Browsersprache (Handy-Seite ohne Shell); Fallback Deutsch.
const LANG = ((new URLSearchParams(location.search).get("lang") || navigator.language || "de").toLowerCase().startsWith("de")) ? "de" : "en";
const T = (() => {
  const D = {
    de: {
        "pmon.21da36": "Uhrenversatz {p0} ms (RTT {p1} ms) — Messfehler ≈ ±{p2} ms",
        "pmon.ad383a": "FEHLER: kein Einladungslink — diese Seite ohne gültigen Link (mit \"?token=…\") geöffnet. Bitte den Link/QR-Code vom Bediener verwenden.",
        "pmon.d8bca6": "Track: ",
        "pmon.6ae95a": "WHEP verbunden",
        "pmon.a6d4c8": " · Jitterbuffer {p0} ms",
        "pmon.379ee8": "Bereit",
        "pmon.9582c5": "Ton an",
        "pmon.cd35c7": "Ton aus"
    },
    en: {
        "pmon.21da36": "Clock offset {p0} ms (RTT {p1} ms) — measurement error ≈ ±{p2} ms",
        "pmon.ad383a": "ERROR: no invitation link — this page was opened without a valid link (with \"?token=…\"). Please use the link/QR code from the operator.",
        "pmon.d8bca6": "Track: ",
        "pmon.6ae95a": "WHEP connected",
        "pmon.a6d4c8": " · jitter buffer {p0} ms",
        "pmon.379ee8": "Ready",
        "pmon.9582c5": "Sound on",
        "pmon.cd35c7": "Sound off"
    },
  };
  return (k, p) => {
    let s = (D[LANG] && D[LANG][k]) ?? D.de[k] ?? k;
    if (p) for (const x in p) s = s.split("{" + x + "}").join(p[x]);
    return s;
  };
})();
// Statische Texte der Seite (Markup) per exaktem Textvergleich übersetzen.
(() => {
  if (LANG !== "en") return;
  const MAP = {"(Ø · min": "(avg · min", "Ansehen": "Watch", "Bereit": "Ready", "Bilder)": "frames)", "Latenz Kamera→Monitor:": "Latency camera→monitor:", "Latenz messen (Quelle mit Zeitstempel-Streifen, z. B. Kamera im Messmodus)": "Measure latency (source with timestamp strip, e.g. camera in measurement mode)", "Stopp": "Stop", "Ton an": "Sound on", "Verbindung:": "Connection:", "ms ·": "ms ·", "· max": "· max"};
  document.documentElement.lang = "en";
  document.title = "OMP Monitor";
  const walk = (n) => {
    for (const k of n.childNodes) {
      if (k.nodeType === 3) {
        const t = k.textContent.trim();
        if (MAP[t]) k.textContent = k.textContent.replace(t, MAP[t]);
      } else if (k.nodeType === 1 && !["SCRIPT", "STYLE"].includes(k.tagName)) {
        for (const a of ["title", "placeholder", "aria-label"]) { const v = k.getAttribute(a); if (v && MAP[v]) k.setAttribute(a, MAP[v]); }
        walk(k);
      }
    }
  };
  walk(document.body);
})();

const $ = (id) => document.getElementById(id);
const log = (t) => { const l = $('log'); l.textContent = new Date().toLocaleTimeString() + ' ' + t + '\n' + l.textContent; };

// Einladungs-Token (Nutzerwunsch 2026-09-23, "security!") — s.
// camera.html-Kommentar (identisches Muster).
const inviteToken = new URLSearchParams(location.search).get('token') || '';
const whepUrl = '/whep' + (inviteToken ? '?token=' + encodeURIComponent(inviteToken) : '');

let pc = null, clockOffset = 0, measuring = false, samples = [], statsTimer = null;

async function syncClock() {
  let best = null;
  for (let i = 0; i < 10; i++) {
    const t0 = performance.now();
    const s = await (await fetch('/clock', { cache: 'no-store' })).json();
    const rtt = performance.now() - t0;
    const off = s.ms - (Date.now() - rtt / 2);
    if (!best || rtt < best.rtt) best = { rtt, off };
  }
  clockOffset = best.off;
  $('clockInfo').textContent = T("pmon.21da36", { p0: best.off.toFixed(1), p1: best.rtt.toFixed(1), p2: (best.rtt / 2).toFixed(1) });
}

// Zeitstempel-Streifen lesen (1 Marker + 44 Bit Server-ms + 4 Bit Prüfsumme, s. camera.html/pipeline.rs)
const strip = document.createElement('canvas');
strip.width = 49 * 8; strip.height = 8;
const sctx = strip.getContext('2d', { willReadFrequently: true });
function readStrip(v) {
  sctx.drawImage(v, 0, 0, v.videoWidth, Math.max(1, v.videoHeight / 40), 0, 0, strip.width, strip.height);
  const row = sctx.getImageData(0, 4, strip.width, 1).data;
  const bits = [];
  for (let i = 0; i < 49; i++) bits.push(row[(i * 8 + 4) * 4] > 127 ? 1 : 0);
  if (!bits[0]) return null;
  let ts = 0;
  for (let i = 1; i <= 44; i++) ts = ts * 2 + bits[i];
  let sum = 0;
  for (let k = 0; k < 11; k++) sum += Math.floor(ts / 16 ** k) % 16;
  const chk = (bits[45] << 3) | (bits[46] << 2) | (bits[47] << 1) | bits[48];
  return sum % 16 === chk ? ts : null;
}

function measureLoop(v) {
  if (!measuring) return;
  const tick = () => {
    if (!measuring) return;
    const ts = readStrip(v);
    if (ts !== null) {
      const lat = Date.now() + clockOffset - ts;
      if (Math.abs(lat) < 60000) {
        samples.push(lat); if (samples.length > 50) samples.shift();
        const avg = samples.reduce((a, b) => a + b, 0) / samples.length;
        $('lat').textContent = avg.toFixed(0);
        $('latMin').textContent = Math.min(...samples).toFixed(0);
        $('latMax').textContent = Math.max(...samples).toFixed(0);
        $('latN').textContent = samples.length;
      }
    }
    if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(tick); else requestAnimationFrame(tick);
  };
  tick();
}

async function start() {
  if (!inviteToken) {
    log(T("pmon.ad383a"));
    return;
  }
  $('start').disabled = true;
  try {
    pc = new RTCPeerConnection({ iceServers: [] });
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.addTransceiver('audio', { direction: 'recvonly' });
    const caps = RTCRtpReceiver.getCapabilities('video').codecs;
    const h264 = caps.filter((c) => c.mimeType === 'video/H264');
    const vt = pc.getTransceivers()[0];
    if (h264.length) vt.setCodecPreferences([...h264, ...caps.filter((c) => c.mimeType !== 'video/H264')]);
    // Geringste Wiedergabe-Verzögerung: Browser-Jitterbuffer minimal halten.
    for (const t of pc.getTransceivers()) {
      try { t.receiver.jitterBufferTarget = 0; } catch (_) {}
      try { t.receiver.playoutDelayHint = 0; } catch (_) {}
    }
    // webrtcbin sendet keine msid -> e.streams ist leer: Tracks selbst sammeln.
    const ms = new MediaStream();
    $('v').srcObject = ms;
    pc.ontrack = (e) => { ms.addTrack(e.track); log(T("pmon.d8bca6") + e.track.kind); };
    pc.onconnectionstatechange = () => { $('conn').textContent = pc.connectionState; setBadge(); };
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise((r) => { if (pc.iceGatheringState === 'complete') r(); else
      pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && r(); });
    const res = await fetch(whepUrl, { method: 'POST', headers: { 'Content-Type': 'application/sdp' }, body: pc.localDescription.sdp });
    const text = await res.text();
    if (res.status !== 201) throw new Error('WHEP ' + res.status + ': ' + text);
    await pc.setRemoteDescription({ type: 'answer', sdp: text });
    $('stop').disabled = false; $('unmute').disabled = false;
    if ($('measure').checked) {
      await syncClock();
      $('latRow').hidden = false;
      samples = []; measuring = true;
      const v = $('v');
      const go = () => measureLoop(v);
      if (v.readyState >= 2) go(); else v.addEventListener('loadeddata', go, { once: true });
    }
    statsTimer = setInterval(showStats, 1000);
    log(T("pmon.6ae95a"));
  } catch (e) {
    log('FEHLER: ' + (e.message || e));
    await stop(true);
  }
}

async function showStats() {
  if (!pc) return;
  const stats = await pc.getStats();
  stats.forEach((r) => {
    if (r.type === 'inbound-rtp' && r.kind === 'video') {
      $('res').textContent = `${r.frameWidth || '?'}×${r.frameHeight || '?'} @ ${r.framesPerSecond ?? '?'} fps`
        + (r.jitterBufferDelay && r.jitterBufferEmittedCount ? T("pmon.a6d4c8", { p0: (1000 * r.jitterBufferDelay / r.jitterBufferEmittedCount).toFixed(0) }) : '');
    }
  });
}

function setBadge() {
  const live = pc && pc.connectionState === 'connected';
  $('badge').textContent = live ? 'LIVE' : (pc ? pc.connectionState : T("pmon.379ee8"));
  $('badge').className = 'badge' + (live ? ' live' : '');
}

async function stop(quiet) {
  measuring = false; clearInterval(statsTimer);
  try { await fetch(whepUrl, { method: 'DELETE' }); } catch (_) {}
  if (pc) { pc.close(); pc = null; }
  $('v').srcObject = null;
  $('start').disabled = false; $('stop').disabled = true; $('unmute').disabled = true;
  $('conn').textContent = '–'; setBadge();
  if (!quiet) log('gestoppt');
}

$('start').onclick = start;
$('stop').onclick = () => stop(false);
$('unmute').onclick = () => { const v = $('v'); v.muted = !v.muted; $('unmute').textContent = v.muted ? T("pmon.9582c5") : T("pmon.cd35c7"); };
</script>
</body>
</html>
