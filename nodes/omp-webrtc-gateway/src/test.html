<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WHIP-Test</title>
<style>body{font:14px system-ui;margin:1rem}pre{white-space:pre-wrap}</style>
<h3>omp-webrtc-gateway — WHIP-Sendetest</h3>
<button id="go">Kamera senden</button> <button id="stop" disabled>Stop</button>
<video id="v" autoplay muted playsinline width="320"></video>
<pre id="out"></pre>
<script>
const out = (t) => { document.getElementById('out').textContent += t + '\n'; };
let pc;
document.getElementById('go').onclick = async () => {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: 1280, height: 720, frameRate: 30 }, audio: true });
  document.getElementById('v').srcObject = stream;
  pc = new RTCPeerConnection({ iceServers: [] });
  for (const t of stream.getTracks()) pc.addTrack(t, stream);
  // H.264 bevorzugen (Handys kodieren hardwarebeschleunigt).
  const caps = RTCRtpSender.getCapabilities('video').codecs;
  const h264 = caps.filter(c => c.mimeType === 'video/H264');
  out('H264 verfuegbar: ' + h264.length);
  const vt = pc.getTransceivers().find(t => t.sender.track && t.sender.track.kind === 'video');
  if (h264.length && vt) vt.setCodecPreferences([...h264, ...caps.filter(c => c.mimeType !== 'video/H264')]);
  pc.onconnectionstatechange = () => out('connection: ' + pc.connectionState);
  await pc.setLocalDescription(await pc.createOffer());
  await new Promise(r => { if (pc.iceGatheringState === 'complete') r(); else
    pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && r(); });
  const res = await fetch('/whip', { method: 'POST', headers: { 'Content-Type': 'application/sdp' },
    body: pc.localDescription.sdp });
  const text = await res.text();
  out('WHIP ' + res.status);
  if (res.status !== 201) { out(text); return; }
  await pc.setRemoteDescription({ type: 'answer', sdp: text });
  document.getElementById('stop').disabled = false;
};
document.getElementById('stop').onclick = async () => {
  await fetch('/whip', { method: 'DELETE' }); pc && pc.close(); out('gestoppt');
};
</script>
