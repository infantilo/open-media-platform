[package]
name = "omp-audio-mixer"
version = "0.1.0"
edition = "2024"
# Projektlizenz noch nicht entschieden (docs/decisions.md, Schritt C1) —
# publish=false wie bei omp-node-sdk/omp-switcher/omp-video-mixer-me.
publish = false

[dependencies]
gstreamer = "0.25.3"
omp-mediaio = { version = "0.1.0", path = "../omp-mediaio", features = ["mxl", "levels"] }
omp-node-sdk = { version = "0.1.0", path = "../omp-node-sdk" }
serde_json = "1.0.150"
# Media-Automation (Kapitel 26): HTTP-Aufrufe gegen den Orchestrator-Proxy, gleiche
# Version/Features wie omp-playout-automation (Minimal-Dependency-Regel: bereits im
# Workspace vorhanden, kein neuer Crate).
ureq = { version = "3.3.0", features = ["json"] }
tokio = { version = "1.52.3", features = ["rt", "macros", "signal", "sync", "time"] }
