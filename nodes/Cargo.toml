[workspace]
resolver = "2"
members = [
    "omp-mediaio",
    "omp-resolver",
    "omp-node-sdk",
    "playout",
    "omp-source",
    "omp-decklink",
    "omp-viewer",
    "omp-switcher",
    "omp-video-mixer-me",
    "omp-audio-mixer",
    "omp-mxf-player",
    "omp-mxf-player-direct",
    "omp-channel-player",
    "omp-multiviewer",
    "omp-multiviewer-custom",
    "omp-playout-automation",
    "omp-srt-gateway",
    "omp-ograf",
    "omp-2110-gateway",
    "omp-aes67-gateway",
    "omp-fabrics-gateway",
    "omp-media-library",
    "omp-scte35",
    "omp-recorder",
    "omp-scaler",
    "omp-audio-monitor",
    "omp-pipeline-controller",
    "omp-scope",
    "omp-webrtc-gateway",
]

# Eigener Rust-Code mit Pixel-Schleifen (v210-Packen/Alpha-Key-Extraktion in
# omp-mediaio bzw. omp-ograf) läuft im Debug-Profil (opt-level 0) um
# Größenordnungen langsamer als nötig: ein statisches 720p-Bild kostete in
# omp-ograf ~170 % CPU, fast nur in diesen Schleifen. Gezielt optimieren,
# ohne das übrige Debug-Profil (Kompilierzeit, Debug-Infos) anzutasten.
[profile.dev.package.omp-mediaio]
opt-level = 3
[profile.dev.package.omp-ograf]
opt-level = 3
# Audiomischer (Kapitel 26): EQ/Kompressor/Gate/Delay/Pan laufen als Per-Sample-
# Schleifen im Audio-Thread — unoptimiert (Debug) kostete 64 Kanäle ~680 % CPU.
[profile.dev.package.omp-audio-mixer]
opt-level = 3
