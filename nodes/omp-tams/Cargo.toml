[package]
name = "omp-tams"
version = "0.1.0"
edition = "2024"
# Kapitel 105 (TAMS-Client). Projektlizenz wie bei den übrigen Crates: publish=false.
publish = false

[dependencies]
# Minimal-Dependency-Regel (UMSETZUNG §0 Nr. 5): TAMS ist eine JSON-API. serde/serde_json
# sind bereits im Abhängigkeitsbaum (omp-audio-mixer, omp-recorder), nichts Neues.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# HTTP-Client: ureq ist bereits die Wahl aller Node-Crates (Version wie omp-node-sdk), kein neuer Baum-Eintrag.
ureq = { version = "3.3.0", features = ["json"] }
# Testserver, der die Spezifikation nachstellt (Feature `testserver`, auch für omp-tams-writer): tiny_http ist schon im Baum.
tiny_http = { version = "0.12.0", optional = true }

[features]
testserver = ["dep:tiny_http"]

[dev-dependencies]
omp-tams = { path = ".", features = ["testserver"] }
