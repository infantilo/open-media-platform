[package]
name = "omp-mxf-player"
version = "0.1.0"
edition = "2024"
# Projektlizenz noch nicht entschieden (docs/decisions.md, Schritt C1) —
# publish=false wie bei omp-node-sdk/omp-player.
publish = false

[dependencies]
gstreamer = "0.25.3"
# gstreamer-pbutils::Discoverer für die Dauer-Probe (gleiches Muster wie
# omp-player, s. dortige Cargo.toml-Doku).
gstreamer-pbutils = "0.25.2"
omp-mediaio = { version = "0.1.0", path = "../omp-mediaio", features = ["mxl"] }
omp-node-sdk = { version = "0.1.0", path = "../omp-node-sdk" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt", "macros", "signal", "sync", "time"] }
# Für orchestrator_settings.rs: Service-Token-Abruf + GET der
# Node-Typ-Einstellungen (ARCHITECTURE.md §24.1), gleiche Version wie
# omp-playout-automation/omp-pipeline-controller.
ureq = { version = "3.3.0", features = ["json"] }
