[package]
name = "omp-scte35"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
omp-node-sdk = { version = "0.1.0", path = "../omp-node-sdk" }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros", "signal", "sync", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
